name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests, generated files, budgets, content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:sw
      - run: node scripts/build-preload.mjs --check
      - run: npm run check:budgets
      - run: npm run lint:content
      - run: npm run lint:listening
      - run: npm run check:clips
      - run: npm run check:manga

  coverage:
    name: Coverage of the logic modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage

  rules:
    name: Database rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run every end-to-end script against the emulators
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx firebase emulators:exec --only database,auth --project sabina-s-workspace "node scripts/run-e2e.mjs --serve"
      - name: Keep the screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the budgets in lighthouserc.json
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run perf:budgets
        continue-on-error: true # LCP is over budget on five pages today (docs/PERFORMANCE.md); this job reports, it does not block
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: docs/PERFORMANCE.md
