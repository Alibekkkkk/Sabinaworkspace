<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/surfaces.css">

</head>
<body class="homework-page">

<div class="identity-banner" id="studentIdentityBanner" role="region" aria-label="Signed-in student"><span id="studentIdentityText"></span><button type="button" data-action="switch-student">Not you? Switch student</button></div>
<div class="hw-top" role="banner">
  <div class="mark" id="markIcon">📘</div>
  <div class="title-block">
    <div class="brand" id="hwTitle">Homework</div>
    <div class="sub" id="hwSub">Topic · Homework</div>
  </div>
  <div class="spacer"></div>
  <div id="teacherResetArea" class="phase0-inline-1">
    <button data-action="reset-homework-teacher" class="phase0-inline-2">🔄 Reset Whole Homework</button>
  </div>
  <button type="button" data-action="toggle-reading-prefs" aria-expanded="false" aria-controls="readingPrefs">Aa Reading</button>
  <button data-action="toggle-theme" id="themeButton">🌙 Theme</button>
  <a href="portal.html">← Classwork</a>
</div>

<div class="wrap" role="main">
  <section class="hero">
    <div>
      <div class="eyebrow" id="heroEyebrow">Topic · Homework</div>
      <h1 id="heroHeadline">Homework</h1>
      <p class="intro" id="heroIntro"></p>
    </div>
  </section>

  <div class="progress-shell">
    <span class="label">Progress</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-pct" id="progressPct">0%</span>
    <span class="label" id="progressCount">0 / 0 answered</span>
    <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
  </div>

  <div class="hw-split">
    <section class="reading-pane">
      <div class="passage" id="passageBody" role="region" aria-label="Reading passage" tabindex="0"></div>
    </section>
    <section class="questions-pane" id="questionsHost"></section>
  </div>

  <div class="submit-bar" id="submitBar">
    <div class="hint" id="submitHint">Answer every question to unlock submission. <b>0 remaining.</b></div>
    <button class="btn submit-btn" id="submitBtn" data-action="submit-homework" disabled>✓ Submit homework</button>
  </div>
</div>

<div class="ds-scrim" id="submitModal" hidden>
  <div class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="submitModalTitle" aria-describedby="submitModalBody">
    <h2 id="submitModalTitle">Submit your homework?</h2>
    <div id="submitModalBody"></div>
    <p class="hint">You can only submit once. Your teacher sees your answers straight away.</p>
    <div class="ds-modal__actions">
      <button type="button" class="ds-btn ds-btn--secondary" id="keepWorkingBtn" data-action="cancel-submit">Keep working</button>
      <button type="button" class="ds-btn ds-btn--primary" data-action="confirm-submit">Submit now</button>
    </div>
  </div>
</div>

<div id="customContextMenu" class="context-menu"></div>

<div id="stickyNote" class="sticky-note">
  <div class="sticky-header" id="stickyDragHandle">
    <span class="sticky-title">📝 My Note</span>
    <div class="sticky-actions">
      <button class="sticky-btn delete" data-action="delete-current-note" title="Delete Note">🗑️</button>
      <button class="sticky-btn" data-action="close-sticky-note" title="Close">✕</button>
    </div>
  </div>
  <div class="sticky-body">
    <textarea class="sticky-text" id="stickyText" placeholder="Type your note here..."></textarea>
  </div>
</div>

<div class="vocab-backdrop" id="vocabBackdrop" data-action="close-vocab-backdrop">
  <div class="vocab-card">
    <button class="close-x" data-action="close-vocab">×</button>
    <div class="head">
      <div class="emoji" id="vocabEmoji">📖</div>
      <div class="word" id="vocabWord"></div>
    </div>
    <div id="vocabMeanings"></div>
  </div>
</div>

</body>
</html>
