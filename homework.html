function renderWords(){

  ).join('');

function renderPassage(){
  const container=document.getElementById('passage');

  wrapKeywordsInNode(container,words);
  container.querySelectorAll('.kw').forEach(btn=>{btn.onclick=()=>openKw(btn.dataset.kw)});
}
function wrapKeywordsInNode(node,words){
  if(node.nodeType===3){
    const text=node.textContent;
    let result=text;
    words.forEach(w=>{
      const escW=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b('+escW+')\\b','gi');
      result=result.replace(re,'\u0001'+w.toLowerCase()+'\u0002$1\u0003');
    });
    if(result!==text){
      const span=document.createElement('span');
      span.innerHTML=result.replace(/\u0001/g,'<button class="kw" data-kw="').replace(/\u0002/g,'">').replace(/\u0003/g,'</button>');
      node.parentNode.replaceChild(span,node);
    }
  } else if(node.nodeType===1&&!node.classList.contains('kw')&&!node.classList.contains('kw-emoji')){
    Array.from(node.childNodes).forEach(c=>wrapKeywordsInNode(c,words));
  }
}
function openKw(word){
  const key=String(word).toLowerCase();
  const data=WORD_LOOKUP[key];
  if(!data)return;
  currentKwWord=data.en;
  const custom=customImages[data.en];
  const emojiEl=document.getElementById('kwEmoji');
  if(custom){emojiEl.innerHTML='<img src="'+esc(custom)+'" style="max-width:120px;max-height:120px;border-radius:12px;" onerror="this.parentNode.textContent=\''+data.emo+'\'">'}
  else{emojiEl.textContent=data.emo}
  document.getElementById('kwWord').textContent=data.en;
  document.getElementById('kwRu').textContent=data.ru;
  document.getElementById('kwBackdrop').classList.add('open');
  document.getElementById('kwEditBtn').classList.toggle('show',teacherCanEdit);
  speakBritish(data.en);
}

  const trimmed=url.trim();
  if(trimmed&&!/^https?:\/\//i.test(trimmed)){alert('Use a URL starting with http:// or https://');return}

}

/* ============ BRITISH ACCENT ============ */
let ukVoice=null;
function pickUKVoice(){
  if(!('speechSynthesis' in window))return null;
  const voices=window.speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='en-GB')||
         voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en-gb'))||
         voices.find(v=>v.name&&/british|uk|england|daniel|kate|serena|oliver|libby|sonia/i.test(v.name))||
         null;
}
if('speechSynthesis' in window){ukVoice=pickUKVoice();window.speechSynthesis.onvoiceschanged=()=>{ukVoice=pickUKVoice()}}
function speakBritish(text){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-GB';u.rate=.9;u.pitch=1;
    if(ukVoice)u.voice=ukVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function renderQuestions(){
  const root=document.getElementById('questions');root.innerHTML='';
  lesson.questions.forEach((q,i)=>{
    const card=document.createElement('article');
    card.className='question';card.id='q'+i;
    const typeLabel={choice:'Choose',select:'Vocabulary',input:'Complete',tf:'True or false',order:'Word order'}[q.type];
    card.innerHTML='<div class="qhead">Question '+(i+1)+' of '+lesson.questions.length+' · '+typeLabel+'</div><div class="prompt">'+esc(q.prompt)+'</div>';
    if(q.type==='choice'||q.type==='tf'){
      const opts=q.type==='tf'?['True','False']:q.options;
      const box=document.createElement('div');box.className='options';
      opts.forEach(o=>{const b=document.createElement('button');b.className='pick';b.textContent=o;b.dataset.value=o;b.onclick=()=>selectOption(i,card,o);box.appendChild(b)});
      card.appendChild(box);
    } else if(q.type==='select'){
      const row=document.createElement('div');row.className='row';
      const s=document.createElement('select');s.className='answer';
      s.innerHTML='<option value="">Choose an answer…</option>'+q.options.map(o=>'<option>'+esc(o)+'</option>').join('');
      s.onchange=()=>{if(submitted)return;recordAnswer(i,s.value)};
      row.appendChild(s);card.appendChild(row);
    } else if(q.type==='input'){
      const row=document.createElement('div');row.className='row';
      const input=document.createElement('input');input.className='answer';input.placeholder='Type your answer';input.autocomplete='off';
      input.oninput=()=>{if(submitted)return;recordAnswer(i,input.value.trim())};
      row.appendChild(input);card.appendChild(row);
    } else {
      const bank=document.createElement('div');bank.className='orderbank';
      const line=document.createElement('div');line.className='orderline';
      let picked=[];
      const shuffled=q.words.slice().sort(()=>Math.random()-.5);
      shuffled.forEach(w=>{const b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{if(submitted)return;picked.push(w);b.disabled=true;line.innerHTML=picked.map(x=>'<span class="chip">'+esc(x)+'</span>').join(' ');recordAnswer(i,picked.slice())};bank.appendChild(b)});
      const reset=document.createElement('button');reset.className='pick';reset.textContent='Reset';reset.style.marginTop='10px';
      reset.onclick=()=>{if(submitted)return;picked=[];line.innerHTML='';bank.querySelectorAll('button').forEach(b=>{if(b!==reset)b.disabled=false});recordAnswer(i,[]);};
      card.append(bank,line,reset);
    }
    const fb=document.createElement('div');fb.className='feedback';fb.id='fb'+i;card.appendChild(fb);
    root.appendChild(card);
    if(answers[i]!==undefined)restoreAnswer(i,answers[i]);
  });
  updateFinishBar();
}
function selectOption(i,card,value){
  if(submitted)return;
  card.querySelectorAll('.pick').forEach(p=>p.classList.remove('selected'));
  const btn=Array.from(card.querySelectorAll('.pick')).find(p=>p.dataset.value===value);
  if(btn)btn.classList.add('selected');
  recordAnswer(i,value);
}
function recordAnswer(i,value){
  if(submitted)return;
  const isComplete=Array.isArray(value)?value.length>0:(value!==undefined&&value!==null&&value!=='');
  if(isComplete)answers[i]=value;else delete answers[i];
  updateFinishBar();
}
function restoreAnswer(i,value){
  const card=document.getElementById('q'+i);if(!card)return;
  const q=lesson.questions[i];
  if(q.type==='choice'||q.type==='tf'){card.querySelectorAll('.pick').forEach(p=>{if(p.dataset.value===value)p.classList.add('selected')})}
  else if(q.type==='select'){const s=card.querySelector('select');if(s)s.value=value}
  else if(q.type==='input'){const inp=card.querySelector('input');if(inp)inp.value=value}
  else if(q.type==='order'){
    const line=card.querySelector('.orderline');
    if(line&&Array.isArray(value))line.innerHTML=value.map(x=>'<span class="chip">'+esc(x)+'</span>').join(' ');
    card.querySelectorAll('.chip').forEach(c=>{if(Array.isArray(value)&&value.indexOf(c.textContent)!==-1)c.disabled=true});
  }
}
function updateFinishBar(){
  const total=lesson.questions.length;
  const count=Object.keys(answers).length;
  document.getElementById('finishCount').textContent=count+' of '+total+' questions answered';
  document.getElementById('finishBtn').disabled=count<total;
  document.getElementById('progressText').textContent=count+' / '+total+' answered';
  document.getElementById('progressFill').style.width=Math.round(count/total*100)+'%';
  if(!teacherMode)document.getElementById('finishBar').classList.add('show');
}

function submitAll(){
  if(submitted)return;
  if(Object.keys(answers).length<lesson.questions.length){
    if(!confirm('Some questions are still blank. Submit anyway?'))return;
  }
  submitted=true;
  let score=0;
  lesson.questions.forEach((q,i)=>{
    const card=document.getElementById('q'+i);
    const fb=document.getElementById('fb'+i);
    const userAns=answers[i];
    let ok=false;
    card.querySelectorAll('button,select,input').forEach(el=>el.disabled=true);
    if(q.type==='input'){
      const norm=s=>String(s).toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
      ok=q.answers.some(a=>norm(a)===norm(userAns));
      card.querySelector('input').classList.add(ok?'correct':'wrong');
      if(!ok){const c=document.createElement('div');c.style.cssText='margin-top:10px;padding:10px 14px;background:#e5f1e7;border-radius:8px;font-size:16px;color:#2c6653;';c.innerHTML='<b>Correct:</b> '+esc(q.answers[0]);card.appendChild(c);}
    } else if(q.type==='order'){
      ok=Array.isArray(userAns)&&userAns.length===q.answer.length&&userAns.every((w,k)=>w===q.answer[k]);
      card.querySelector('.orderline').classList.add(ok?'correct':'wrong');
      if(!ok){const c=document.createElement('div');c.style.cssText='margin-top:10px;padding:10px 14px;background:#e5f1e7;border-radius:8px;font-size:16px;color:#2c6653;';c.innerHTML='<b>Correct order:</b> '+q.answer.map(esc).join(' ');card.appendChild(c);}
    } else if(q.type==='tf'){
      ok=String(userAns)===q.answer;
      card.querySelectorAll('.pick').forEach(p=>{if(p.dataset.value===q.answer)p.classList.add('correct');else if(p.dataset.value===userAns&&!ok)p.classList.add('wrong')});
    } else {
      ok=String(userAns)===String(q.answer);
      if(q.type==='select'){
        const s=card.querySelector('select');s.classList.add(ok?'correct':'wrong');
        if(!ok){const c=document.createElement('div');c.style.cssText='margin-top:10px;padding:10px 14px;background:#e5f1e7;border-radius:8px;font-size:16px;color:#2c6653;';c.innerHTML='<b>Correct answer:</b> '+esc(q.answer);card.appendChild(c);}
      } else {
        card.querySelectorAll('.pick').forEach(p=>{if(p.dataset.value===q.answer)p.classList.add('correct');else if(p.dataset.value===userAns&&!ok)p.classList.add('wrong')});
      }
    }
    if(ok)score++;
    fb.className='feedback show '+(ok?'ok':'no');
    fb.innerHTML='<span class="en">'+(ok?'✓ Correct. ':'✗ Not quite. ')+esc(q.explain)+'</span><span class="ru">'+esc(q.explain_ru||'')+'</span>';
  });
  const total=lesson.questions.length;
  const summary=document.getElementById('summary');
  summary.className='summary show';
  summary.innerHTML='🎉 Homework finished! Score: <b>'+score+' / '+total+'</b>';
  document.getElementById('progressText').textContent=score+' / '+total+' correct';
  document.getElementById('progressFill').style.width=Math.round(score/total*100)+'%';
  document.getElementById('scoreText').textContent=score+' / '+total+' points';
  document.getElementById('finishBar').classList.remove('show');
  saveProgress(score,total);
  window.scrollTo({top:summary.offsetTop-100,behavior:'smooth'});
}

function saveProgress(score,total){
  if(!ref||teacherMode)return;
  ref.update({version:homeworkVersion,answers:answers,score:score,total:total,submitted:true,completed:true,updatedAt:Date.now()}).catch(console.error);
}

renderWords();

function initFirebase(){
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    imageRef=db.ref('curriculum/'+homeworkId+'/flashcardImages');
    imageRef.on('value',s=>{customImages=s.val()||{}});
    if(teacherPreviewRequested){
      firebase.auth().onAuthStateChanged(function(user){
        teacherCanEdit=!!(user&&TEACHER_EMAILS.includes(String(user.email||'').toLowerCase()));
        teacherMode=teacherCanEdit;
        if(teacherCanEdit){
          document.querySelector('.sub').textContent='Teacher preview · student progress is unchanged';
          document.getElementById('intro').textContent='Teacher preview. Click any keyword, then the ✏️ button to set a custom picture.';
        }
        renderQuestions();
      });
      return;
    }
    if(!code){
      renderQuestions();
      document.getElementById('intro').textContent+=' Open this page from your student portal so your progress can be saved.';
      return;
    }
    ref=db.ref('sessions/'+code+'/homework/'+homeworkId);
    ref.once('value').then(s=>{
      const data=s.val()||{};
      if(Number(data.version)!==homeworkVersion){
        answers={};submitted=false;
        ref.set({version:homeworkVersion,answers:{},score:0,total:lesson.questions.length,completed:false}).catch(console.error);
      }else{
        answers=data.answers||{};
        submitted=!!data.submitted;
      }
      renderQuestions();
      if(submitted){
        const saved=teacherMode;teacherMode=true;
        submitAll();
        teacherMode=saved;
      }
    }).catch(e=>{
      document.getElementById('intro').textContent+=' Progress could not be loaded: '+e.message;
      renderQuestions();
    });
  }catch(e){renderQuestions()}
}
initFirebase();
