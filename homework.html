<style>
:root{--bg:#f4f1ea;--panel:#fffdf7;--ink:#19332e;--soft:#667a73;--green:#2d6a57;--green-light:#eaf2ec;--orange:#ee8058;--border:#dce1d7;--good:#25845e;--bad:#b94747;--shadow:0 18px 48px rgba(28,54,45,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px 'EB Garamond','Times New Roman',serif;min-height:100vh}.wrap{width:min(1000px,calc(100% - 32px));margin:28px auto 64px}.top{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);padding:0 0 18px}.mark{width:48px;height:48px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:25px}.brand{font-size:24px;font-weight:800}.sub{color:var(--soft);font-size:15px;letter-spacing:1.6px;text-transform:uppercase}.badge{margin-left:auto;padding:7px 12px;border-radius:20px;background:var(--green-light);color:var(--green);font-size:15px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;padding:34px 0 22px}.eyebrow{font:13px 'Fira Code',monospace;text-transform:uppercase;letter-spacing:1.8px;color:var(--green)}h1{font-size:clamp(36px,6vw,58px);line-height:.98;margin:12px 0 14px;letter-spacing:-1px}.hero p{font-size:20px;color:var(--soft);line-height:1.35;margin:0}.topic-art{min-height:156px;border-radius:22px;background:#e0eee5;display:grid;place-items:center;font-size:48px;letter-spacing:12px;box-shadow:var(--shadow)}.progress{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;color:var(--green);font-size:16px}.rail{height:8px;border-radius:10px;background:#e4e9e1;flex:1;overflow:hidden}.fill{height:100%;width:0;background:var(--green);transition:width .25s}.wordbank,.question,.passage,.summary{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}h2{font-size:27px;margin:0 0 12px}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.word{background:var(--green-light);border-radius:12px;padding:12px 14px}.word b{display:block;color:var(--green);font-size:19px}.word span{color:var(--soft);font-size:16px}.question{padding:20px}.qhead{font:13px 'Fira Code',monospace;color:var(--green);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}.prompt{font-size:21px;line-height:1.25;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.pick,.chip,.check{font:700 17px 'EB Garamond','Times New Roman',serif;cursor:pointer;border-radius:11px;padding:10px 14px;border:1px solid var(--border);background:#fff;color:var(--ink)}.pick:hover,.chip:hover{border-color:var(--green)}.selected{background:var(--green-light);border-color:var(--green)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.answer{font:18px 'EB Garamond','Times New Roman',serif;padding:11px 14px;border:1px solid var(--border);border-radius:10px;min-width:min(420px,100%);flex:1;background:white;color:var(--ink)}.check{background:var(--green);color:#fff;border-color:var(--green);padding:11px 18px}.check:disabled{opacity:.55;cursor:default}.orderbank,.orderline{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:8px 12px}.orderline{min-height:42px;padding:8px;border:1px dashed var(--border);border-radius:11px}.feedback{min-height:24px;margin-top:10px;color:var(--soft);font-size:17px}.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}.passage{line-height:1.45;font-size:19px}.summary{text-align:center;font-size:21px;color:var(--green)}@media(max-width:680px){.hero{grid-template-columns:1fr}.topic-art{min-height:90px}.badge{display:none}.wordbank,.question,.passage{padding:17px}.answer{min-width:100%}}
</style>
</head>
<body><main class="wrap">
  <header class="top"><div class="mark">🏙️</div><div><div class="brand" id="studentTitle">Sustainable Cities</div><div class="sub">Independent homework · Active voice</div></div><span class="badge" id="due">Due before next class</span></header>
  <section class="hero"><div><div class="eyebrow" id="variantLabel">Topic 1 · Sustainable Cities</div><h1 id="headline">A new city vocabulary set</h1><p id="intro"></p></div><div class="topic-art" aria-hidden="true">🌳 → 🚌 → ☀️</div></section>

  <section class="wordbank"><h2>Words for this homework</h2><div class="words" id="words"></div></section>
  <section class="passage" id="passage"></section>
  <section id="questions"></section>
  <section class="summary" id="summary" hidden></section>
</main>
<script>
const firebaseConfig={apiKey:'AIzaSyDL3lnUdhKBqAPEoiJjBnpGqU1ol4Fwa7w',authDomain:'sabina-s-workspace.firebaseapp.com',databaseURL:'https://sabina-s-workspace-default-rtdb.europe-west1.firebasedatabase.app',projectId:'sabina-s-workspace',storageBucket:'sabina-s-workspace.firebasestorage.app',messagingSenderId:'64645562064',appId:'1:64645562064:web:2c5b5a37b5ab9a685be8d5'};
const params=new URLSearchParams(location.search);const variant=params.get('variant')==='sabina'?'sabina':'gaziz';const code=(params.get('code')||'').toUpperCase();const homeworkId=params.get('lesson')||('homework_'+variant+'_sustainable_cities');
const classWords=[
  ['sustainable','able to continue with less harm to the environment'],['emissions','gases released into the air'],['renewable','naturally replaced; not permanently used up'],['infrastructure','basic systems such as roads and transport'],['commute','travel regularly between home and work or school'],['congestion','too much traffic in one place'],['pedestrian','a person who travels on foot'],['affordable','low enough in cost for people to pay'],['implement','put a plan into action'],['expand','make something larger'],['reduce','make something smaller or lower'],['invest','put money or effort into something'],['accessible','easy for people to use or reach'],['reliable','working well and dependably'],['efficient','working well without wasting time or energy'],['public transport','buses, trains, and other shared travel'],['green space','a park or planted area in a city'],['urban','connected with a town or city'],['contribute','help to cause or achieve something'],['improve','make something better']
];
const gazizWords=[
  ['retrofit','improve an existing building by adding newer features'],['urban sprawl','the spread of a city into nearby countryside'],['mixed-use development','a place with homes, shops, and services together'],['stormwater','rainwater that flows over streets and other surfaces'],['permeable surface','a surface that lets water pass through it'],['urban heat island','a city area that stays warmer than nearby rural areas'],['green roof','a roof covered partly or fully with plants'],['biodiversity','the variety of plants and animals in an area'],['zoning','rules that decide how land may be used'],['density','the number of people or buildings in a given area']
];
const work={
 gaziz:{title:'Gaziz',headline:'How cities can grow wisely',intro:'This is a separate Rivergate case study with additional city-planning vocabulary. Read the short report, then complete new word and grammar tasks. Use present perfect or past simple in the active voice.',passage:'<h2>Rivergate plans for warmer, wetter seasons</h2><p>Rivergate has retrofitted its oldest library with a green roof. The roof has supported more biodiversity and has kept the rooms cooler. In 2024, planners mapped areas where the urban heat island effect raised summer temperatures. They added permeable surfaces near two schools, so stormwater flowed into the ground instead of collecting on the pavement. The city has also changed its zoning rules to support mixed-use development. Last year, the council rejected a plan that encouraged urban sprawl and approved a denser neighbourhood near the train station.</p>',words:gazizWords,questions:[
  {type:'choice',prompt:'Which term means rainwater that flows over streets?',options:['stormwater','zoning','density'],answer:'stormwater',explain:'Stormwater is rainwater flowing across surfaces.'},
  {type:'input',prompt:'Complete the definition: A roof with plants is a green ___.',answers:['roof'],explain:'A green roof has plants growing on it.'},
  {type:'choice',prompt:'Which phrase means city growth spreading into the countryside?',options:['urban sprawl','mixed-use development','biodiversity'],answer:'urban sprawl',explain:'Urban sprawl is the outward spread of a city.'},
  {type:'tf',prompt:'The planners mapped the warmer areas in 2024.',answer:'True',explain:'The report uses the finished time in 2024.'},
  {type:'input',prompt:'Use present perfect active: Rivergate ___ (retrofit) its oldest library.',answers:['has retrofitted'],explain:'The change has a present result: has + V3.'},
  {type:'order',prompt:'Build a past simple active sentence.',words:['The','council','changed','the','zoning','rules','last','year.'],answer:['The','council','changed','the','zoning','rules','last','year.'],explain:'Last year is finished, so use past simple.'},
  {type:'choice',prompt:'A permeable surface lets ___ pass through it.',options:['water','traffic','sunlight only'],answer:'water',explain:'Permeable surfaces allow water to pass through.'},
  {type:'input',prompt:'Use past simple active: Planners ___ (map) warmer areas in 2024.',answers:['mapped'],explain:'The finished date 2024 takes past simple.'}
 ]},
 sabina:{title:'Sabina',headline:'Practise the class vocabulary in new ways',intro:'This homework uses the same Sustainable Cities topic, facts, and vocabulary as classwork. Only the activity formats change. Use present perfect or past simple in the active voice.',passage:'<h2>Rivergate: the class reading in a new practice set</h2><p>Rivergate has invested in a more sustainable transport system. The city has expanded its bus network and has made several routes more reliable. Last year, the council opened two bus-only lanes and built a safe crossing near the university. Many residents have commuted by bus since then, and fewer cars have entered the busiest streets.</p><p>The city has installed solar panels on public buildings, so Rivergate has increased its use of renewable energy. The council replaced old streetlights with efficient lamps in 2024. These changes have reduced energy use and transport emissions. Rivergate has also created a new green space beside the river. Local volunteers planted trees there last spring.</p><p>Rivergate has improved its transport infrastructure and has made more stations accessible to pedestrians with limited mobility. In 2023, the city introduced a discount pass to keep travel affordable. The council implemented these projects in stages. The changes have helped residents travel more easily, although traffic has still caused congestion at peak times.</p>',words:classWords,questions:[
  {type:'select',prompt:'Choose the vocabulary word that means “gases released into the air.”',options:['emissions','commute','green space','infrastructure'],answer:'emissions',explain:'Emissions are gases released into the air.'},
  {type:'input',prompt:'Complete the present perfect active sentence with a class word: Residents have ___ by bus since March.',answers:['commuted'],explain:'Commute becomes commuted after have; since March connects the action to now.'},
  {type:'select',prompt:'Choose the class word that means “low enough in cost for people to pay.”',options:['affordable','reliable','urban','efficient'],answer:'affordable',explain:'Affordable describes a cost people can manage.'},
  {type:'order',prompt:'Put the words in order to make a present perfect active sentence.',words:['Rivergate','has','expanded','its','bus','network.'],answer:['Rivergate','has','expanded','its','bus','network.'],explain:'The city’s change connects to now: has expanded.'},
  {type:'input',prompt:'Use past simple active: The council ___ (open) two lanes last year.',answers:['opened'],explain:'Last year is a finished time: opened.'},
  {type:'select',prompt:'Which class word means “basic systems such as roads and transport”?',options:['infrastructure','congestion','pedestrian','renewable'],answer:'infrastructure',explain:'Infrastructure includes the basic systems a city uses.'},
  {type:'input',prompt:'Use present perfect active: The city ___ (reduce) transport emissions.',answers:['has reduced'],explain:'The result matters now: has + reduced.'},
  {type:'select',prompt:'Choose the word for a person who travels on foot.',options:['pedestrian','commuter','investor','planner'],answer:'pedestrian',explain:'A pedestrian travels on foot.'}
 ]}
};
const lesson=work[variant];let db=null,ref=null;let score=0,answers={};
document.title=lesson.title+' — Sustainable Cities Homework';document.getElementById('studentTitle').textContent=lesson.title;document.getElementById('headline').textContent=lesson.headline;document.getElementById('intro').textContent=lesson.intro;document.getElementById('passage').innerHTML=lesson.passage;
document.getElementById('words').innerHTML=lesson.words.map(function(row){return '<div class="word"><b>'+esc(row[0])+'</b><span>'+esc(row[1])+'</span></div>'}).join('');
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
 const root=document.getElementById('questions');root.innerHTML='';
 lesson.questions.forEach(function(q,i){
  const card=document.createElement('article');card.className='question';const feedback=document.createElement('div');feedback.className='feedback';feedback.id='fb'+i;
  card.innerHTML='<div class="qhead">Question '+(i+1)+' · '+({choice:'Choose',select:'Vocabulary match',input:'Complete',tf:'True or false',order:'Word order'}[q.type])+'</div><div class="prompt">'+esc(q.prompt)+'</div>';
  if(q.type==='choice'||q.type==='tf'){
   const options=q.type==='tf'?['True','False']:q.options;const choices=document.createElement('div');choices.className='options';
   options.forEach(function(opt){const b=document.createElement('button');b.className='pick';b.textContent=opt;b.onclick=function(){check(i,opt,feedback,card)};choices.appendChild(b)});card.appendChild(choices);
  }else if(q.type==='select'){
   const row=document.createElement('div');row.className='row';const select=document.createElement('select');select.className='answer';select.innerHTML='<option value="">Choose an answer…</option>'+q.options.map(function(opt){return '<option>'+esc(opt)+'</option>'}).join('');const button=document.createElement('button');button.className='check';button.textContent='Check';button.onclick=function(){check(i,select.value,feedback,card)};row.appendChild(select);row.appendChild(button);card.appendChild(row);
  }else if(q.type==='input'){
   const row=document.createElement('div');row.className='row';const input=document.createElement('input');input.className='answer';input.autocomplete='off';input.placeholder='Type your answer';const button=document.createElement('button');button.className='check';button.textContent='Check';button.onclick=function(){check(i,input.value,feedback,card)};input.addEventListener('keydown',function(e){if(e.key==='Enter')button.click()});row.appendChild(input);row.appendChild(button);card.appendChild(row);
  }else if(q.type==='order'){
   const bank=document.createElement('div');bank.className='orderbank';const line=document.createElement('div');line.className='orderline';let chosen=[];q.words.slice().sort(function(){return Math.random()-.5}).forEach(function(word){const chip=document.createElement('button');chip.className='chip';chip.textContent=word;chip.onclick=function(){chosen.push(word);chip.disabled=true;chip.style.opacity='.4';line.textContent=chosen.join(' ')};bank.appendChild(chip)});const button=document.createElement('button');button.className='check';button.textContent='Check order';button.onclick=function(){check(i,chosen,feedback,card)};const reset=document.createElement('button');reset.className='pick';reset.textContent='Reset words';reset.onclick=function(){chosen=[];line.textContent='';bank.querySelectorAll('button').forEach(function(chip){chip.disabled=false;chip.style.opacity='1'})};card.appendChild(bank);card.appendChild(line);card.appendChild(button);card.appendChild(reset);
  }
  card.appendChild(feedback);root.appendChild(card);
  if(answers[i])markComplete(card,feedback,q.explain);
 });updateProgress();
}
function check(i,value,feedback,card){
 if(answers[i])return;const q=lesson.questions[i];let correct=false;
 if(q.type==='input')correct=q.answers.some(function(a){return String(a).toLowerCase().trim()===String(value).toLowerCase().trim()});
 else if(q.type==='order')correct=Array.isArray(value)&&value.length===q.answer.length&&value.every(function(word,index){return word===q.answer[index]});
 else correct=String(value)===String(q.answer);
 if(!correct){feedback.className='feedback no';feedback.textContent='Not quite yet. Check the word bank or the tense clue and try again.';return}
 answers[i]=true;score=Object.keys(answers).length;feedback.className='feedback ok';feedback.textContent='✓ '+q.explain;markComplete(card,feedback,q.explain);updateProgress();saveProgress();
}
function markComplete(card,feedback,explain){card.querySelectorAll('button,select,input').forEach(function(el){el.disabled=true});feedback.className='feedback ok';feedback.textContent='✓ '+explain}
function updateProgress(){const total=lesson.questions.length;document.getElementById('progressText').textContent=score+' / '+total+' complete';document.getElementById('progressFill').style.width=Math.round(score/total*100)+'%';document.getElementById('scoreText').textContent=score+' points';const summary=document.getElementById('summary');summary.hidden=score<total;summary.textContent=score===total?'Homework completed. Your teacher can see your score and completion. Great work!':''}
function saveProgress(){if(!ref)return;ref.update({answers:answers,score:score,total:lesson.questions.length,completed:score===lesson.questions.length,updatedAt:Date.now()}).catch(function(err){const el=document.getElementById('scoreText');el.textContent='Save failed';console.error(err)})}
function init(){
 if(!code){document.getElementById('intro').textContent+=' Sign in through your student portal so your code is included and your work can be saved.';render();return}
 try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();ref=db.ref('sessions/'+code+'/homework/'+homeworkId);ref.once('value').then(function(snap){const saved=snap.val()||{};answers=saved.answers||{};score=Number(saved.score)||0;render()}).catch(function(err){document.getElementById('intro').textContent+=' The page could not load saved progress: '+err.message;render()})}catch(err){document.getElementById('intro').textContent+=' Database connection failed.';render()}
}
init();
</script></body></html>
