<style>
:root{color-scheme:light;--bg:#f4f1ea;--panel:#fff;--paper:#fffdf7;--ink:#2c3e50;--ink-soft:#6c757d;--primary:#2a5298;--primary-dark:#1e3c72;--accent:#ee5a24;--accent-dark:#d94a15;--success:#2e9e5b;--success-soft:#d4edda;--error:#dc3545;--error-soft:#f8d7da;--warn:#ff9800;--border:#e0dbd0;--shadow-sm:0 2px 6px rgba(0,0,0,.06);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.15)}
html.dark{color-scheme:dark;--bg:#1a1d24;--panel:#232832;--paper:#1e222a;--ink:#e8e8ea;--ink-soft:#a0a6b0;--primary:#5b8dd9;--primary-dark:#2a5298;--accent:#ff8a5b;--accent-dark:#ee5a24;--success:#4caf7d;--success-soft:#1e3a2a;--error:#ef5468;--error-soft:#3a1e22;--border:#333944}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'EB Garamond','Times New Roman',serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .2s,color .2s}
.hw-top{display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 22px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.hw-top .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.hw-top .title-block{display:flex;flex-direction:column}
.hw-top .title-block .brand{font-size:20px;font-weight:800;line-height:1.1}
.hw-top .title-block .sub{font:11px 'Fira Code',monospace;color:var(--ink-soft);letter-spacing:1.3px;text-transform:uppercase;margin-top:2px}
.hw-top .spacer{flex:1}
.hw-top button,.hw-top a{border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 12px;text-decoration:none;font:700 15px 'EB Garamond','Times New Roman',serif;cursor:pointer;transition:all .15s;font-family:inherit}
.hw-top button:hover,.hw-top a:hover{border-color:var(--accent);color:var(--accent)}
.wrap{max-width:1500px;margin:20px auto 60px;padding:0 22px}
.hero{padding:26px 4px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero .eyebrow{font:12px 'Fira Code',monospace;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hero h1{font-size:clamp(30px,4.5vw,48px);line-height:1.05;margin-bottom:8px;font-weight:800}
.hero .intro{font-size:18px;line-height:1.55;color:var(--ink-soft);max-width:720px;margin:0}
.hero .intro .ru{display:block;margin-top:8px;font-style:italic;font-size:15px;color:var(--ink-soft);opacity:.85}
.progress-shell{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.progress-shell .label{font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.progress-track{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:99px;transition:width .35s}
.progress-pct{font:700 14px 'Fira Code',monospace;color:var(--accent);white-space:nowrap}
.hw-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media(max-width:980px){.hw-split{grid-template-columns:1fr}}
.reading-pane{position:sticky;top:80px}
.questions-pane{min-width:0}
.passage{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:28px 32px;font-size:18px;line-height:1.9;color:var(--ink);box-shadow:var(--shadow-sm);max-height:calc(100vh - 120px);overflow-y:auto;user-select:text;}
.passage h2{font-size:26px;color:var(--accent);margin-bottom:6px;font-weight:800;line-height:1.2}
.passage .subtitle{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.passage p{margin-bottom:16px;text-align:justify}
.passage p .para-label{font-weight:800;color:var(--accent);margin-right:6px}
.v-word{background:rgba(238,90,36,.12);color:var(--accent-dark);font-weight:700;cursor:pointer;padding:1px 5px;border-radius:5px;border-bottom:2px dotted var(--accent);font-family:inherit;font-size:inherit}
.v-word:hover{background:var(--accent);color:#fff}

/* HIGHLIGHTS & NOTES */
.hl-yellow{background-color:#fce883;color:#000;}
.hl-green{background-color:#b5e8c5;color:#000;}
.hl-blue{background-color:#c5e1f5;color:#000;}
.hl-purple{background-color:#e9d5ff;color:#000;}
.hl-pink{background-color:#fbcfe8;color:#000;}
.user-note{background-color:#fef08a;border-bottom:2px dashed #eab308;cursor:pointer;padding:0 2px;border-radius:2px;color:#000;transition:background .2s;}
.user-note:hover{background-color:#fde047;}
html.dark .hl-yellow{background-color:rgba(250, 204, 21, 0.3);color:#fff;border-bottom:2px solid rgba(250, 204, 21, 0.6);}
html.dark .hl-green{background-color:rgba(74, 222, 128, 0.3);color:#fff;border-bottom:2px solid rgba(74, 222, 128, 0.6);}
html.dark .hl-blue{background-color:rgba(96, 165, 250, 0.3);color:#fff;border-bottom:2px solid rgba(96, 165, 250, 0.6);}
html.dark .hl-purple{background-color:rgba(192, 132, 252, 0.3);color:#fff;border-bottom:2px solid rgba(192, 132, 252, 0.6);}
html.dark .hl-pink{background-color:rgba(244, 114, 182, 0.3);color:#fff;border-bottom:2px solid rgba(244, 114, 182, 0.6);}
html.dark .user-note{background-color:rgba(253, 224, 71, 0.3);border-bottom:2px dashed rgba(250, 204, 21, 0.8);color:#fff;}
html.dark .user-note:hover{background-color:rgba(253, 224, 71, 0.5);}
.hl-yellow:hover, .hl-green:hover, .hl-blue:hover, .hl-purple:hover, .hl-pink:hover { outline: 2px solid var(--ink-soft); outline-offset: 2px; border-radius: 4px; cursor: pointer; }

html.dark .underline:hover { background-color: rgba(255, 255, 255, 0.15); }
.user-note:hover { box-shadow: 0 0 0 2px var(--warn); }

/* CUSTOM CONTEXT MENU */
.context-menu{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.2);display:none;flex-direction:column;padding:4px;z-index:10000;min-width:160px;}
.context-menu.show{display:flex;}
.context-item{padding:8px 12px;font-size:14px;cursor:pointer;border-radius:6px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;font-weight:600;position:relative;}
.context-item:hover{background:var(--bg);color:var(--accent);}
.context-item.delete{color:var(--error);}
.context-item.delete:hover{background:var(--error-soft);}
.has-submenu:hover .submenu { display: flex; }
.submenu { display: none; position: absolute; top: 0; left: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); flex-direction: column; padding: 4px; min-width: 120px; z-index: 10001; }
.submenu-item { padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.submenu-item:hover { background: var(--bg); }
.color-swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* STICKY NOTE POPUP */
.sticky-note{position:fixed;background:#fef08a;border:1px solid #ca8a04;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.3);width:280px;height:200px;display:none;flex-direction:column;z-index:10001;font-family:'EB Garamond',serif;resize:both;overflow:auto;min-width:200px;min-height:150px;}
.sticky-note.show{display:flex;}
.sticky-header{background:#facc15;padding:6px 10px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between;align-items:center;cursor:grab;}
.sticky-header:active{cursor:grabbing;}
.sticky-title{font-size:12px;font-weight:800;color:#422006;text-transform:uppercase;letter-spacing:1px;}
.sticky-actions{display:flex;gap:6px;}
.sticky-btn{background:transparent;border:none;cursor:pointer;font-size:14px;color:#422006;padding:2px;transition:transform .1s;}
.sticky-btn:hover{transform:scale(1.2);}
.sticky-btn.delete:hover{color:#b91c1c;}
.sticky-body{padding:10px;flex:1;display:flex;flex-direction:column;overflow:hidden;}
.sticky-text{width:100%;height:100%;background:transparent;border:none;resize:none;outline:none;font-family:'EB Garamond',serif;font-size:16px;line-height:1.4;color:#422006;font-weight:500;}
.sticky-text::placeholder{color:rgba(66,32,6,0.5);font-style:italic;}

.q-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.q-num{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.q-type{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--ink-soft);margin-left:6px;text-transform:none;letter-spacing:0}
.q-prompt{font-size:17px;line-height:1.55;color:var(--ink);font-weight:600;margin-bottom:12px}
.q-opts{display:flex;gap:8px;flex-wrap:wrap}
.q-opt{padding:10px 16px;background:var(--bg);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .15s}
.q-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.q-opt.selected{border-color:var(--primary);background:var(--primary-dark);color:#fff;}
.q-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error)}
.q-input-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-input{flex:1;min-width:200px;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);outline:none}
.q-input:focus{border-color:var(--accent);background:var(--panel)}
.q-input.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.q-input.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error)}
.q-textarea{width:100%;min-height:90px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);outline:none;resize:vertical}
.q-textarea:focus{border-color:var(--accent);background:var(--panel)}
.q-feedback{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600;display:none}
.q-feedback.correct{background:var(--success-soft);color:var(--success);display:block;border-left:4px solid var(--success)}
.q-feedback.wrong{background:var(--error-soft);color:var(--error);display:block;border-left:4px solid var(--error)}
.q-feedback .exp{display:block;font-weight:500;font-size:14px;color:var(--ink-soft);margin-top:6px;font-style:italic}
.q-feedback .sample{display:block;font-weight:600;font-size:14px;color:var(--ink);margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;font-style:italic}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 3px 0 var(--accent-dark)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--accent-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.submit-bar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-top:16px;box-shadow:0 -4px 20px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.result-banner{background:linear-gradient(135deg,rgba(46,158,91,.1),rgba(46,158,91,.03));border:2px dashed var(--success);border-radius:16px;padding:28px 22px;margin-bottom:16px;text-align:center}
.result-banner .icon{font-size:56px;margin-bottom:10px}
.result-banner h3{font-size:24px;color:var(--success);margin-bottom:8px;font-weight:800}
.result-banner .big{font-size:60px;font-weight:800;color:var(--accent);line-height:1;margin:14px 0}
.result-banner p{font-size:16px;color:var(--ink-soft);line-height:1.6}
.vocab-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.vocab-backdrop.open{display:flex}
.vocab-card{background:var(--panel);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;padding:28px 30px 24px;text-align:left}
.vocab-card .close-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer}
.vocab-card .head{text-align:center;margin-bottom:18px}
.vocab-card .head .emoji{font-size:64px;line-height:1;margin-bottom:8px}
.vocab-card .head .word{font-size:30px;font-weight:800;color:var(--primary)}
.fc-meaning{padding:14px 16px;background:var(--bg);border-radius:12px;border-left:4px solid var(--accent);margin-bottom:12px}
.fc-meaning .context{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent);text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;}
.fc-meaning .pos-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;letter-spacing:0;text-transform:none;}
.fc-meaning .translation{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px}
.fc-meaning .example{font-size:15px;line-height:1.6;color:var(--ink-soft);font-style:italic;padding-left:10px;border-left:2px solid var(--border)}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:999;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>

<script>
const firebaseConfig={apiKey:"AIzaSyDL3lnUdhKBqAPEoiJjBnpGqU1ol4Fwa7w",authDomain:"sabina-s-workspace.firebaseapp.com",databaseURL:"https://sabina-s-workspace-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sabina-s-workspace",storageBucket:"sabina-s-workspace.firebasestorage.app",messagingSenderId:"64645562064",appId:"1:64645562064:web:2c5b5a37b5ab9a685be8d5"};
let fbApp=null,fbDb=null,fbAuth=null,sessionRef=null,teacherMode=false,teacherCanEdit=false;

const params=new URLSearchParams(location.search);
const variant=params.get('variant')||'';
const code=(params.get('code')||'').toUpperCase();
const homeworkId=params.get('lesson')||('homework_'+variant);
const homeworkVersion=6;
const teacherPreviewRequested=params.get('teacher')==='1';
const TEACHER_EMAILS=['alibek.alpysbayev@gmail.com'];

let lesson = null;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function escapeAttr(s){return escapeHtml(s)}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

/* ================== EXTREMELY SMART ANSWER MATCHER ================== */
const FILLER_WORDS = ['in', 'on', 'at', 'for', 'to', 'the', 'a', 'an', 'of', 'is', 'are', 'was', 'were', 'by', 'with'];

function expandContractions(str) {
  return str.replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not').replace(/\bain't\b/g, 'is not').replace(/n't\b/g, ' not').replace(/'re\b/g, ' are').replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have').replace(/'s\b/g, ' is').replace(/'d\b/g, ' would');
}

function normalizeString(str) {
  let s = String(str).toLowerCase().trim();
  s = expandContractions(s);
  s = s.replace(/[.,!?;:'"()\[\]{}]/g, '');
  s = s.replace(/\s+/g, ' ');
  return s;
}

function getCoreWords(str) {
  const norm = normalizeString(str);
  return norm.split(' ').filter(w => w.length > 0 && !FILLER_WORDS.includes(w));
}

function levenshtein(a, b) {
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
      else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
    }
  }
  return matrix[b.length][a.length];
}

function isAnswerCorrect(userStr, expectedArr) {
  if(!userStr) return false;
  let user = normalizeString(userStr);
  if(!user) return false;

  for (let exp of expectedArr) {
    let target = normalizeString(exp);
    
    // 1. Exact Match
    if (user === target) return true;
    
    // 2. Numeric Extraction (e.g., "In 2015" vs "2015")
    const userNums = user.match(/\d+/g) || [];
    const targetNums = target.match(/\d+/g) || [];
    if (targetNums.length > 0) {
        const numMatch = targetNums.every(tn => userNums.includes(tn));
        if (numMatch) return true;
    }
    
    // 3. Core Words Match
    const userCores = getCoreWords(user);
    const targetCores = getCoreWords(target);
    
    if (userCores.length > 0 && targetCores.length > 0) {
        const userCoreStr = userCores.join(' ');
        const targetCoreStr = targetCores.join(' ');
        if (userCoreStr === targetCoreStr) return true;
        
        if (userCoreStr.includes(targetCoreStr) && targetCoreStr.length > 2) return true;
        if (targetCoreStr.includes(userCoreStr) && userCoreStr.length > 2) return true;
    }
    
    // 4. Substring match
    if (user.includes(target) && target.length > 2 && user.length > target.length + 3) return true;
    
    // 5. Morphological Variations
    if (target.length > 3 && (user.startsWith(target) || target.startsWith(user))) {
       const suffix = user.startsWith(target) ? user.substring(target.length) : target.substring(user.length);
       if(['', 'ing', 'ed', 's'].includes(suffix)) return true;
    }

    // 6. Levenshtein
    if (target.length > 4) {
       const maxAllowedDist = target.length > 8 ? 2 : 1;
       if (levenshtein(user, target) <= maxAllowedDist) return true;
    }
  }
  return false;
}

/* ================== ANNOTATION & NOTES LOGIC ================== */
let activeNoteId = null;
let savedRange = null; 
let contextTargetEdit = null;

document.addEventListener('DOMContentLoaded', () => {
  const menu = document.getElementById('customContextMenu');
  
  document.addEventListener('click', function(e) {
    if(e.target.closest('.context-menu')) return;
    menu.classList.remove('show');

    if(e.target.closest('.sticky-note')) return;

    const targetNote = e.target.closest('.user-note');
    if (targetNote) {
        if(!targetNote.dataset.id) targetNote.dataset.id = 'note_legacy_' + Date.now();
        openExistingNote(targetNote.dataset.id);
        return;
    }

    closeStickyNote();
  });

  document.addEventListener('contextmenu', function(e) {
    if(!e.target.closest('#passageBody')) return;
    
    e.preventDefault();
    menu.innerHTML = ''; 
    contextTargetEdit = null;
    
    const selection = window.getSelection();
    const targetNote = e.target.closest('.user-note');
    
    let node = e.target;
    while (node && node !== document.body) {
        if (node.nodeType === 1) { 
            if (node.classList.contains('hl-yellow') || node.classList.contains('hl-green') || node.classList.contains('hl-blue') || node.classList.contains('hl-purple') || node.classList.contains('hl-pink') || node.classList.contains('underline')) {
                contextTargetEdit = node;
                break;
            }
        }
        node = node.parentNode;
    }

    const safeClick = "event.preventDefault(); event.stopPropagation();";

    if (targetNote) {
      if(!targetNote.dataset.id) targetNote.dataset.id = 'note_legacy_' + Date.now();
      menu.innerHTML = `
        <div class="context-item" onclick="${safeClick} openExistingNote('${targetNote.dataset.id}')">📝 Edit Note</div>
        <div class="context-item delete" onclick="${safeClick} deleteNoteById('${targetNote.dataset.id}')">🗑️ Delete Note</div>
      `;
    } else if (contextTargetEdit) {
      menu.innerHTML = `
        <div class="context-item delete" onclick="${safeClick} removeExistingEdit()">🗑️ Remove Edit</div>
      `;
    } else if (!selection.isCollapsed && selection.toString().trim().length > 0) {
      savedRange = selection.getRangeAt(0).cloneRange(); 
      
      menu.innerHTML = `
        <div class="context-item has-submenu">
            🖍️ Highlight
            <div class="submenu">
                <div class="submenu-item" onclick="${safeClick} applyAnnotation('hl-yellow')"><span class="color-swatch" style="background:#fce883"></span> Yellow</div>
                <div class="submenu-item" onclick="${safeClick} applyAnnotation('hl-green')"><span class="color-swatch" style="background:#b5e8c5"></span> Green</div>
                <div class="submenu-item" onclick="${safeClick} applyAnnotation('hl-blue')"><span class="color-swatch" style="background:#c5e1f5"></span> Blue</div>
                <div class="submenu-item" onclick="${safeClick} applyAnnotation('hl-purple')"><span class="color-swatch" style="background:#e9d5ff"></span> Purple</div>
                <div class="submenu-item" onclick="${safeClick} applyAnnotation('hl-pink')"><span class="color-swatch" style="background:#fbcfe8"></span> Pink</div>
            </div>
        </div>
        <div class="context-item" onclick="${safeClick} applyAnnotation('underline')">U̲ Underline</div>
        <div class="context-item" onclick="${safeClick} createNewNote()">💬 Add Note</div>
      `;
    } else {
      return; 
    }
    
    let x = e.pageX;
    let y = e.pageY;
    if (x + 160 > window.innerWidth) x -= 160;
    if (y + 200 > window.innerHeight) y -= 200;

    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.classList.add('show');
  });

  const dragHandle = document.getElementById('stickyDragHandle');
  const stickyNote = document.getElementById('stickyNote');
  let isDragging = false, startX, startY, initialX, initialY;

  dragHandle.addEventListener('mousedown', function(e) {
    if(e.target.tagName === 'BUTTON') return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    initialX = stickyNote.offsetLeft;
    initialY = stickyNote.offsetTop;
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    stickyNote.style.left = (initialX + dx) + 'px';
    stickyNote.style.top = (initialY + dy) + 'px';
  });

  document.addEventListener('mouseup', function() {
    isDragging = false;
    document.body.style.userSelect = '';
  });
});

function applyAnnotation(className) {
  if(!savedRange) return;
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(savedRange);
  
  const span = document.createElement('span');
  span.className = className;
  if(className === 'underline') span.style.textDecoration = 'underline';
  
  try {
    span.appendChild(savedRange.extractContents());
    savedRange.insertNode(span);
  } catch(e) { console.error("Highlight error:", e); }
  
  selection.removeAllRanges(); 
  savedRange = null; 
  document.getElementById('customContextMenu').classList.remove('show');
  saveAnnotations();
}

function createNewNote() {
  if(!savedRange) return;
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(savedRange);

  const id = 'note_' + Date.now();
  const span = document.createElement('span');
  span.className = 'user-note';
  span.dataset.id = id;
  span.dataset.note = "";
  
  try {
    span.appendChild(savedRange.extractContents());
    savedRange.insertNode(span);
  } catch(e) { console.error("Note error:", e); }
  
  selection.removeAllRanges();
  savedRange = null; 
  document.getElementById('customContextMenu').classList.remove('show');
  openExistingNote(id);
}

function removeExistingEdit() {
  if (!contextTargetEdit) return;
  const parent = contextTargetEdit.parentNode;
  while (contextTargetEdit.firstChild) {
      parent.insertBefore(contextTargetEdit.firstChild, contextTargetEdit);
  }
  parent.removeChild(contextTargetEdit);
  contextTargetEdit = null;
  document.getElementById('customContextMenu').classList.remove('show');
  saveAnnotations();
  showToast('Edit removed');
}

function openExistingNote(id) {
  const span = document.querySelector(`.user-note[data-id="${id}"]`);
  if(!span) return;
  activeNoteId = id;
  const rect = span.getBoundingClientRect();
  const sticky = document.getElementById('stickyNote');
  const textArea = document.getElementById('stickyText');
  textArea.value = span.dataset.note || "";
  let posX = rect.right + 15;
  if (posX + 300 > window.innerWidth) posX = rect.left - 300; 
  sticky.style.left = posX + 'px';
  sticky.style.top = (rect.top - 20) + 'px';
  sticky.classList.add('show');
  setTimeout(() => textArea.focus(), 50);
}

function closeStickyNote() {
  const sticky = document.getElementById('stickyNote');
  if(!sticky.classList.contains('show')) return;
  if (activeNoteId) {
    const span = document.querySelector(`.user-note[data-id="${activeNoteId}"]`);
    if(span) {
      span.dataset.note = document.getElementById('stickyText').value;
      saveAnnotations();
    }
  }
  sticky.classList.remove('show');
  activeNoteId = null;
}

function deleteNoteById(id) {
  const span = document.querySelector(`.user-note[data-id="${id}"]`);
  if(!span) return;
  const parent = span.parentNode;
  while (span.firstChild) parent.insertBefore(span.firstChild, span);
  parent.removeChild(span);
  if(activeNoteId === id) closeStickyNote();
  document.getElementById('customContextMenu').classList.remove('show');
  saveAnnotations();
  showToast('Note deleted');
}

function deleteCurrentNote() { if(activeNoteId) deleteNoteById(activeNoteId); }

function renderPassage(){
  const p=lesson.reading;
  const body=document.getElementById('passageBody');
  if(!body)return;
  let html='<h2>'+escapeHtml(p.title)+'</h2><div class="subtitle">'+escapeHtml(p.subtitle)+'</div>';
  const vocabWords=lesson.vocab.map(v=>v.en);
  p.paragraphs.forEach(function(par){
    let text=escapeHtml(par.text);
    vocabWords.forEach(function(w){
      let matchStr = w;
      if (w.startsWith('to ')) matchStr = w.substring(3);
      const escW=matchStr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b('+escW+'[a-z]*)\\b','gi');
      text=text.replace(re,'<span class="v-word" data-vocab="'+escapeAttr(w)+'">$1</span>');
    });
    html+='<p><span class="para-label">'+escapeHtml(par.label)+'</span>'+text+'</p>';
  });
  body.innerHTML=html;
  body.querySelectorAll('.v-word').forEach(function(el){
    el.onclick=function(){openVocab(el.dataset.vocab)};
  });

  // Load Annotations
  if(fbDb && code) {
     fbDb.ref('sessions/'+code+'/homework_annotations/'+homeworkId).once('value').then(snap => {
         if(snap.exists()) {
             body.innerHTML = snap.val();
             body.querySelectorAll('.user-note').forEach((note, i) => {
                 if(!note.dataset.id) note.dataset.id = 'legacy_' + Date.now() + '_' + i;
             });
         }
     });
  }
}

function openVocab(word){
  const v=lesson.vocab.find(function(x){return x.en===word});
  if(!v)return;
  document.getElementById('vocabEmoji').textContent=v.emoji||'📖';
  document.getElementById('vocabWord').textContent=v.en;
  document.getElementById('vocabMeanings').innerHTML=v.meanings.map(function(m){
    const head = m.displayEn ? `<b>${escapeHtml(m.displayEn)}</b><br>` : '';
    const posBadge = m.pos ? `<span class="pos-badge">${escapeHtml(m.pos)}</span>` : '';
    return '<div class="fc-meaning"><div class="context">'+escapeHtml(m.context)+' '+posBadge+'</div>'+
      '<div class="translation">'+head+escapeHtml(m.ru)+'</div>'+
      '<div class="example">'+m.ex+'</div></div>';
  }).join('');
  document.getElementById('vocabBackdrop').classList.add('open');
}

function updateProgress(){
  const total=lesson.questions.length;
  const answered=Object.keys(answers).length;
  const pct=total?Math.round(answered/total*100):0;
  const pf=document.getElementById('progressFill');if(pf)pf.style.width=pct+'%';
  const pp=document.getElementById('progressPct');if(pp)pp.textContent=pct+'%';
  const pc=document.getElementById('progressCount');if(pc)pc.textContent=answered+' / '+total+' answered';
  const remaining=total-answered;
  const hint=document.getElementById('submitHint');
  const btn=document.getElementById('submitBtn');
  
  if(submitted){
    if(btn){btn.disabled=true;btn.textContent='✓ Submitted'}
    if(hint)hint.innerHTML='Homework already submitted.';
    return;
  }
  if(remaining===0){
    if(hint)hint.innerHTML='All questions answered. Ready to submit!';
    if(btn)btn.disabled=false;
  }else{
    if(hint)hint.innerHTML='Answer every question to unlock submission. <b>'+remaining+' remaining.</b>';
    if(btn)btn.disabled=true;
  }
}

function checkLongAnswer(text,keywordGroups,minWords,minGroups){
  const t=normalizeString(text);
  const words=t.split(/\s+/).filter(function(w){return w.length>0});
  if(words.length<minWords)return{pass:false,reason:'Your answer is too short. Aim for at least '+minWords+' words.',matched:0};
  let matched=0;
  keywordGroups.forEach(function(g){if(g.some(function(k){return t.indexOf(normalizeString(k))!==-1}))matched++});
  if(matched>=minGroups)return{pass:true,matched:matched,total:keywordGroups.length};
  return{pass:false,reason:'You matched '+matched+' of '+keywordGroups.length+' key ideas. Check the passage again and try to include more.',matched:matched};
}

function renderQuestions(){
  const host=document.getElementById('questionsHost');if(!host)return;
  host.innerHTML='';
  lesson.questions.forEach(function(q,idx){
    const card=document.createElement('div');card.className='q-card';
    const typeLabel={short:'Short answer',tfng:'True / False / Not Given',mcq:'Multiple choice',long:'Long answer',complete:'Complete the sentence'}[q.type]||'';
    card.innerHTML='<div class="q-num">Question '+(idx+1)+' <span class="q-type">'+typeLabel+'</span></div><div class="q-prompt">'+escapeHtml(q.prompt).replace('___','<b style="color:var(--accent)">___</b>')+'</div>';
    const body=document.createElement('div');
    card.appendChild(body);
    
    if(q.type==='short'||q.type==='complete'){
      const row=document.createElement('div');row.className='q-input-row';
      const inp=document.createElement('input');inp.type='text';inp.className='q-input';inp.placeholder='Type your answer...';inp.autocomplete='off';
      if(submitted){inp.value=answers[idx]||'';inp.disabled=true}
      else {
        inp.value=answers[idx]||'';
        inp.addEventListener('input',function(){
          if(inp.value.trim().length>0){answers[idx]=inp.value;}
          else{delete answers[idx];}
          updateProgress();
          debouncedSave();
        });
      }
      row.appendChild(inp);body.appendChild(row);
      
      if(submitted){
        const ok = isAnswerCorrect(inp.value, q.answers || [q.answer]);
        if(ok)inp.classList.add('correct'); else inp.classList.add('wrong');
        const fb=document.createElement('div');
        fb.className='q-feedback ' + (ok ? 'correct' : 'wrong');
        fb.innerHTML=(ok ? '✓ Correct!' : '✗ Incorrect. Expected: '+escapeHtml(q.answers[0]||q.answer))+'<span class="exp">'+escapeHtml(q.exp||'')+'</span>';
        fb.style.display='block';
        body.appendChild(fb);
      }
      
    }else if(q.type==='tfng'){
      const opts=document.createElement('div');opts.className='q-opts';
      ['True','False','Not Given'].forEach(function(o){
        const b=document.createElement('button');b.className='q-opt';b.textContent=o;
        if(submitted){
          b.disabled=true;
          if(o===q.answer)b.classList.add('correct');
          if(answers[idx]===o && o!==q.answer)b.classList.add('wrong');
        } else {
          if(answers[idx]===o) b.classList.add('selected');
          b.onclick=function(){
            opts.querySelectorAll('button').forEach(function(x){x.classList.remove('selected')});
            b.classList.add('selected');
            answers[idx]=o;updateProgress();debouncedSave();
          };
        }
        opts.appendChild(b);
      });
      body.appendChild(opts);
      if(submitted){
        const fb=document.createElement('div');
        fb.className='q-feedback ' + (answers[idx]===q.answer ? 'correct' : 'wrong');
        fb.innerHTML=(answers[idx]===q.answer ? '✓ Correct!' : '✗ Incorrect.') + '<span class="exp">'+escapeHtml(q.exp||'')+'</span>';
        fb.style.display='block';
        body.appendChild(fb);
      }
      
    }else if(q.type==='mcq'){
      const opts=document.createElement('div');opts.className='q-opts';
      shuffle(q.options).forEach(function(o){
        const b=document.createElement('button');b.className='q-opt';b.textContent=o;
        if(submitted){
          b.disabled=true;
          if(o===q.correct)b.classList.add('correct');
          if(answers[idx]===o && o!==q.correct)b.classList.add('wrong');
        } else {
          if(answers[idx]===o) b.classList.add('selected');
          b.onclick=function(){
            opts.querySelectorAll('button').forEach(function(x){x.classList.remove('selected')});
            b.classList.add('selected');
            answers[idx]=o;updateProgress();debouncedSave();
          };
        }
        opts.appendChild(b);
      });
      body.appendChild(opts);
      if(submitted){
        const fb=document.createElement('div');
        fb.className='q-feedback ' + (answers[idx]===q.correct ? 'correct' : 'wrong');
        fb.innerHTML=(answers[idx]===q.correct ? '✓ Correct!' : '✗ Incorrect.') + '<span class="exp">'+escapeHtml(q.exp||'')+'</span>';
        fb.style.display='block';
        body.appendChild(fb);
      }
      
    }else if(q.type==='long'){
      const ta=document.createElement('textarea');ta.className='q-textarea';ta.placeholder='Write your answer in full sentences...';
      if(submitted){ta.value=answers[idx]||'';ta.disabled=true}
      else {
        ta.value=answers[idx]||'';
        ta.addEventListener('input',function(){
          if(ta.value.trim().length>0){answers[idx]=ta.value;}
          else{delete answers[idx];}
          updateProgress();debouncedSave();
        });
      }
      body.appendChild(ta);
      if(submitted){
        const res=checkLongAnswer(answers[idx]||'',q.keywordGroups,q.minWords,q.minGroups);
        if(res.pass)ta.classList.add('correct'); else ta.classList.add('wrong');
        const fb=document.createElement('div');
        fb.className='q-feedback ' + (res.pass ? 'correct' : 'wrong');
        fb.innerHTML=(res.pass ? '✓ Looks correct!' : '✗ '+res.reason) + '<span class="sample"><b>Sample answer:</b> '+escapeHtml(q.sample)+'</span>';
        fb.style.display='block';
        body.appendChild(fb);
      }
    }
    host.appendChild(card);
  });
  updateProgress();
}

function submitAll(){
  if(submitted)return;
  const total=lesson.questions.length;
  if(Object.keys(answers).length<total){
    if(!confirm('Some questions are still blank. Submit anyway?'))return;
  }
  let score=0;
  lesson.questions.forEach(function(q,idx){
    const a=answers[idx];
    if(a===undefined)return;
    if(q.type==='short'||q.type==='complete'){
      if(isAnswerCorrect(a, q.answers || [q.answer])) score++;
    }else if(q.type==='tfng'){
      if(a===q.answer)score++;
    }else if(q.type==='mcq'){
      if(a===q.correct)score++;
    }else if(q.type==='long'){
      const res=checkLongAnswer(String(a),q.keywordGroups,q.minWords,q.minGroups);
      if(res.pass)score++;
    }
  });
  submitted=true;
  if(sessionRef&&!teacherMode){
    sessionRef.child('homework/'+homeworkId).update({
      version:homeworkVersion,
      answers:answers,
      score:score,
      total:total,
      submitted:true,
      completed:true,
      updatedAt:Date.now()
    }).catch(function(e){console.error(e)});
  }
  renderQuestions();
  const host=document.getElementById('questionsHost');
  const banner=document.createElement('div');banner.className='result-banner';
  banner.innerHTML='<div class="icon">🎉</div><h3>Homework complete!</h3>'+
    '<div class="big">'+score+' / '+total+'</div>'+
    '<p>Your answers have been sent to your teacher. You can review your results below.</p>'+
    '<p style="font-size:14px;color:var(--error);font-weight:bold;margin-top:10px">This homework can only be submitted once.</p>';
  host.insertBefore(banner,host.firstChild);
  window.scrollTo({top:0,behavior:'smooth'});
  if(typeof confetti==='function')confetti();
  updateProgress();
}

function confetti(){
  const colors=['#ee5a24','#ff6b6b','#2a5298','#28a745','#ffd700','#6a3093'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*.5+'s';
    c.style.width=(Math.random()*8+6)+'px';c.style.height=(Math.random()*8+6)+'px';
    if(Math.random()>.5)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(function(){c.remove()},3600);
  }
}

async function loadHomeworkContent() {
  let fileName = '';
  if (variant) {
     fileName = variant.startsWith('homework_') ? variant : 'homework_' + variant;
  } else if (code) {
     fileName = 'homework_' + code.toLowerCase(); 
  } else {
     fileName = 'homework_sabina'; 
  }
  
  const res = await fetch('content/' + fileName + '.json', { cache: 'no-store' });
  if (!res.ok) {
      const fallback = await fetch('content/homework_sabina.json', { cache: 'no-store' });
      if(!fallback.ok) throw new Error('content/' + fileName + '.json not found and fallback failed.');
      lesson = await fallback.json();
      return;
  }
  lesson = await res.json();
}

    document.getElementById('heroHeadline').textContent=lesson.headline;
    document.getElementById('heroIntro').innerHTML=escapeHtml(lesson.intro)+
      '<span class="ru">Это одностраничная домашка: прочитайте текст и ответьте на все вопросы. Отправить работу можно только один раз.</span>';

    if(teacherPreviewRequested){
      fbAuth.onAuthStateChanged(function(user){
        teacherCanEdit=!!(user&&TEACHER_EMAILS.includes(String(user.email||'').toLowerCase()));
        teacherMode=teacherCanEdit;
        if(teacherCanEdit){
          document.getElementById('teacherResetArea').style.display='block';
          renderPassage();renderQuestions();
        }
        else{document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Teacher sign-in required</h2></div>'}
      });
      return;
    }

    fbAuth.onAuthStateChanged(function(user){
      if(!user){
        document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Please sign in</h2><p>Open the <a href="portal.html" style="color:#ee5a24">student portal</a> first.</p></div>';
        return;
      }
      if(!code){startHomework();return}
      fbDb.ref('students/'+code).once('value').then(function(snap){
        const s=snap.val();
        const isTeacher = user.email === 'alibek.alpysbayev@gmail.com';
        if(!s || (!isTeacher && s.uid !== user.uid)){
          document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Access denied</h2><p>Your account is not linked to this student code.</p></div>';
          return;
        }
        startHomework();
      });
    });
  }catch(e){console.error(e);startHomework()}
}

function startHomework(){
  if(fbDb&&!teacherMode){
    sessionRef=fbDb.ref('sessions/'+code);
    sessionRef.child('homework/'+homeworkId).once('value').then(function(snap){
      const data=snap.val()||{};
      if(Number(data.version)===homeworkVersion){
        answers=data.answers||{};
        submitted=!!data.submitted;
      }else{
        answers={};submitted=false;
        sessionRef.child('homework/'+homeworkId).set({
          version:homeworkVersion,answers:{},score:0,total:lesson.questions.length,completed:false
        }).catch(function(){});
      }
      renderPassage();renderQuestions();
      if(submitted){
        const host=document.getElementById('questionsHost');
        const banner=document.createElement('div');banner.className='result-banner';
        banner.innerHTML='<div class="icon">✓</div><h3>Homework already submitted</h3>'+
          '<p>Your teacher has your answers. You can review the feedback below.</p>';
        host.insertBefore(banner,host.firstChild);
      }
    }).catch(function(e){
      console.error(e);renderPassage();renderQuestions();
    });
  }else{
    renderPassage();renderQuestions();
  }
}

(async function boot() {
  try {
    await loadHomeworkContent();
  } catch (e) {
    document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Homework content failed to load</h2><p>' + e.message + '</p></div>';
    return;
  }
  initFirebase();
})();
</script>
</body>
</html>
