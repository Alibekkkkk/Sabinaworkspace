<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root{color-scheme:light;--bg:#f4f1ea;--panel:#fff;--paper:#fffdf7;--ink:#2c3e50;--ink-soft:#6c757d;--primary:#2a5298;--primary-dark:#1e3c72;--accent:#ee5a24;--accent-dark:#d94a15;--success:#2e9e5b;--success-soft:#d4edda;--error:#dc3545;--error-soft:#f8d7da;--warn:#ff9800;--border:#e0dbd0;--shadow-sm:0 2px 6px rgba(0,0,0,.06);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.15)}
html.dark{color-scheme:dark;--bg:#1a1d24;--panel:#232832;--paper:#1e222a;--ink:#e8e8ea;--ink-soft:#a0a6b0;--primary:#5b8dd9;--primary-dark:#2a5298;--accent:#ff8a5b;--accent-dark:#ee5a24;--success:#4caf7d;--success-soft:#1e3a2a;--error:#ef5468;--error-soft:#3a1e22;--border:#333944}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'EB Garamond','Times New Roman',serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .2s,color .2s}
.hw-top{display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 22px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.hw-top .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.hw-top .title-block{display:flex;flex-direction:column}
.hw-top .title-block .brand{font-size:20px;font-weight:800;line-height:1.1}
.hw-top .title-block .sub{font:11px 'Fira Code',monospace;color:var(--ink-soft);letter-spacing:1.3px;text-transform:uppercase;margin-top:2px}
.hw-top .spacer{flex:1}
.hw-top .tts-group{display:flex;gap:6px;flex-wrap:wrap}
.hw-top button,.hw-top a{border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 12px;text-decoration:none;font:700 15px 'EB Garamond','Times New Roman',serif;cursor:pointer;transition:all .15s;font-family:inherit}
.hw-top button:hover,.hw-top a:hover{border-color:var(--accent);color:var(--accent)}
.hw-top .tts-group button.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{max-width:1500px;margin:20px auto 60px;padding:0 22px}
.hero{padding:26px 4px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero .eyebrow{font:12px 'Fira Code',monospace;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hero h1{font-size:clamp(30px,4.5vw,48px);line-height:1.05;margin-bottom:8px;font-weight:800}
.hero .intro{font-size:18px;line-height:1.55;color:var(--ink-soft);max-width:720px;margin:0}
.hero .intro .ru{display:block;margin-top:8px;font-style:italic;font-size:15px;color:var(--ink-soft);opacity:.85}
.progress-shell{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.progress-shell .label{font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.progress-track{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:99px;transition:width .35s}
.progress-pct{font:700 14px 'Fira Code',monospace;color:var(--accent);white-space:nowrap}
.hw-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media(max-width:980px){.hw-split{grid-template-columns:1fr}}
.reading-pane{position:sticky;top:80px}
.questions-pane{min-width:0}
.passage{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:28px 32px;font-size:18px;line-height:1.9;color:var(--ink);box-shadow:var(--shadow-sm);max-height:calc(100vh - 120px);overflow-y:auto}
.passage h2{font-size:26px;color:var(--accent);margin-bottom:6px;font-weight:800;line-height:1.2}
.passage .subtitle{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.passage p{margin-bottom:16px;text-align:justify}
.passage p .para-label{font-weight:800;color:var(--accent);margin-right:6px}
.v-word{background:rgba(238,90,36,.12);color:var(--accent-dark);font-weight:700;cursor:pointer;padding:1px 5px;border-radius:5px;border-bottom:2px dotted var(--accent);font-family:inherit;font-size:inherit}
.v-word:hover{background:var(--accent);color:#fff}
.v-word.learned{background:var(--success-soft);color:var(--success);border-bottom-color:var(--success)}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.q-num{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.q-type{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--ink-soft);margin-left:6px;text-transform:none;letter-spacing:0}
.q-prompt{font-size:17px;line-height:1.55;color:var(--ink);font-weight:600;margin-bottom:12px}
.q-opts{display:flex;gap:8px;flex-wrap:wrap}
.q-opt{padding:10px 16px;background:var(--bg);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .15s}
.q-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.q-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error)}
.q-input-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-input{flex:1;min-width:200px;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);outline:none}
.q-input:focus{border-color:var(--accent);background:var(--panel)}
.q-input.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.q-input.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error)}
.q-textarea{width:100%;min-height:90px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);outline:none;resize:vertical}
.q-textarea:focus{border-color:var(--accent);background:var(--panel)}
.q-textarea.correct{border-color:var(--success);background:var(--success-soft)}
.q-textarea.wrong{border-color:var(--error);background:var(--error-soft)}
.q-feedback{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600;display:none}
.q-feedback.correct{background:var(--success-soft);color:var(--success);display:block;border-left:4px solid var(--success)}
.q-feedback.wrong{background:var(--error-soft);color:var(--error);display:block;border-left:4px solid var(--error)}
.q-feedback .exp{display:block;font-weight:500;font-size:14px;color:var(--ink-soft);margin-top:6px;font-style:italic}
.q-feedback .sample{display:block;font-weight:600;font-size:14px;color:var(--ink);margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;font-style:italic}
.tfng-opts{display:flex;gap:8px;flex-wrap:wrap}
.tfng-opts .q-opt{padding:9px 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 3px 0 var(--accent-dark)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--accent-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--border);box-shadow:0 2px 0 var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.flag{background:var(--warn);box-shadow:0 3px 0 #c96b00;color:#fff;padding:7px 14px;font-size:14px}
.btn.flag:hover{background:#e08600}
.btn.flag.done{background:var(--success);box-shadow:0 3px 0 #1e7e34;opacity:.7}
.review-btn-row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.review-btn-row .hint{font-size:12px;color:var(--ink-soft);font-style:italic}
.submit-bar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-top:16px;box-shadow:0 -4px 20px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.submit-bar .hint{font-size:14px;color:var(--ink-soft);font-weight:600}
.submit-bar .hint b{color:var(--accent)}
.submit-bar .submit-btn{padding:14px 34px;font-size:17px}
.submit-bar .submit-btn:disabled{opacity:.5;cursor:not-allowed}
.result-banner{background:linear-gradient(135deg,rgba(46,158,91,.1),rgba(46,158,91,.03));border:2px dashed var(--success);border-radius:16px;padding:28px 22px;margin-bottom:16px;text-align:center}
.result-banner .icon{font-size:56px;margin-bottom:10px}
.result-banner h3{font-size:24px;color:var(--success);margin-bottom:8px;font-weight:800}
.result-banner .big{font-size:60px;font-weight:800;color:var(--accent);line-height:1;margin:14px 0}
.result-banner p{font-size:16px;color:var(--ink-soft);line-height:1.6}
.vocab-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.vocab-backdrop.open{display:flex}
.vocab-card{background:var(--panel);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;padding:28px 30px 24px;text-align:left}
.vocab-card .close-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;font-family:inherit}
.vocab-card .close-x:hover{color:var(--error);border-color:var(--error)}
.vocab-card .head{text-align:center;margin-bottom:18px}
.vocab-card .head .emoji{font-size:64px;line-height:1;margin-bottom:8px}
.vocab-card .head .word{font-size:30px;font-weight:800;color:var(--primary)}
.fc-meaning{padding:14px 16px;background:var(--bg);border-radius:12px;border-left:4px solid var(--accent);margin-bottom:12px}
.fc-meaning .context{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.fc-meaning .translation{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.fc-meaning .example{font-size:14px;line-height:1.6;color:var(--ink-soft);font-style:italic;padding-left:10px;border-left:2px solid var(--border)}
.fc-meaning .example b{color:var(--primary);font-style:normal}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:999;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
::selection{background:var(--accent);color:#fff}
@media(max-width:640px){.wrap{padding:0 12px}.passage{padding:20px 22px;font-size:17px;max-height:none}.hw-top{padding:10px 12px;gap:8px}.hw-top .title-block .brand{font-size:17px}.hw-top button,.hw-top a{padding:7px 10px;font-size:13px}}
</style>
</head>
<body>

<div class="hw-top">
  <div class="mark" id="markIcon">📘</div>
  <div class="title-block">
    <div class="brand" id="hwTitle">Homework</div>
    <div class="sub" id="hwSub">Topic · Homework</div>
  </div>
  <div class="spacer"></div>
  <div class="tts-group">
    <button id="ttsPlay" onclick="speakLong()">▶️ Listen</button>
    <button id="ttsPause" style="display:none" onclick="pauseTTS()">⏸ Pause</button>
    <button id="ttsResume" style="display:none" onclick="resumeTTS()">▶️ Resume</button>
    <button id="ttsStop" style="display:none" onclick="stopTTS()">⏹ Stop</button>
  </div>
  <button onclick="toggleTheme()" id="themeButton">🌙 Theme</button>
  <a href="portal.html">← Classwork</a>
</div>

<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow" id="heroEyebrow">Topic · Homework</div>
      <h1 id="heroHeadline">Homework</h1>
      <p class="intro" id="heroIntro"></p>
    </div>
  </section>

  <div class="progress-shell">
    <span class="label">Progress</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-pct" id="progressPct">0%</span>
    <span class="label" id="progressCount">0 / 0 answered</span>
  </div>

  <div class="hw-split">
    <section class="reading-pane">
      <div class="passage" id="passageBody"></div>
    </section>
    <section class="questions-pane" id="questionsHost"></section>
  </div>

  <div class="submit-bar" id="submitBar">
    <div class="hint" id="submitHint">Answer every question to unlock submission. <b>0 remaining.</b></div>
    <button class="btn submit-btn" id="submitBtn" onclick="submitAll()" disabled>✓ Submit homework</button>
  </div>
</div>

<div class="vocab-backdrop" id="vocabBackdrop" onclick="if(event.target===this)closeVocab()">
  <div class="vocab-card">
    <button class="close-x" onclick="closeVocab()">×</button>
    <div class="head">
      <div class="emoji" id="vocabEmoji">📖</div>
      <div class="word" id="vocabWord"></div>
    </div>
    <div id="vocabMeanings"></div>
  </div>
</div>

<script>
/* ================== FIREBASE ================== */
const firebaseConfig={apiKey:"AIzaSyDL3lnUdhKBqAPEoiJjBnpGqU1ol4Fwa7w",authDomain:"sabina-s-workspace.firebaseapp.com",databaseURL:"https://sabina-s-workspace-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sabina-s-workspace",storageBucket:"sabina-s-workspace.firebasestorage.app",messagingSenderId:"64645562064",appId:"1:64645562064:web:2c5b5a37b5ab9a685be8d5"};
let fbApp=null,fbDb=null,fbAuth=null,sessionRef=null,teacherMode=false,teacherCanEdit=false;

const params=new URLSearchParams(location.search);
const variant=params.get('variant')==='sabina'?'sabina':'gaziz';
const code=(params.get('code')||'').toUpperCase();
const homeworkId=params.get('lesson')||('homework_'+variant);
const homeworkVersion=6;
const teacherPreviewRequested=params.get('teacher')==='1';
const TEACHER_EMAILS=['alibek.alpysbayev@gmail.com'];

/* ================== HELPERS ================== */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function escapeAttr(s){return escapeHtml(s)}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}

/* ================== TTS ================== */
let soundOn=true,ukVoice=null,ttsState='idle',ttsUtterId=0;
function pickUKVoice(){if(!('speechSynthesis' in window))return null;const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en-gb'))||v.find(x=>x.name&&/british|uk|england|daniel|kate|serena|oliver|libby|sonia/i.test(x.name))||null}
if('speechSynthesis' in window){ukVoice=pickUKVoice();window.speechSynthesis.onvoiceschanged=()=>{ukVoice=pickUKVoice()}}
function speakLong(){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    ttsUtterId++;const myId=ttsUtterId;
    const text=document.getElementById('passageBody').innerText.replace(/\s+/g,' ').trim();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-GB';u.rate=.9;u.pitch=1;
    if(ukVoice)u.voice=ukVoice;
    u.onend=function(){if(ttsUtterId===myId){ttsState='idle';updateTTSButtons()}};
    u.onerror=function(){if(ttsUtterId===myId){ttsState='idle';updateTTSButtons()}};
    window.speechSynthesis.speak(u);
    ttsState='playing';updateTTSButtons();
  }catch(e){}
}
function pauseTTS(){if(!('speechSynthesis' in window))return;if(window.speechSynthesis.speaking&&!window.speechSynthesis.paused){window.speechSynthesis.pause();ttsState='paused';updateTTSButtons()}}
function resumeTTS(){if(!('speechSynthesis' in window))return;if(window.speechSynthesis.paused){window.speechSynthesis.resume();ttsState='playing';updateTTSButtons()}}
function stopTTS(){if(!('speechSynthesis' in window))return;ttsUtterId++;window.speechSynthesis.cancel();ttsState='idle';updateTTSButtons()}
function updateTTSButtons(){
  const p=document.getElementById('ttsPlay');if(p)p.style.display=ttsState==='playing'?'none':'';
  const pa=document.getElementById('ttsPause');if(pa)pa.style.display=ttsState==='playing'?'':'none';
  const r=document.getElementById('ttsResume');if(r)r.style.display=ttsState==='paused'?'':'none';
  const s=document.getElementById('ttsStop');if(s)s.style.display=ttsState!=='idle'?'':'none';
}

/* ================== THEME ================== */
function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  const dark=document.documentElement.classList.contains('dark');
  try{localStorage.setItem('nd_homework_theme_v2',dark?'dark':'light')}catch(e){}
  const b=document.getElementById('themeButton');if(b)b.textContent=dark?'☀️ Theme':'🌙 Theme';
}
try{const t=localStorage.getItem('nd_homework_theme_v2');if(t==='dark')document.documentElement.classList.add('dark')}catch(e){}
document.getElementById('themeButton').textContent=document.documentElement.classList.contains('dark')?'☀️ Theme':'🌙 Theme';

/* ================== CONTENT ================== */
const CONTENT={
  gaziz:{
    title:'Gaziz · Sustainable Cities — Homework',
    headline:'Rivergate revisits its plans',
    intro:'Read the case study and answer every question. This is a single-page homework: work through the article and the questions on the right. You cannot submit until all questions are answered.',
    hero:'🏙️ → 🚲 → 🌳',
    sub:'Sustainable Cities · Reading & Grammar',
    eyebrow:'Topic · Sustainable Cities · Homework',
    reading:{
      title:'Rivergate Revisits Its Plans',
      subtitle:'A follow-up case study on sustainable urban change',
      paragraphs:[
        {label:'A.',text:'In 2018, the small city of Rivergate launched an ambitious programme to reduce its dependence on cars. The council promised to make cycling and public transport the primary ways of moving around by 2030. At the time, few residents believed the plan would succeed. Traffic was heavy, and most families owned at least one car. Yet five years later, the situation has changed dramatically. The number of cyclists has tripled, and the city has become a model for other towns in the region.'},
        {label:'B.',text:'The transformation did not happen overnight. Council planners began with a modest experiment: they closed one street in the city centre to cars for three months. When the trial ended, local shops reported that their customers had not disappeared — in fact, sales had risen slightly. This surprising result gave the council confidence to expand the programme. In 2020, the council converted five more streets into pedestrian-only zones and installed over a hundred bike racks across the city.'},
        {label:'C.',text:'The most visible change has been the new network of cycle paths. Rivergate now has more than 200 kilometres of dedicated lanes, many of them separated from car traffic by trees and planters. In winter, cycle paths are cleared of snow before roads, a decision that was controversial at the time but has since become popular. Cyclists are given priority at most intersections. Perhaps most importantly, the city has measured success not by how fast cars move, but by how many people choose to cycle or walk.'},
        {label:'D.',text:'Alongside transport, Rivergate has invested in public spaces. The old industrial harbour has been cleaned and reopened as a riverside park. Warehouses that once stood empty have been converted into apartments, cafés, and a small theatre. Residents can now swim in the river during the summer months — something that would have been unthinkable ten years ago, when the water was polluted.'},
        {label:'E.',text:'Not everyone has welcomed the changes. Some shopkeepers complained that removing parking spaces had reduced their customers. Others argued that the new cycle paths mostly served wealthier neighbourhoods. Critics pointed out that the programme had been expensive and that the council had spent millions of euros on projects that would take decades to pay back. Some also questioned whether a small city like Rivergate could really serve as a model for larger urban areas.'},
        {label:'F.',text:'Despite the criticism, the results have been difficult to dismiss. Air pollution has fallen by 45 per cent. Traffic accidents involving cyclists have dropped sharply. Surveys suggest that residents are more satisfied with their city than they were a decade ago. Rivergate has also attracted new investment: several technology companies have moved their offices to the city centre, citing the pleasant environment as a key factor. The question for other cities is no longer whether sustainable transformation is possible, but how quickly they can follow Rivergate\u2019s example.'}
      ]
    },
    vocab:[
      {en:'ambitious',emoji:'🚀',meanings:[
        {context:'demanding or difficult',ru:'амбициозный, масштабный',ex:'The council launched an <b>ambitious</b> programme to reduce car use.'},
        {context:'having a strong desire to succeed',ru:'целеустремлённый',ex:'She is an <b>ambitious</b> young architect.'}
      ]},
      {en:'dependence',emoji:'🔗',meanings:[

const lesson=CONTENT[variant];


/* ================== STATE ================== */
let answers={};          /* keyed by question index, holds student's answer */
let submitted=false;
let reviewFlags={};      /* keyed by question index, true if flagged */

/* ================== RENDER PASSAGE ================== */
function renderPassage(){
  const p=lesson.reading;
  const body=document.getElementById('passageBody');
  if(!body)return;
  let html='<h2>'+escapeHtml(p.title)+'</h2><div class="subtitle">'+escapeHtml(p.subtitle)+'</div>';
  /* Collect every vocab word so we can highlight them inside the passage */
  const vocabWords=lesson.vocab.map(v=>v.en);
  p.paragraphs.forEach(function(par){
    let text=escapeHtml(par.text);
    /* Bold any vocab word (simple word-boundary, case-insensitive) */
    vocabWords.forEach(function(w){
      const escW=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b('+escW+')\\b','gi');
      text=text.replace(re,'<span class="v-word" data-vocab="'+escapeAttr(w)+'">$1</span>');
    });
    html+='<p><span class="para-label">'+escapeHtml(par.label)+'</span>'+text+'</p>';
  });
  body.innerHTML=html;
  body.querySelectorAll('.v-word').forEach(function(el){
    el.onclick=function(){openVocab(el.dataset.vocab)};
  });
}

/* ================== VOCAB MODAL ================== */
function openVocab(word){
  const v=lesson.vocab.find(function(x){return x.en===word});
  if(!v)return;
  document.getElementById('vocabEmoji').textContent=v.emoji||'📖';
  document.getElementById('vocabWord').textContent=v.en;
  document.getElementById('vocabMeanings').innerHTML=v.meanings.map(function(m){
    return '<div class="fc-meaning"><div class="context">'+escapeHtml(m.context)+'</div>'+
      '<div class="translation">'+escapeHtml(m.ru)+'</div>'+
      '<div class="example">'+m.ex+'</div></div>';
  }).join('');
  document.getElementById('vocabBackdrop').classList.add('open');
}
function closeVocab(){document.getElementById('vocabBackdrop').classList.remove('open')}

/* ================== PROGRESS ================== */
function updateProgress(){
  const total=lesson.questions.length;
  const answered=Object.keys(answers).length;
  const pct=total?Math.round(answered/total*100):0;
  const pf=document.getElementById('progressFill');if(pf)pf.style.width=pct+'%';
  const pp=document.getElementById('progressPct');if(pp)pp.textContent=pct+'%';
  const pc=document.getElementById('progressCount');if(pc)pc.textContent=answered+' / '+total+' answered';
  const remaining=total-answered;
  const hint=document.getElementById('submitHint');
  const btn=document.getElementById('submitBtn');
  if(submitted){
    if(btn){btn.disabled=true;btn.textContent='✓ Submitted'}
    if(hint)hint.innerHTML='Homework already submitted.';
    return;
  }
  if(remaining===0){
    if(hint)hint.innerHTML='All questions answered. Ready to submit!';
    if(btn)btn.disabled=false;
  }else{
    if(hint)hint.innerHTML='Answer every question to unlock submission. <b>'+remaining+' remaining.</b>';
    if(btn)btn.disabled=true;
  }
}

/* ================== FLAG FOR REVIEW ================== */
function flagForReview(idx,prompt,studentAnswer,autoResult){
  if(teacherMode)return;
  if(!sessionRef){alert('Cannot send to teacher — no session connected.');return}
  const payload={stage:'homework',questionId:'hw_'+idx,prompt:prompt,studentAnswer:studentAnswer,autoResult:autoResult,ts:Date.now(),homeworkId:homeworkId};
  sessionRef.child('reviewQueue').push(payload).then(function(){
    reviewFlags[idx]=true;
    const btn=document.querySelector('[data-flag-idx="'+idx+'"]');
    if(btn){btn.classList.add('done');btn.textContent='✓ Sent to teacher'}
  }).catch(function(e){alert('Failed to send: '+e.message)});
}

/* ================== BUILD FLAG BUTTON ================== */
function flagButtonHTML(idx){
  if(teacherMode)return '';
  return '<div class="review-btn-row"><button class="btn flag" data-flag-idx="'+idx+'" onclick="flagFromButton(this)">🚩 Flag for teacher review</button><span class="hint">If you think your answer is correct but the check says no, click here.</span></div>';
}
function flagFromButton(btn){
  const idx=Number(btn.dataset.flagIdx);
  const q=lesson.questions[idx];if(!q)return;
  let studentAnswer='';
  if(q.type==='long'||q.type==='short'||q.type==='complete'){
    const ta=document.querySelector('[data-answer-idx="'+idx+'"]');
    if(ta)studentAnswer=ta.value||'';
  }
  flagForReview(idx,q.prompt,studentAnswer,'flagged-manually');
}

/* ================== CHECK LONG ANSWER ================== */
function checkLongAnswer(text,keywordGroups,minWords,minGroups){
  const t=norm(text);
  const words=t.split(/\s+/).filter(function(w){return w.length>0});
  if(words.length<minWords)return{pass:false,reason:'Your answer is too short. Aim for at least '+minWords+' words.',matched:0};
  let matched=0;
  keywordGroups.forEach(function(g){if(g.some(function(k){return t.indexOf(norm(k))!==-1}))matched++});
  if(matched>=minGroups)return{pass:true,matched:matched,total:keywordGroups.length};
  return{pass:false,reason:'You matched '+matched+' of '+keywordGroups.length+' key ideas. Check the passage again and try to include more.',matched:matched};
}

/* ================== RENDER QUESTIONS ================== */
function renderQuestions(){
  const host=document.getElementById('questionsHost');if(!host)return;
  host.innerHTML='';
  lesson.questions.forEach(function(q,idx){
    const card=document.createElement('div');card.className='q-card';
    const typeLabel={short:'Short answer',tfng:'True / False / Not Given',mcq:'Multiple choice',long:'Long answer',complete:'Complete the sentence'}[q.type]||'';
    card.innerHTML='<div class="q-num">Question '+(idx+1)+' <span class="q-type">'+typeLabel+'</span></div><div class="q-prompt">'+escapeHtml(q.prompt).replace('___','<b style="color:var(--accent)">___</b>')+'</div>';
    const body=document.createElement('div');
    card.appendChild(body);
    if(q.type==='short'||q.type==='complete'){
      const row=document.createElement('div');row.className='q-input-row';
      const inp=document.createElement('input');inp.type='text';inp.className='q-input';inp.placeholder='Type your answer...';inp.autocomplete='off';inp.dataset.answerIdx=idx;
      const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check';
      const fb=document.createElement('div');fb.className='q-feedback';
      let done=false;
      function submit(){
        if(done)return;
        const val=norm(inp.value);
        const accepted=q.type==='short'?q.answers:q.answers;
        const ok=accepted.some(function(a){return norm(a)===val});
        if(ok){
          inp.classList.add('correct');inp.disabled=true;btn.disabled=true;done=true;
          fb.className='q-feedback correct';fb.innerHTML='✓ Correct!<span class="exp">'+escapeHtml(q.exp||'')+'</span>';
          answers[idx]=inp.value;updateProgress();
        }else{
          inp.classList.add('wrong');
          fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite. Try again.';
          setTimeout(function(){inp.classList.remove('wrong')},600);
        }
      }
      btn.onclick=submit;
      inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
      /* Mark as answered as soon as the student types anything (so progress unlocks even if wrong) */
      inp.addEventListener('input',function(){
        if(inp.value.trim().length>0){answers[idx]=inp.value;updateProgress()}
        else{delete answers[idx];updateProgress()}
      });
      row.appendChild(inp);row.appendChild(btn);
      body.appendChild(row);body.appendChild(fb);
      body.insertAdjacentHTML('beforeend',flagButtonHTML(idx));
    }else if(q.type==='tfng'){
      const opts=document.createElement('div');opts.className='tfng-opts';
      shuffle(['True','False','Not Given']).forEach(function(o){
        const b=document.createElement('button');b.className='q-opt';b.textContent=o;
        b.onclick=function(){
          if(b.disabled)return;
          opts.querySelectorAll('button').forEach(function(x){x.disabled=true});
          const fb=card.querySelector('.q-feedback');
          if(o===q.answer){b.classList.add('correct');fb.className='q-feedback correct';fb.innerHTML='✓ Correct!<span class="exp">'+escapeHtml(q.exp||'')+'</span>'}
          else{b.classList.add('wrong');opts.querySelectorAll('button').forEach(function(x){if(x.textContent===q.answer)x.classList.add('correct')});fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite.<span class="exp">'+escapeHtml(q.exp||'')+'</span>'}
          answers[idx]=o;updateProgress();
        };
        opts.appendChild(b);
      });
      body.appendChild(opts);
      const fb=document.createElement('div');fb.className='q-feedback';body.appendChild(fb);
    }else if(q.type==='mcq'){
      const opts=document.createElement('div');opts.className='q-opts';
      shuffle(q.options).forEach(function(o){
        const b=document.createElement('button');b.className='q-opt';b.textContent=o;
        b.onclick=function(){
          if(b.disabled)return;
          opts.querySelectorAll('button').forEach(function(x){x.disabled=true});
          const fb=card.querySelector('.q-feedback');
          if(o===q.correct){b.classList.add('correct');fb.className='q-feedback correct';fb.innerHTML='✓ Correct!<span class="exp">'+escapeHtml(q.exp||'')+'</span>'}
          else{b.classList.add('wrong');opts.querySelectorAll('button').forEach(function(x){if(x.textContent===q.correct)x.classList.add('correct')});fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite.<span class="exp">'+escapeHtml(q.exp||'')+'</span>'}
          answers[idx]=o;updateProgress();
        };
        opts.appendChild(b);
      });
      body.appendChild(opts);
      const fb=document.createElement('div');fb.className='q-feedback';body.appendChild(fb);
    }else if(q.type==='long'){
      const ta=document.createElement('textarea');ta.className='q-textarea';ta.placeholder='Write your answer in full sentences...';ta.dataset.answerIdx=idx;
      const row=document.createElement('div');row.className='q-input-row';row.style.marginTop='10px';
      const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check my answer';
      const fb=document.createElement('div');fb.className='q-feedback';
      let done=false;
      function submit(){
        if(done)return;
        const txt=ta.value.trim();
        const res=checkLongAnswer(txt,q.keywordGroups,q.minWords,q.minGroups);
        if(res.pass){
          ta.classList.add('correct');ta.disabled=true;btn.disabled=true;done=true;
          fb.className='q-feedback correct';fb.innerHTML='✓ Looks correct! You matched '+res.matched+' key ideas.<span class="exp">'+escapeHtml(q.exp||'')+'</span>';
        }else{
          ta.classList.add('wrong');
          fb.className='q-feedback wrong';fb.innerHTML='✗ '+res.reason+'<span class="sample"><b>Sample answer:</b> '+escapeHtml(q.sample)+'</span>';
        }
        answers[idx]=txt;updateProgress();
      }
      btn.onclick=submit;
      ta.addEventListener('input',function(){
        if(ta.value.trim().length>0){answers[idx]=ta.value;updateProgress()}
        else{delete answers[idx];updateProgress()}
      });
      row.appendChild(btn);
      body.appendChild(ta);body.appendChild(row);body.appendChild(fb);
      body.insertAdjacentHTML('beforeend',flagButtonHTML(idx));
    }
    host.appendChild(card);
  });
  /* Restore previously saved answers on page load */
  restoreAnswers();
  updateProgress();
}

/* ================== RESTORE SAVED ANSWERS ================== */
function restoreAnswers(){
  lesson.questions.forEach(function(q,idx){
    if(!(idx in answers))return;
    const saved=answers[idx];
    if(q.type==='short'||q.type==='complete'||q.type==='long'){
      const ta=document.querySelector('[data-answer-idx="'+idx+'"]');
      if(ta){ta.value=saved}
    }else if(q.type==='tfng'||q.type==='mcq'){
      const card=document.querySelectorAll('#questionsHost .q-card')[idx];
      if(!card)return;
      card.querySelectorAll('.q-opt').forEach(function(b){
        if(b.textContent===saved){b.disabled=true;
          /* apply visual state without re-running the click handler */
          if(q.type==='tfng'){if(saved===q.answer)b.classList.add('correct');else b.classList.add('wrong')}
          else{if(saved===q.correct)b.classList.add('correct');else b.classList.add('wrong')}
        }
      });
    }
  });
}

/* ================== SUBMIT ================== */
function submitAll(){
  if(submitted)return;
  const total=lesson.questions.length;
  if(Object.keys(answers).length<total){
    if(!confirm('Some questions are still blank. Submit anyway?'))return;
  }
  /* Grade everything one more time to compute score */
  let score=0;
  lesson.questions.forEach(function(q,idx){
    const a=answers[idx];
    if(a===undefined)return;
    if(q.type==='short'||q.type==='complete'){
      if(q.answers.some(function(x){return norm(x)===norm(a)}))score++;
    }else if(q.type==='tfng'){
      if(a===q.answer)score++;
    }else if(q.type==='mcq'){
      if(a===q.correct)score++;
    }else if(q.type==='long'){
      const res=checkLongAnswer(String(a),q.keywordGroups,q.minWords,q.minGroups);
      if(res.pass)score++;
    }
  });
  submitted=true;
  /* Save to Firebase */
  if(sessionRef&&!teacherMode){
    sessionRef.child('homework/'+homeworkId).update({
      version:homeworkVersion,
      answers:answers,
      score:score,
      total:total,
      submitted:true,
      completed:true,
      updatedAt:Date.now()
    }).catch(function(e){console.error(e)});
  }
  /* Visual result */
  const host=document.getElementById('questionsHost');
  const banner=document.createElement('div');banner.className='result-banner';
  banner.innerHTML='<div class="icon">🎉</div><h3>Homework complete!</h3>'+
    '<div class="big">'+score+' / '+total+'</div>'+
    '<p>Your answers have been sent to your teacher. You can close this page.</p>';
  host.insertBefore(banner,host.firstChild);
  window.scrollTo({top:0,behavior:'smooth'});
  if(typeof confetti==='function')confetti();
  updateProgress();
}

/* ================== CONFETTI ================== */
function confetti(){
  const colors=['#ee5a24','#ff6b6b','#2a5298','#28a745','#ffd700','#6a3093'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*.5+'s';
    c.style.width=(Math.random()*8+6)+'px';c.style.height=(Math.random()*8+6)+'px';
    if(Math.random()>.5)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(function(){c.remove()},3600);
  }
}

/* ================== FIREBASE INIT + AUTH ================== */
function initFirebase(){
  try{
    fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.database();
    fbAuth=firebase.auth();

    /* Display title from content */
    document.title=lesson.title;
    document.getElementById('hwTitle').textContent=lesson.title;
    document.getElementById('hwSub').textContent=lesson.sub;
    document.getElementById('heroEyebrow').textContent=lesson.eyebrow;
    document.getElementById('heroHeadline').textContent=lesson.headline;
    document.getElementById('heroIntro').innerHTML=escapeHtml(lesson.intro)+
      '<span class="ru">Это одностраничная домашка: прочитайте текст и ответьте на все вопросы. Отправить работу можно только после ответа на все вопросы.</span>';

    if(teacherPreviewRequested){
      fbAuth.onAuthStateChanged(function(user){
        teacherCanEdit=!!(user&&TEACHER_EMAILS.includes(String(user.email||'').toLowerCase()));
        teacherMode=teacherCanEdit;
        if(teacherCanEdit){renderPassage();renderQuestions()}
        else{document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Teacher sign-in required</h2></div>'}
      });
      return;
    }

    fbAuth.onAuthStateChanged(function(user){
      if(!user){
        document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Please sign in</h2><p>Open the <a href="portal.html" style="color:#ee5a24">student portal</a> first.</p></div>';
        return;
      }
      if(!code){startHomework();return}
      fbDb.ref('students/'+code).once('value').then(function(snap){
        const s=snap.val();
        if(!s||s.uid!==user.uid){
          document.body.innerHTML='<div style="text-align:center;padding:80px 20px;font-family:serif"><h2>Access denied</h2><p>Your account is not linked to this student code.</p></div>';
          return;
        }
        startHomework();
      });
    });
  }catch(e){console.error(e);startHomework()}
}

function startHomework(){
  if(fbDb&&!teacherMode){
    sessionRef=fbDb.ref('sessions/'+code);
    /* Load previous answers if resuming */
    sessionRef.child('homework/'+homeworkId).once('value').then(function(snap){
      const data=snap.val()||{};
      if(Number(data.version)===homeworkVersion){
        answers=data.answers||{};
        submitted=!!data.submitted;
      }else{
        answers={};submitted=false;
        sessionRef.child('homework/'+homeworkId).set({
          version:homeworkVersion,answers:{},score:0,total:lesson.questions.length,completed:false
        }).catch(function(){});
      }
      renderPassage();renderQuestions();
      if(submitted){
        /* Show submitted state immediately */
        const host=document.getElementById('questionsHost');
        const banner=document.createElement('div');banner.className='result-banner';
        banner.innerHTML='<div class="icon">✓</div><h3>Homework already submitted</h3>'+
          '<p>Your teacher has your answers.</p>';
        host.insertBefore(banner,host.firstChild);
      }
    }).catch(function(e){
      console.error(e);
      renderPassage();renderQuestions();
    });
  }else{
    renderPassage();renderQuestions();
  }
}

/* ================== BOOT ================== */
initFirebase();
</script>
