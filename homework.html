<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141a25">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.googleapis.com; frame-src https://www.youtube-nocookie.com https://accounts.google.com https://*.firebaseapp.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; worker-src 'self'; manifest-src 'self'">
<title>Homework</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="js/pwa.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/sanitize-html.js"></script>
<script type="module" src="js/pages/homework.js"></script>
<link rel="stylesheet" href="css/pages/homework.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/legacy-pages.css">
</head>
<body class="homework-page">

<div class="identity-banner" id="studentIdentityBanner"><span id="studentIdentityText"></span><button type="button" onclick="switchStudent()">Not you? Switch student</button></div>
<div class="hw-top">
  <div class="mark" id="markIcon">📘</div>
  <div class="title-block">
    <div class="brand" id="hwTitle">Homework</div>
    <div class="sub" id="hwSub">Topic · Homework</div>
  </div>
  <div class="spacer"></div>
  <div id="teacherResetArea" class="phase0-inline-1">
    <button onclick="resetHomeworkTeacher()" class="phase0-inline-2">🔄 Reset Whole Homework</button>
  </div>
  <button onclick="toggleTheme()" id="themeButton">🌙 Theme</button>
  <a href="portal.html">← Classwork</a>
</div>

<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow" id="heroEyebrow">Topic · Homework</div>
      <h1 id="heroHeadline">Homework</h1>
      <p class="intro" id="heroIntro"></p>
    </div>
  </section>

  <div class="progress-shell">
    <span class="label">Progress</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-pct" id="progressPct">0%</span>
    <span class="label" id="progressCount">0 / 0 answered</span>
  </div>

  <div class="hw-split">
    <section class="reading-pane">
      <div class="passage" id="passageBody"></div>
    </section>
    <section class="questions-pane" id="questionsHost"></section>
  </div>

  <div class="submit-bar" id="submitBar">
    <div class="hint" id="submitHint">Answer every question to unlock submission. <b>0 remaining.</b></div>
    <button class="btn submit-btn" id="submitBtn" onclick="submitAll()" disabled>✓ Submit homework</button>
  </div>
</div>

<div id="customContextMenu" class="context-menu"></div>

<div id="stickyNote" class="sticky-note">
  <div class="sticky-header" id="stickyDragHandle">
    <span class="sticky-title">📝 My Note</span>
    <div class="sticky-actions">
      <button class="sticky-btn delete" onclick="deleteCurrentNote()" title="Delete Note">🗑️</button>
      <button class="sticky-btn" onclick="closeStickyNote()" title="Close">✕</button>
    </div>
  </div>
  <div class="sticky-body">
    <textarea class="sticky-text" id="stickyText" placeholder="Type your note here..."></textarea>
  </div>
</div>

<div class="vocab-backdrop" id="vocabBackdrop" onclick="if(event.target===this)closeVocab()">
  <div class="vocab-card">
    <button class="close-x" onclick="closeVocab()">×</button>
    <div class="head">
      <div class="emoji" id="vocabEmoji">📖</div>
      <div class="word" id="vocabWord"></div>
    </div>
    <div id="vocabMeanings"></div>
  </div>
</div>


</body>
</html>
