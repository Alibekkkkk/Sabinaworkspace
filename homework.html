const cityText='<h2>Rivergate makes changes for its residents</h2><p>Rivergate is a growing city beside a wide river. In recent years, the local council has improved public transport. It has provided more buses in the evening, and it has added clear maps at busy stops. These changes have helped people travel to work, school, and the hospital. Last spring, the council opened a new bus station near the market. Residents tested the routes and shared their ideas at a public meeting.</p><p>The city has also worked to reduce pollution. It has planted trees along two busy roads and has created a small park beside the river. In 2023, local volunteers cleaned the riverbank and collected plastic waste. The project had a good result: families have used the park more often since then. Some residents have asked the council to add more bins, because visitors sometimes leave rubbish behind.</p><p>These plans have brought benefits, but they have also cost money. The council spent part of its budget on new buses and street lights last year. It has saved energy by using better lights in public buildings. The changes have affected daily life in different ways. Some people have found it easier to travel, while others still wait a long time at the busiest stops. The council will review the service this autumn and decide what to improve next.</p>';
