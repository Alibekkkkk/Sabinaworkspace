<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaziz — Sustainable Cities: Vocabulary, Reading & Tenses</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--paper:#fffdf7;--ink:#2c3e50;--ink-soft:#6c757d;--primary:#2a5298;--primary-dark:#1e3c72;--accent:#ee5a24;--accent-dark:#d94a15;--success:#2e9e5b;--success-soft:#d4edda;--error:#dc3545;--error-soft:#f8d7da;--warn:#ff9800;--border:#e0dbd0;--shadow-sm:0 2px 6px rgba(0,0,0,.06);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.15)}
html.dark{--bg:#1a1d24;--panel:#232832;--paper:#1e222a;--ink:#e8e8ea;--ink-soft:#a0a6b0;--primary:#5b8dd9;--primary-dark:#2a5298;--accent:#ff8a5b;--accent-dark:#ee5a24;--success:#4caf7d;--success-soft:#1e3a2a;--error:#ef5468;--error-soft:#3a1e22;--border:#333944}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'EB Garamond','Times New Roman',serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap}
.logo .mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(238,90,36,.35)}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--bg);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.stat-pill .val{color:var(--accent);font-size:16px}
.stat-pill .val.green{color:var(--success)}
.stat-pill .val.bump{animation:bump .5s}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-soft);transition:all .15s;position:relative}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:4px;animation:syncPulse 2s ease-in-out infinite}
.sync-dot.warn{background:var(--warn);animation:none}
.sync-dot.off{background:var(--error);animation:none}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.session-input{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700}
.session-input input{border:none;background:transparent;font-family:'Fira Code',monospace;font-size:13px;font-weight:800;color:var(--accent);outline:none;width:90px;text-transform:uppercase;letter-spacing:.5px}
.session-input input::placeholder{color:var(--ink-soft);font-weight:600;text-transform:none;letter-spacing:0}
.session-input .join-code{border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:11px;font-family:inherit;font-weight:700;padding:5px 9px;cursor:pointer}
.session-input .lbl{color:var(--ink-soft);font-weight:600}
.layout{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;flex-shrink:0}
.sidebar-header{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;padding:0 10px 10px;display:flex;justify-content:space-between;align-items:center}
.sidebar-header .pct{color:var(--accent);font-size:14px}
.progress-rail{height:6px;background:var(--bg);border-radius:6px;margin:0 10px 18px;overflow:hidden}
.progress-rail-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));width:0%;transition:width .5s ease;border-radius:6px}
.stage-list{display:flex;flex-direction:column;gap:2px}
.year-item{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;background:var(--bg);margin-top:4px}
.year-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.year-item.open .arrow{transform:rotate(90deg)}
.month-item{padding:8px 12px 8px 28px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:8px;border-radius:8px}
.month-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.month-item.open .arrow{transform:rotate(90deg)}
.lesson-item{padding:8px 12px 8px 44px;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-soft);border-radius:8px;display:flex;align-items:center;gap:8px}
.lesson-item.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.lesson-item.done{color:var(--success)}
.lesson-item.active.done{color:#fff}
.stage-sub-list{display:flex;flex-direction:column;gap:2px;padding-left:8px;margin-bottom:8px;border-left:2px solid var(--border);margin-left:22px}
.stage-sub-item{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;width:100%;font-family:inherit}
.stage-sub-item:hover{background:var(--bg);color:var(--ink)}
.stage-sub-item.active{background:var(--bg);color:var(--accent);font-weight:800}
.stage-sub-item.done{color:var(--success)}
.homework-sub-list{margin:2px 0 8px 30px;padding:7px 8px 7px 12px;border-left:2px solid var(--accent);background:rgba(255,138,91,.07);border-radius:0 9px 9px 0}
.homework-sub-label{font:11px 'Fira Code',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:2px 6px 5px}
.homework-sub-item{display:block;padding:6px;color:var(--ink-soft);font-size:14px;text-decoration:none;border-radius:7px}
.homework-sub-item:hover{background:var(--bg);color:var(--accent)}
.main{flex:1;overflow-y:auto;padding:30px 40px 40px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.stage-view{display:none;animation:fadeSlide .4s ease;max-width:1000px;margin:0 auto}
.stage-view.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stage-view h2{font-size:32px;color:var(--ink);margin-bottom:6px;font-weight:800}
.stage-view .eyebrow{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.stage-view .lead{font-size:17px;color:var(--ink-soft);line-height:1.65;margin-bottom:22px;padding:14px 18px;background:var(--panel);border-left:4px solid var(--primary);border-radius:10px}
.stage-view .lead .ru{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-style:italic;font-size:15px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 3px 0 var(--accent-dark)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--accent-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--border);box-shadow:0 2px 0 var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.success{background:var(--success);box-shadow:0 3px 0 #1e7e34}
.btn.small{padding:7px 14px;font-size:14px}
.btn.flag{background:var(--warn);box-shadow:0 3px 0 #c96b00;color:#fff}
.btn.flag:hover{background:#e08600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.flash-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:14px 18px;background:var(--panel);border-radius:12px;border:1px solid var(--border)}
.flash-toolbar .filt{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.flash-toolbar .filt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flash-stats{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink-soft)}
.flash-stats b{color:var(--success)}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.flashcard{background:var(--panel);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;aspect-ratio:1/1.05;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.flashcard:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 28px rgba(238,90,36,.18)}
.flashcard.known{border-color:var(--success)}
.flashcard.known::before{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--success);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;z-index:4}
.flashcard-img{flex:1;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,rgba(42,82,152,.06),rgba(238,90,36,.06));position:relative;overflow:hidden;min-height:100px}
.flashcard-img img{width:100%;height:100%;object-fit:cover}
.flashcard-word{padding:10px 8px;text-align:center;font-size:16px;font-weight:800;color:var(--ink);border-top:1px solid var(--border);background:var(--panel)}
.fc-modal-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.fc-modal-backdrop.open{display:flex}
.fc-modal{background:var(--panel);border-radius:22px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative}
.fc-modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.08);border:none;cursor:pointer;font-size:20px;color:var(--ink);z-index:10}
.fc-modal-img{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:180px;background:linear-gradient(135deg,#e8eef8,#f8eee8);border-radius:22px 22px 0 0;position:relative;overflow:hidden}
html.dark .fc-modal-img{background:linear-gradient(135deg,#2a3142,#3a2e28)}
.fc-modal-img img{width:100%;height:100%;object-fit:contain;padding:20px}
.fc-modal-img .label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--ink);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.fc-modal-body{padding:24px 28px 28px;text-align:center}
.fc-modal-word{font-size:34px;font-weight:800;color:var(--primary);margin-bottom:6px}
.fc-reveal-area{display:none;text-align:left;margin-top:18px}
.fc-reveal-area.show{display:block}
.fc-meaning{padding:14px 16px;background:var(--bg);border-radius:12px;border-left:4px solid var(--accent);margin-bottom:12px}
.fc-meaning .context{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.fc-meaning .translation{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px}
.fc-meaning .example{font-size:15px;line-height:1.6;color:var(--ink-soft);font-style:italic;padding-left:10px;border-left:2px solid var(--border)}
.fc-meaning .example b{color:var(--primary);font-style:normal}
.fc-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.fc-modal-actions .btn{min-width:130px;justify-content:center}
.fc-modal-tools{display:flex;gap:8px;justify-content:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);flex-wrap:wrap}
.fc-modal-tools .tool{padding:8px 14px;font-size:14px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink-soft)}
.fc-modal-tools .tool:hover{border-color:var(--accent);color:var(--accent)}
.fc-modal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.fc-modal-nav button{background:transparent;border:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);padding:8px 14px;border-radius:8px;font-family:inherit}
.fc-modal-nav .counter{font-size:14px;color:var(--ink-soft);font-weight:700}
.dd-area{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dd-col-title{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:2px dashed var(--border)}
.dd-words,.dd-slots{display:flex;flex-direction:column;gap:10px}
.dd-word{padding:12px 16px;background:var(--panel);border:2px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;color:var(--ink);cursor:grab;user-select:none;display:flex;align-items:center;gap:10px}
.dd-word:hover:not(.used){border-color:var(--accent);transform:translateX(3px)}
.dd-word.used{opacity:.25;cursor:default;pointer-events:none}
.dd-word::before{content:'⠿';color:var(--ink-soft);font-size:17px;letter-spacing:-2px}
.dd-slot{min-height:52px;padding:12px 16px;background:var(--bg);border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink-soft)}
.dd-slot.over{border-color:var(--accent);background:rgba(238,90,36,.08)}
.dd-slot.correct{background:var(--success-soft);border:2px solid var(--success);color:var(--success)}
.dd-slot.wrong{background:var(--error-soft);border:2px solid var(--error);animation:shake .4s}
.dd-slot .slot-label{flex:1}
.dd-slot .dropped-word{padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;font-size:14px}
.dd-slot .dropped-word.ok{background:var(--success)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.passage{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:32px 38px;font-size:19px;line-height:1.9;color:var(--ink);box-shadow:var(--shadow-sm);font-family:'EB Garamond',serif}
.passage h1{font-size:28px;color:var(--accent);margin-bottom:8px;font-weight:800;line-height:1.2}
.passage .subtitle{font-size:15px;color:var(--ink-soft);font-style:italic;margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:12px}
.passage p{margin-bottom:16px;text-align:justify}
.passage p .para-label{font-weight:800;color:var(--accent);margin-right:6px}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.q-num{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.q-type{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--ink-soft);margin-left:6px;text-transform:none;letter-spacing:0}
.q-prompt{font-size:18px;line-height:1.6;color:var(--ink);font-weight:600;margin-bottom:14px}
.q-opts{display:flex;gap:10px;flex-wrap:wrap}
.q-opt{padding:11px 20px;background:var(--bg);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.q-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.q-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);animation:shake .4s}
.q-input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q-input{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond',serif;font-size:17px;font-weight:700;color:var(--ink);background:var(--bg);outline:none}
.q-input:focus{border-color:var(--accent);background:var(--panel)}
.q-input.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.q-input.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);animation:shake .4s}
.q-textarea{width:100%;min-height:110px;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond',serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);outline:none;resize:vertical}
.q-textarea:focus{border-color:var(--accent);background:var(--panel)}
.q-textarea.correct{border-color:var(--success);background:var(--success-soft)}
.q-textarea.wrong{border-color:var(--error);background:var(--error-soft)}
.q-feedback{margin-top:12px;padding:11px 16px;border-radius:10px;font-size:16px;font-weight:600;display:none}
.q-feedback.correct{background:var(--success-soft);color:var(--success);display:block;border-left:4px solid var(--success)}
.q-feedback.wrong{background:var(--error-soft);color:var(--error);display:block;border-left:4px solid var(--error)}
.q-feedback.info{background:rgba(255,152,0,.12);color:#a26a00;display:block;border-left:4px solid var(--warn)}
html.dark .q-feedback.info{color:#f5c66b}
.q-feedback .exp{display:block;font-weight:500;font-size:15px;color:var(--ink-soft);margin-top:6px;font-style:italic}
.q-feedback .sample{display:block;font-weight:600;font-size:15px;color:var(--ink);margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;font-style:italic}
.tfng-opts{display:flex;gap:8px;flex-wrap:wrap}
.tfng-opts .q-opt{padding:9px 16px;font-size:15px}
.review-btn-row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.review-btn-row .hint{font-size:13px;color:var(--ink-soft);font-style:italic}
.g-box{background:linear-gradient(135deg,rgba(46,158,91,.08),rgba(46,158,91,.03));border:1px solid rgba(46,158,91,.35);border-radius:14px;padding:20px 24px;margin-bottom:22px}
.g-box h3{color:var(--success);font-size:20px;margin-bottom:12px;font-weight:800}
.g-formula{background:var(--panel);padding:14px 18px;border-radius:10px;margin:10px 0;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;color:var(--success);border-left:4px solid var(--success)}
.g-box ul{margin-left:22px;margin-top:8px}
.g-box li{font-size:16px;line-height:1.7;margin-bottom:4px;color:var(--ink)}
.sb-chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:var(--bg);border-radius:10px;margin-bottom:12px;min-height:60px}
.sb-chip{padding:9px 16px;background:var(--panel);border:2px solid var(--border);border-radius:8px;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;user-select:none}
.sb-chip:hover:not(.used){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.sb-area{min-height:62px;padding:14px;background:var(--paper);border:2px dashed var(--border);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sb-area.filled{border-style:solid;border-color:var(--accent)}
.sb-area .sb-chip{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent-dark);color:#fff}
.sb-area .placeholder{color:var(--ink-soft);font-style:italic;font-size:15px}
.section-head{font-size:15px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin:32px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.section-head.first{margin-top:0}
.sr-hud{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow-md)}
.sr-hud .sr-hud-item{text-align:center}
.sr-hud .sr-hud-item .lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;opacity:.7;text-transform:uppercase;display:block;margin-bottom:2px}
.sr-hud .sr-hud-item .val{font-size:24px;font-weight:800;display:block}
.notes-panel{position:fixed;top:60px;right:0;width:340px;height:calc(100vh - 60px);background:var(--panel);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(0,0,0,.08);padding:22px;transform:translateX(100%);transition:transform .3s;z-index:200;display:flex;flex-direction:column}
.notes-panel.open{transform:translateX(0)}
.notes-panel h3{font-size:18px;margin-bottom:6px;color:var(--ink)}
.notes-panel .sub{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.notes-panel textarea{flex:1;width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-family:'Fira Code',monospace;font-size:15px;line-height:1.55;background:var(--bg);color:var(--ink);resize:none;outline:none}
.notes-panel .close-note{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;color:var(--ink-soft)}
.stage-footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap}
.complete-banner{text-align:center;padding:40px 20px;background:linear-gradient(135deg,rgba(46,158,91,.1),rgba(46,158,91,.03));border:2px dashed var(--success);border-radius:16px;margin-bottom:20px}
.complete-banner .trophy{font-size:64px;margin-bottom:10px}
.complete-banner h3{font-size:26px;color:var(--success);margin-bottom:6px;font-weight:800}
.complete-banner p{font-size:16px;color:var(--ink-soft)}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:999;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media (max-width:900px){.sidebar{width:220px}.dd-area{grid-template-columns:1fr}.notes-panel{width:90vw;max-width:340px}}
@media (max-width:640px){.topbar{height:auto;min-height:60px;padding:8px 12px;gap:7px;flex-wrap:wrap;align-content:center}.logo .text{display:none}.session-input{flex:1 1 145px;justify-content:space-between}.topbar>#scorePill,.topbar>#streakPill{display:none}.spacer{display:none}.icon-btn{width:34px;height:34px}.sidebar{position:fixed;left:-240px;top:92px;height:calc(100vh - 92px);z-index:150;transition:left .3s}.sidebar.open{left:0}.fc-modal-img{font-size:90px}.passage{padding:20px 22px;font-size:17px}}
::selection{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="mark">🎓</div><span class="text">IELTS Studio</span></div>
  <div class="stat-pill" id="syncPill"><span class="sync-dot warn" id="syncDot"></span><span id="syncStatus">Set code</span></div>
  <div class="session-input"><label class="lbl" for="sessionCodeInput">Code:</label>
    <input type="text" id="sessionCodeInput" placeholder="ENTER" maxlength="12" autocapitalize="characters" autocomplete="off" onkeydown="if(event.key==='Enter')changeSessionCode()">
    <button type="button" class="join-code" onclick="changeSessionCode()">Open</button></div>
  <div class="stat-pill" id="timerPill">⏱ <span class="val" id="timerDisplay">00:00</span></div>
  <div class="stat-pill" id="scorePill">🏆 <span class="val" id="scoreDisplay">0</span><span style="opacity:.6;"> / 130</span></div>
  <div class="stat-pill" id="streakPill"><span id="streakDisplay" class="val green">0</span> 🔥</div>
  <div class="spacer"></div>
  <a class="icon-btn" href="dashboard.html" title="Teacher dashboard">🏫</a>
  <button class="icon-btn" id="soundToggle" onclick="toggleSound()" title="Sound">🔊</button>
  <button class="icon-btn" id="darkToggle" onclick="toggleDark()" title="Dark">🌙</button>
  <button class="icon-btn" onclick="toggleNotes()" title="Notes">📝</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header"><span>Your Curriculum</span><span class="pct" id="progressPct">0%</span></div>
    <div class="progress-rail"><div class="progress-rail-fill" id="progressFill"></div></div>
    <div class="stage-list" id="stageList"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<aside class="notes-panel" id="notesPanel">
  <button class="close-note" onclick="toggleNotes()">×</button>
  <h3>📝 My Notes</h3>
  <p class="sub">Jot down words, questions, or your own examples.</p>
  <textarea id="notesArea" placeholder="Type your notes here..."></textarea>
</aside>

<div class="fc-modal-backdrop" id="fcModal" onclick="if(event.target===this)closeFCModal()">
  <div class="fc-modal">
    <button class="fc-modal-close" onclick="closeFCModal()">×</button>
    <div class="fc-modal-img" id="fcModalImg"></div>
    <div class="fc-modal-body">
      <div class="fc-modal-word" id="fcModalWord"></div>
      <div class="fc-reveal-area" id="fcRevealArea"></div>
      <div class="fc-modal-actions">
        <button class="btn success" onclick="fcMarkKnow()">✓ I know it</button>
        <button class="btn ghost" onclick="fcMarkAgain()">↻ Practise again</button>
      </div>
      <div class="fc-modal-tools">
        <button class="tool" onclick="fcSpeak()">🔊 Listen</button>
        <button class="tool" onclick="fcReveal()">👁️ Reveal</button>
      </div>
      <div class="fc-modal-nav">
        <button onclick="fcPrev()">← Previous</button>
        <span class="counter" id="fcCounter">1 / 20</span>
        <button onclick="fcNext()">Next →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================== FIREBASE ================== */
const firebaseConfig={apiKey:"AIzaSyDL3lnUdhKBqAPEoiJjBnpGqU1ol4Fwa7w",authDomain:"sabina-s-workspace.firebaseapp.com",databaseURL:"https://sabina-s-workspace-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sabina-s-workspace",storageBucket:"sabina-s-workspace.firebasestorage.app",messagingSenderId:"64645562064",appId:"1:64645562064:web:2c5b5a37b5ab9a685be8d5"};
let fbApp=null,fbDb=null,sessionRef=null,activityRef=null,commandRef=null,fbConnected=false;
const TEACHER_EMAILS=['alibek.alpysbayev@gmail.com'];
const teacherPreviewRequested=new URLSearchParams(window.location.search).get('teacher')==='1';
let teacherMode=teacherPreviewRequested,teacherCanEdit=false,curriculumCache={};

/* ================== CURRICULUM (11 stages) ================== */
const CURRICULUM=[{year:"2026",months:[{month:"October",lessons:[{id:"lesson_1",title:"Lesson 1: Sustainable Cities — Vocabulary, Reading & Tenses",stages:[
  {id:1,label:'Sustainable Cities Vocabulary',sub:'Cards',icon:'🏙️'},
  {id:2,label:'Word Match',sub:'Drag',icon:'🔗'},
  {id:3,label:'Academic Reading',sub:'Article',icon:'📖'},
  {id:4,label:'Reading Comprehension',sub:'Written answers',icon:'✍️'},
  {id:5,label:'Vocabulary in Context',sub:'From text',icon:'🔎'},
  {id:6,label:'Completing Sentence — Present Perfect',sub:'Grammar',icon:'⏳'},
  {id:7,label:'Completing Sentence — Past Simple',sub:'Grammar',icon:'🕰️'},
  {id:8,label:'Sentence Builder — Present Perfect',sub:'Build',icon:'🧩'},
  {id:9,label:'Sentence Builder — Past Simple',sub:'Build',icon:'🧱'},
  {id:10,label:'Completing Sentence — Choose the Tense',sub:'Mixed',icon:'🧭'},
  {id:11,label:'Lesson 1 — Test Your Knowledge',sub:'Review',icon:'⚡'}
]}]}]}];

/* ================== STATE ================== */
const state={currentYear:"2026",currentMonth:"October",currentLessonId:"lesson_1",currentStage:1,scores:{},done:{},sessionStart:Date.now(),streak:0,lastAction:''};
CURRICULUM.forEach(y=>y.months.forEach(m=>m.lessons.forEach(l=>l.stages.forEach(s=>{const k=l.id+"_"+s.id;state.scores[k]=0;state.done[k]=false})));
function getCurrentLesson(){const y=CURRICULUM.find(x=>x.year===state.currentYear);if(!y)return null;const m=y.months.find(x=>x.month===state.currentMonth);if(!m)return null;return m.lessons.find(l=>l.id===state.currentLessonId)||null}
function totalScore(){const l=getCurrentLesson();if(!l)return 0;return l.stages.reduce((s,st)=>s+(state.scores[l.id+"_"+st.id]||0),0)}

/* ================== FIREBASE INIT ================== */
function initFirebase(){
  try{
    fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.database();
    const lessonId=new URLSearchParams(window.location.search).get('lesson')||localStorage.getItem('nd_current_lesson');
    if(lessonId)fbDb.ref('curriculum/'+lessonId+'/flashcardImages').on('value',s=>{customImages=s.val()||{};renderFlashcards();if(document.getElementById('fcModal').classList.contains('open'))renderFCModal()});
    fbDb.ref('curriculum').on('value',s=>{curriculumCache=s.val()||{};renderSidebar()});
    if(teacherPreviewRequested){
      document.querySelector('.session-input').style.display='none';
      firebase.auth().onAuthStateChanged(function(user){
        teacherCanEdit=!!(user&&TEACHER_EMAILS.includes(String(user.email||'').toLowerCase()));
        teacherMode=teacherCanEdit;
        if(teacherCanEdit){updateSyncUI('teacher');document.getElementById('timerPill').style.display='none';document.getElementById('scorePill').style.display='none';document.getElementById('streakPill').style.display='none';renderStage()}
        else{teacherMode=true;updateSyncUI('error');document.getElementById('main').innerHTML='<div class="card"><h2>Teacher sign-in required</h2></div>'}
      });
      return;
    }
    firebase.auth().onAuthStateChanged(function(user){
      if(!user){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>Please sign in</h2><p style="color:var(--ink-soft);margin-bottom:22px">Open the <a href="portal.html" style="color:var(--accent);font-weight:700">student portal</a> to sign in with Google, then come back.</p></div>';return}
      const code=getSessionCode();
      if(!code){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>No lesson selected</h2><p style="color:var(--ink-soft)">Please open this lesson from your portal.</p></div>';return}
      firebase.database().ref('students/'+code).once('value').then(function(snap){
        const s=snap.val();
        if(!s||s.uid!==user.uid){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>Access denied</h2><p style="color:var(--ink-soft)">Your account is not linked to this student code.</p></div>';return}
        startStudentSession(code);
      });
    });
  }catch(e){console.error(e);updateSyncUI('error')}
}
function startStudentSession(code){
  if(!code){updateSyncUI('nocode');return}
  sessionRef=fbDb.ref('sessions/'+code);
  activityRef=sessionRef.child('activity');
  commandRef=sessionRef.child('command');
  commandRef.on('value',function(snap){const cmd=snap.val();if(!cmd)return;applyTeacherResetCommand(cmd);if(cmd.action==='goto'&&cmd.stage&&cmd.ts>Date.now()-10000)goToStage(cmd.stage)});
  fbConnected=true;updateSyncUI('live');pushFullState();
}
function getSessionCode(){const u=new URLSearchParams(window.location.search).get('code');if(u){if(!teacherPreviewRequested)localStorage.setItem('nd_session_code',u.toUpperCase());return u.toUpperCase()}return (localStorage.getItem('nd_session_code')||'').toUpperCase()}
function changeSessionCode(){const i=document.getElementById('sessionCodeInput');const c=(i.value||'').toUpperCase().trim();if(!c){localStorage.removeItem('nd_session_code');updateSyncUI('nocode');return}localStorage.setItem('nd_session_code',c);if(!fbDb){initFirebase();return}if(sessionRef)sessionRef.off();if(commandRef)commandRef.off();startStudentSession(c)}
function updateSyncUI(s){const d=document.getElementById('syncDot');const t=document.getElementById('syncStatus');d.classList.remove('warn','off');if(s==='live')t.textContent='Live · Connected';else if(s==='teacher')t.textContent='Teacher preview';else if(s==='nocode'){d.classList.add('warn');t.textContent='Set code above'}else if(s==='error'){d.classList.add('off');t.textContent='Error'}}
function applyTeacherResetCommand(cmd){if(!cmd||cmd.action!=='reset'||!cmd.ts)return;const k='nd_teacher_reset_seen_'+getSessionCode();let s=0;try{s=Number(localStorage.getItem(k)||0)}catch(e){}if(Number(cmd.ts)<=s)return;try{localStorage.setItem(k,String(cmd.ts))}catch(e){}teacherReset()}
function teacherReset(){Object.keys(state.scores).forEach(k=>state.scores[k]=0);Object.keys(state.done).forEach(k=>state.done[k]=false);state.currentStage=1;state.streak=0;s1Known={};customImages={};document.getElementById('notesArea').value='';updateHUD();renderSidebar();renderStage();saveState()}

/* ================== AUDIO ================== */
let audioCtx=null,soundOn=true;
function playTone(f,d,t,v){if(!soundOn)return;t=t||'sine';v=v||.12;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sCorrect(){playTone(660,.12);setTimeout(()=>playTone(880,.18),100)}
function sWrong(){playTone(180,.25,'sawtooth',.08)}
function sWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.2),i*110))}
function sFlip(){playTone(500,.08,'sine',.06)}
function sPop(){playTone(700,.06,'sine',.05)}
function confetti(){const colors=['#ee5a24','#ff6b6b','#2a5298','#28a745','#ffd700','#6a3093'];for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.top='-20px';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=Math.random()*.5+'s';c.style.width=(Math.random()*8+6)+'px';c.style.height=(Math.random()*8+6)+'px';if(Math.random()>.5)c.style.borderRadius='50%';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
let ukVoice=null;
function pickUKVoice(){if(!('speechSynthesis' in window))return null;const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en-gb'))||v.find(x=>x.name&&/british|uk|england|daniel|kate|serena|oliver|libby|sonia/i.test(x.name))||null}
if('speechSynthesis' in window){ukVoice=pickUKVoice();window.speechSynthesis.onvoiceschanged=()=>{ukVoice=pickUKVoice()}}
function speak(text){if(!soundOn)return;if(!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;u.pitch=1;if(ukVoice)u.voice=ukVoice;window.speechSynthesis.speak(u)}catch(e){}}

/* ================== SYNC ================== */
const CHANNEL='nd_lesson_live_v3';let bc=null;try{bc=new BroadcastChannel(CHANNEL)}catch(e){}
function broadcast(type,payload){
  if(teacherMode)return;
  if(fbConnected&&sessionRef){try{if(type==='state')sessionRef.child('state').set(Object.assign({},payload,{lastUpdate:Date.now()}));else if(type==='action'){activityRef.push(payload);sessionRef.child('state').update({score:payload.score,stage:payload.stage,lastUpdate:Date.now()})}else if(type==='notes')sessionRef.child('state').update({notes:payload.text})}catch(e){}}
  const msg={type:type,payload:payload,ts:Date.now()};
  if(bc){try{bc.postMessage(msg)}catch(e){}}
}
function pushFullState(){if(teacherMode||!fbConnected||!sessionRef)return;broadcast('state',{stage:state.currentStage,score:totalScore(),streak:state.streak,done:state.done,scores:state.scores,notes:document.getElementById('notesArea').value,elapsed:Math.floor((Date.now()-state.sessionStart)/1000)})}
function broadcastAction(type,detail){state.lastAction=detail;broadcast('action',{stage:state.currentStage,type:type,detail:detail,score:totalScore(),ts:Date.now()})}
function saveState(){if(teacherMode)return;try{localStorage.setItem('nd_state_gaziz_v4',JSON.stringify({currentStage:state.currentStage,scores:state.scores,done:state.done,notes:document.getElementById('notesArea').value,dark:document.documentElement.classList.contains('dark'),soundOn:soundOn}))}catch(e){}broadcast('state',{stage:state.currentStage,score:totalScore(),streak:state.streak,done:state.done,scores:state.scores,notes:document.getElementById('notesArea').value,elapsed:Math.floor((Date.now()-state.sessionStart)/1000)})}
function loadState(){try{const raw=localStorage.getItem('nd_state_gaziz_v4');if(!raw)return;const p=JSON.parse(raw);if(p.currentStage)state.currentStage=p.currentStage;if(p.scores)Object.assign(state.scores,p.scores);if(p.done)Object.assign(state.done,p.done);if(p.notes)document.getElementById('notesArea').value=p.notes;if(p.dark)document.documentElement.classList.add('dark');if(p.soundOn!==undefined)soundOn=p.soundOn}catch(e){}}
let customImages={};

/* ================== HELPERS ================== */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function escapeAttr(s){return escapeHtml(s)}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}

/* ================== TEACHER REVIEW QUEUE ================== */
function flagForReview(qId,prompt,studentAnswer,autoResult,stageId,extra){
  if(teacherMode)return;
  if(!fbConnected||!sessionRef){alert('Cannot send to teacher — no session connected.');return}
  const payload={stage:stageId,questionId:qId,prompt:prompt,studentAnswer:studentAnswer,autoResult:autoResult,ts:Date.now()};
  if(extra)Object.assign(payload,extra);
  sessionRef.child('reviewQueue').push(payload).then(()=>{
    broadcastAction('review_flagged',prompt.substring(0,40));
  }).catch(e=>{alert('Failed to send: '+e.message)});
}

function renderDD(){
  const wEl=document.getElementById('ddWords'),sEl=document.getElementById('ddSlots');if(!wEl||!sEl)return;wEl.innerHTML='';sEl.innerHTML='';

function tryPlace(word,slot){
  if(!word||slot.classList.contains('correct'))return;

  }else{slot.classList.add('wrong');sWrong();setTimeout(()=>slot.classList.remove('wrong'),500);broadcastAction('match_wrong',word+' → '+slot.dataset.answer)}
}

'<p><span class="para-label">B.</span>The idea was not new. As early as 2009, city planners had begun to discuss a bold strategy: to reduce the number of cars in the city centre and to make cycling, walking, and public transport the primary ways of getting around. What made Copenhagen\u2019s plan different was not the goal, but the scale. Rather than gently discouraging drivers, the council made a series of decisions that changed the physical shape of the city. Parking spaces were removed. Whole streets were turned into pedestrian-only zones. A network of elevated cycle paths — the so-called \u201ccycle super-highways\u201d — was built to connect the suburbs with the city centre.</p>'+
'<p><span class="para-label">C.</span>The cycling infrastructure is perhaps the most striking feature of the transformation. Copenhagen now has over 400 kilometres of dedicated cycle lanes, many of them separated from car traffic by curbs or planters. In winter, the snow is cleared from cycle paths before it is cleared from roads. At major intersections, cyclists are given priority with their own traffic lights. Perhaps most importantly, the city made a decision that no other capital had made: it began to measure its success not by how fast cars could move, but by how many people chose to cycle. Today, more than 60 per cent of Copenhagen residents commute to work or school by bike — a figure that would have seemed absurd a generation ago.</p>'+
'<p><span class="para-label">D.</span>The transformation was not limited to transport. The city\u2019s harbour, once an industrial area that residents avoided, has been cleaned and reopened as a public space. Old warehouses have been converted into apartments, restaurants, and cultural centres. A series of new bridges allow pedestrians and cyclists to cross the water easily. In summer, locals swim in the harbour — something that would have been unthinkable in the 1990s, when the water was considered unsafe. The city has also invested heavily in renewable energy, particularly wind power and district heating systems that use waste heat from factories.</p>'+
'<p><span class="para-label">E.</span>Not everyone welcomed the changes. Small business owners in the city centre complained that removing parking spaces had reduced their customers. Some residents in the suburbs argued that the new cycle highways served wealthier neighbourhoods better than poorer ones. Critics noted that the transition had been expensive, and that the council had spent millions on projects that would take decades to pay back. Others pointed out that Copenhagen\u2019s success was possible partly because the city was relatively small and wealthy — conditions that many other cities do not share.</p>'+

function buildFlagRow(qIndex,prompt,answer,autoResult){
  return '<div class="review-btn-row"><button class="btn flag small" onclick="flagForReview(\'s4_'+qIndex+'\',\''+escapeAttr(prompt).substring(0,120)+'\',\''+escapeAttr(answer).substring(0,300)+'\',\''+autoResult+'\',4)">🚩 Flag for teacher review</button><span class="hint">If you believe your answer is correct, click here.</span></div>';
}
function checkLongAnswer(text,keywordGroups,minWords,minGroups){
  const t=norm(text);
  const words=t.split(/\s+/).filter(w=>w.length>0);
  if(words.length<minWords)return{pass:false,reason:'Your answer is too short. Aim for at least '+minWords+' words.',matched:0};
  let matched=0;
  keywordGroups.forEach(g=>{if(g.some(k=>t.indexOf(norm(k))!==-1))matched++});
  if(matched>=minGroups)return{pass:true,matched:matched,total:keywordGroups.length};
  return{pass:false,reason:'You matched '+matched+' of '+keywordGroups.length+' key ideas. Check the passage again and try to include more.',matched:matched};
}

function renderCompletingSentence(data,stageId,prevId,nextId,title,eyebrow,formula,listHTML,lead){
  const main=document.getElementById('main');
  const v=document.createElement('div');v.className='stage-view active';
  v.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2>'+
  '<div class="g-box"><h3>Reminder</h3><div class="g-formula">'+formula+'</div><ul>'+listHTML+'</ul></div>'+
  '<div class="lead">'+lead+'</div>'+
  '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;color:var(--ink-soft)">Score: <span id="p'+stageId+'live" style="color:var(--accent);font-size:18px">0</span> / '+(data.pos.length+data.neg.length+data.q.length+data.shuffled.length)+'</div><button class="btn ghost small" onclick="resetGrammarStage('+stageId+')">↻ Reset</button></div>'+
  '<div id="p'+stageId+'body"></div>';
  main.appendChild(v);main.appendChild(stageFooter(prevId,nextId));
  let score=0;const body=document.getElementById('p'+stageId+'body');
  function addSection(heading,items,startNum){
    if(heading){const h=document.createElement('div');h.className='section-head';h.textContent=heading;body.appendChild(h)}
    items.forEach((item,i)=>{
      const card=document.createElement('div');card.className='q-card';
      card.innerHTML='<div class="q-num">Question '+(startNum+i)+'</div><div class="q-prompt">'+escapeHtml(item.p).replace('___','<b style="color:var(--accent)">___</b>')+'</div>';
      const row=document.createElement('div');row.className='q-input-row';
      const inp=document.createElement('input');inp.type='text';inp.className='q-input';inp.placeholder='Type the missing word(s)...';inp.autocomplete='off';inp.spellcheck=false;
      const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check';
      const fb=document.createElement('div');fb.className='q-feedback';
      let answered=false;
      function submit(){
        if(answered)return;
        const val=norm(inp.value);
        const ans=norm(item.a);
        if(val===ans){
          inp.classList.add('correct');inp.disabled=true;btn.disabled=true;answered=true;
          fb.className='q-feedback correct';fb.innerHTML='✓ Correct!'+(item.ex?'<span class="exp">'+item.ex+'</span>':'');
          sCorrect();score++;document.getElementById('p'+stageId+'live').textContent=score;
          const total=data.pos.length+data.neg.length+data.q.length+data.shuffled.length;
          setScore(stageId,Math.floor(score*10/total));
          if(score===total){setScore(stageId,10);markDone(stageId)}
          broadcastAction('answer_correct',item.p.substring(0,40)+' → '+item.a);
        }else{
          inp.classList.add('wrong');sWrong();
          fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite. Try again!';
          setTimeout(()=>inp.classList.remove('wrong'),600);
          broadcastAction('answer_wrong','"'+inp.value+'"');
        }
      }
      btn.onclick=submit;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
      inp.addEventListener('input',()=>broadcastAction('typing',item.p.substring(0,30)+' | "'+inp.value+'"'));
      row.appendChild(inp);row.appendChild(btn);
      card.appendChild(row);card.appendChild(fb);body.appendChild(card);
    });
  }
  addSection('Part 1 — Positive sentences',data.pos,1);
  addSection('Part 2 — Negative sentences',data.neg,data.pos.length+1);

  addSection('Part 4 — Mixed practice (shuffled)',shuffle(data.shuffled),data.pos.length+data.neg.length+data.q.length+1);
}

  v.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2>'+
  '<div class="g-box"><h3>Reminder</h3><div class="g-formula">'+formula+'</div><ul>'+listHTML+'</ul></div>'+
  '<div class="lead">'+lead+'</div>'+
  '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;color:var(--ink-soft)">Score: <span id="sb'+stageId+'live" style="color:var(--accent);font-size:18px">0</span> / '+(data.pos.length+data.neg.length+data.q.length+data.shuffled.length)+'</div><button class="btn ghost small" onclick="resetGrammarStage('+stageId+')">↻ Reset</button></div>'+

  function addSection(heading,items,startNum){
    if(heading){const h=document.createElement('div');h.className='section-head';h.textContent=heading;body.appendChild(h)}
    items.forEach((item,i)=>{
      const card=document.createElement('div');card.className='q-card';

      '<div class="sb-chips" id="sbChips'+stageId+'_'+idx+'"></div>'+
      '<div class="sb-area" id="sbArea'+stageId+'_'+idx+'"><span class="placeholder">Click the words below...</span></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" onclick="checkSBItem('+stageId+','+idx+')">✓ Check</button><button class="btn ghost small" onclick="resetSBItem('+stageId+','+idx+')">↻ Reset</button></div>'+
      '<div class="q-feedback" id="sbFb'+stageId+'_'+idx+'"></div>';
      body.appendChild(card);
      const chipsEl=document.getElementById('sbChips'+stageId+'_'+idx);
      const scrambled=shuffle(item.correct.map((w,i)=>({w:w,i:i})));
      scrambled.forEach(({w,i})=>{const chip=document.createElement('div');chip.className='sb-chip';chip.textContent=w;chip.dataset.origIndex=i;chip.onclick=function(){moveChip(stageId,idx,chip,w,i)};chipsEl.appendChild(chip)});
      SB_STATE[stageId+'_'+idx]=[];
    });
  }
  addSection('Part 1 — Positive sentences',data.pos,1);
  addSection('Part 2 — Negative sentences',data.neg,data.pos.length+1);
  addSection('Part 3 — Questions',data.q,data.pos.length+data.neg.length+1);
  addSection('Part 4 — Mixed practice (shuffled)',shuffle(data.shuffled),data.pos.length+data.neg.length+data.q.length+1);
  // store for checker
  SB_DATA[stageId]={pos:data.pos,neg:data.neg,q:data.q,shuffled:data.shuffled};

const SB_STATE={};
const SB_DATA={};
function moveChip(stageId,idx,chip,word,origIdx){
  const area=document.getElementById('sbArea'+stageId+'_'+idx);const ph=area.querySelector('.placeholder');if(ph)ph.remove();
  const newChip=document.createElement('div');newChip.className='sb-chip';newChip.textContent=word;newChip.dataset.origIndex=origIdx;
  newChip.onclick=function(){
    newChip.remove();
    const chipsEl=document.getElementById('sbChips'+stageId+'_'+idx);
    const back=document.createElement('div');back.className='sb-chip';back.textContent=word;back.dataset.origIndex=origIdx;
    back.onclick=function(){moveChip(stageId,idx,back,word,origIdx)};
    chipsEl.appendChild(back);
    SB_STATE[stageId+'_'+idx]=(SB_STATE[stageId+'_'+idx]||[]).filter(x=>x!==origIdx);
    if(!area.querySelector('.sb-chip')){area.innerHTML='<span class="placeholder">Click the words below...</span>';area.classList.remove('filled')}
  };
  area.appendChild(newChip);area.classList.add('filled');chip.remove();sPop();
  if(!SB_STATE[stageId+'_'+idx])SB_STATE[stageId+'_'+idx]=[];
  SB_STATE[stageId+'_'+idx].push(origIdx);
}
function resetSBItem(stageId,idx){
  const area=document.getElementById('sbArea'+stageId+'_'+idx);const chipsEl=document.getElementById('sbChips'+stageId+'_'+idx);
  area.querySelectorAll('.sb-chip').forEach(ch=>{
    const back=document.createElement('div');back.className='sb-chip';back.textContent=ch.textContent;back.dataset.origIndex=ch.dataset.origIndex;
    back.onclick=function(){moveChip(stageId,idx,back,ch.textContent,Number(ch.dataset.origIndex))};
    chipsEl.appendChild(back);
  });
  area.innerHTML='<span class="placeholder">Click the words below...</span>';
  area.classList.remove('filled');
  SB_STATE[stageId+'_'+idx]=[];
  document.getElementById('sbFb'+stageId+'_'+idx).className='q-feedback';
}
function checkSBItem(stageId,idx){
  const area=document.getElementById('sbArea'+stageId+'_'+idx);
  const userOrder=Array.from(area.querySelectorAll('.sb-chip')).map(c=>Number(c.dataset.origIndex));
  const fb=document.getElementById('sbFb'+stageId+'_'+idx);
  // find the question
  let item=null;
  const all=(SB_DATA[stageId].pos||[]).concat(SB_DATA[stageId].neg||[]).concat(SB_DATA[stageId].q||[]).concat(SB_DATA[stageId].shuffled||[]);
  // We don't know which item this is reliably; use total length check
  const correctLen=userOrder.length; // we'll compare with the correct order at the moment of check via stored indices
  // Simpler approach: reconstruct from SB_STATE — no, use area chips
  // Actually, we stored indices as original positions; a fully-correct answer is 0,1,2,3...
  const expected=Array.from({length:userOrder.length},(_,i)=>i);
  if(userOrder.length!==expected.length){fb.className='q-feedback wrong';fb.innerHTML='Use all the words.';sWrong();return}
  const ok=userOrder.every((v,i)=>v===i);
  if(ok){
    fb.className='q-feedback correct';fb.innerHTML='✓ Correct!';sCorrect();
    if(!window['sbDone_'+stageId+'_'+idx]){
      window['sbDone_'+stageId+'_'+idx]=true;
      const el=document.getElementById('sb'+stageId+'live');
      let cur=Number(el.textContent)||0;cur++;el.textContent=cur;
      const tot=(SB_DATA[stageId].pos.length+SB_DATA[stageId].neg.length+SB_DATA[stageId].q.length+SB_DATA[stageId].shuffled.length);
      setScore(stageId,Math.floor(cur*10/tot));
      if(cur===tot){setScore(stageId,10);markDone(stageId)}
    }
  }else{fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite. Check the word order.';sWrong()}
}

    qnum++;
    const card=document.createElement('div');card.className='q-card';
    card.innerHTML='<div class="q-num">Question '+qnum+'</div><div class="q-prompt">'+escapeHtml(item.q)+'</div>';
    const opts=document.createElement('div');opts.className='tfng-opts';
    shuffle(['True','False','Not Given']).forEach(o=>{
      const b=document.createElement('button');b.className='q-opt';b.textContent=o;
      b.onclick=()=>{
        if(b.disabled)return;opts.querySelectorAll('button').forEach(x=>x.disabled=true);
        const fb=card.querySelector('.q-feedback');
        if(o===item.answer){b.classList.add('correct');sCorrect();fb.className='q-feedback correct';fb.innerHTML='✓ Correct!<span class="exp">'+item.exp+'</span>';t11Answers['t'+i]=true}
        else{b.classList.add('wrong');opts.querySelectorAll('button').forEach(x=>{if(x.textContent===item.answer)x.classList.add('correct')});sWrong();fb.className='q-feedback wrong';fb.innerHTML='✗ '+item.exp}
        checkT11();
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
    const fb=document.createElement('div');fb.className='q-feedback';card.appendChild(fb);
    body.appendChild(card);
  });
  // Long answer section
  body.insertAdjacentHTML('beforeend','<div class="section-head">Part 4 — Long answers</div>');
  TEST_LONG.forEach((item,i)=>{
    qnum++;
    const card=document.createElement('div');card.className='q-card';
    card.innerHTML='<div class="q-num">Question '+qnum+'</div><div class="q-prompt">'+escapeHtml(item.q)+'</div>';
    const ta=document.createElement('textarea');ta.className='q-textarea';ta.placeholder='Write your answer in full sentences...';
    const row=document.createElement('div');row.className='q-input-row';row.style.marginTop='10px';
    const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check my answer';
    const fb=document.createElement('div');fb.className='q-feedback';
    let done=false;
    function submit(){
      if(done)return;const txt=ta.value.trim();
      const res=checkLongAnswer(txt,item.keywordGroups,item.minWords,item.minGroups);
      if(res.pass){ta.classList.add('correct');ta.disabled=true;btn.disabled=true;done=true;fb.className='q-feedback correct';fb.innerHTML='✓ Looks correct! You matched '+res.matched+' key ideas.';sCorrect();t11Answers['l'+i]=true;checkT11()}
      else{ta.classList.add('wrong');sWrong();fb.className='q-feedback wrong';fb.innerHTML='✗ '+res.reason+'<span class="sample"><b>Sample answer:</b> '+escapeHtml(item.sample)+'</span>'}
      ta.insertAdjacentHTML('afterend',buildFlagRow('t11_'+i,item.q,txt,res.pass?'correct':'wrong'));
    }
    btn.onclick=submit;
    row.appendChild(btn);card.appendChild(ta);card.appendChild(row);card.appendChild(fb);body.appendChild(card);
  });
  // Completing sentences
  body.insertAdjacentHTML('beforeend','<div class="section-head">Part 5 — Complete the sentences</div>');
  TEST_COMPLETE.forEach((item,i)=>{
    qnum++;
    const card=document.createElement('div');card.className='q-card';
    card.innerHTML='<div class="q-num">Question '+qnum+'</div><div class="q-prompt">'+escapeHtml(item.p).replace('___','<b style="color:var(--accent)">___</b>')+'</div>';
    const row=document.createElement('div');row.className='q-input-row';
    const inp=document.createElement('input');inp.type='text';inp.className='q-input';inp.placeholder='Type the missing word(s)...';
    const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check';
    const fb=document.createElement('div');fb.className='q-feedback';
    let done=false;
    function submit(){
      if(done)return;const v=norm(inp.value);
      if(v===norm(item.a)){inp.classList.add('correct');inp.disabled=true;btn.disabled=true;done=true;fb.className='q-feedback correct';fb.innerHTML='✓ Correct!';sCorrect();t11Answers['c'+i]=true;checkT11()}
      else{inp.classList.add('wrong');sWrong();fb.className='q-feedback wrong';fb.innerHTML='✗ Try again.';setTimeout(()=>inp.classList.remove('wrong'),600)}
    }
    btn.onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    row.appendChild(inp);row.appendChild(btn);card.appendChild(row);card.appendChild(fb);body.appendChild(card);
  });
}
function checkT11(){
  const total=TEST_MCQ.length+TEST_SHORT.length+TEST_TFNG.length+TEST_LONG.length+TEST_COMPLETE.length;
  const c=Object.keys(t11Answers).length;
  if(c===total){setScore(11,20);markDone(11)}else{setScore(11,Math.floor(c*20/total))}
}

/* ================== HUD ================== */
function updateHUD(){
  const el=document.getElementById('scoreDisplay');
  el.textContent=totalScore();
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  document.getElementById('streakDisplay').textContent=state.streak;
  const lesson=getCurrentLesson();if(!lesson)return;
  const doneCount=lesson.stages.filter(s=>state.done[lesson.id+"_"+s.id]).length;
  const pct=Math.round((doneCount/lesson.stages.length)*100);
  document.getElementById('progressPct').textContent=pct+'%';
  document.getElementById('progressFill').style.width=pct+'%';
}
function markDone(stageId){
  const key=state.currentLessonId+"_"+stageId;
  if(state.done[key])return;
  state.done[key]=true;
  sWin();confetti();renderSidebar();updateHUD();saveState();
  broadcastAction('stage_complete','Stage '+stageId+' complete!');
}
function setScore(stageId,amount){
  const key=state.currentLessonId+"_"+stageId;
  state.scores[key]=amount;
  updateHUD();saveState();
}

/* ================== SIDEBAR ================== */
let expandedYears=["2026"],expandedMonths=["October"];
function renderSidebar(){
  const list=document.getElementById('stageList');list.innerHTML='';
  CURRICULUM.forEach(yearObj=>{
    const isY=expandedYears.includes(yearObj.year);
    const yearEl=document.createElement('div');yearEl.className='year-item'+(isY?' open':'');
    yearEl.innerHTML='<span>📅 '+yearObj.year+'</span><span class="arrow">▶</span>';
    yearEl.onclick=()=>{if(isY)expandedYears=expandedYears.filter(y=>y!==yearObj.year);else expandedYears.push(yearObj.year);renderSidebar()};
    list.appendChild(yearEl);
    if(isY)yearObj.months.forEach(m=>{
      const isM=expandedMonths.includes(m.month);
      const mEl=document.createElement('div');mEl.className='month-item'+(isM?' open':'');
      mEl.innerHTML='<span>📁 '+m.month+'</span><span class="arrow">▶</span>';
      mEl.onclick=()=>{if(isM)expandedMonths=expandedMonths.filter(x=>x!==m.month);else expandedMonths.push(m.month);renderSidebar()};
      list.appendChild(mEl);
      if(isM)m.lessons.forEach(lesson=>{
        const isActive=lesson.id===state.currentLessonId;
        const lEl=document.createElement('div');lEl.className='lesson-item'+(isActive?' active':'');
        lEl.innerHTML='<span>📘 '+lesson.title+'</span>';
        lEl.onclick=()=>{state.currentLessonId=lesson.id;state.currentStage=1;renderSidebar();renderStage()};
        list.appendChild(lEl);
        if(isActive){
          const studentCode=getSessionCode();
          const assignedHW=Object.keys(curriculumCache||{}).map(id=>curriculumCache[id]).filter(it=>it&&it.homework&&it.published!==false&&(!Array.isArray(it.assignedTo)||!it.assignedTo.length||it.assignedTo.indexOf(studentCode)!==-1));
          if(assignedHW.length){
            const hwList=document.createElement('div');hwList.className='homework-sub-list';
            hwList.innerHTML='<div class="homework-sub-label">Homework</div>'+assignedHW.map(it=>{
              const id=it.id||Object.keys(curriculumCache).find(k=>curriculumCache[k]===it);
              const url=new URL(it.customUrl||'homework.html',window.location.href);
              url.searchParams.set('lesson',id);if(studentCode)url.searchParams.set('code',studentCode);
              return '<a class="homework-sub-item" href="'+escapeAttr(url.href)+'">📝 '+escapeHtml(it.title||'Homework')+' ↗</a>';
            }).join('');
            hwList.addEventListener('click',e=>e.stopPropagation());
            list.appendChild(hwList);
          }
          const sub=document.createElement('div');sub.className='stage-sub-list';
          lesson.stages.forEach(st=>{
            const key=lesson.id+"_"+st.id;
            const isA=st.id===state.currentStage;const isD=state.done[key];
            const stEl=document.createElement('button');
            stEl.className='stage-sub-item'+(isA?' active':'')+(isD?' done':'');
            stEl.innerHTML='<span class="icon">'+st.icon+'</span> <span>'+st.label+'</span>';
            stEl.onclick=()=>goToStage(st.id);
            sub.appendChild(stEl);
          });
          list.appendChild(sub);
        }
      });
    });
  });
}
function goToStage(n){state.currentStage=n;renderSidebar();renderStage();document.getElementById('main').scrollTo({top:0,behavior:'smooth'});broadcastAction('stage_open','Stage '+n)}
function renderStage(){
  const main=document.getElementById('main');main.innerHTML='';
  const fns={1:renderStage1,2:renderStage2,3:renderStage3,4:renderStage4,5:renderStage5,6:renderStage6,7:renderStage7,8:renderStage8,9:renderStage9,10:renderStage10,11:renderStage11};
  try{fns[state.currentStage]()}catch(e){console.error(e);main.innerHTML='<p>Error loading stage.</p>'}
}
function stageFooter(prevId,nextId,extraHTML){
  const f=document.createElement('div');f.className='stage-footer';let html='';
  if(prevId)html+='<button class="btn ghost" onclick="goToStage('+prevId+')">← Previous</button>';else html+='<span></span>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'+(extraHTML||'')+'</div>';
  if(nextId)html+='<button class="btn" onclick="goToStage('+nextId+')">Next →</button>';else html+='<span></span>';
  f.innerHTML=html;return f;
}
function startTimer(){
  setInterval(()=>{
    const elapsed=Math.floor((Date.now()-state.sessionStart)/1000);
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    const el=document.getElementById('timerDisplay');if(el)el.textContent=m+':'+s;
  },1000);
}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').classList.toggle('active',soundOn);document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';saveState()}
function toggleDark(){document.documentElement.classList.toggle('dark');document.getElementById('darkToggle').classList.toggle('active',document.documentElement.classList.contains('dark'));saveState()}
function toggleNotes(){document.getElementById('notesPanel').classList.toggle('open')}
document.getElementById('notesArea').addEventListener('input',function(){saveState();broadcast('notes',{text:this.value})});
function showToast(text){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:white;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center';document.body.appendChild(t)}
  t.textContent=text;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)'},2200);
}

/* ================== INIT ================== */
if(!teacherPreviewRequested)loadState();
const lessonFromUrl=new URLSearchParams(window.location.search).get('lesson');
if(lessonFromUrl){state.currentLessonId=lessonFromUrl;if(!teacherPreviewRequested)localStorage.setItem('nd_current_lesson',lessonFromUrl)}
const savedCode=teacherPreviewRequested?'':getSessionCode();
if(savedCode)document.getElementById('sessionCodeInput').value=savedCode;
renderSidebar();renderStage();startTimer();updateHUD();
if(soundOn)document.getElementById('soundToggle').classList.add('active');
if(document.documentElement.classList.contains('dark'))document.getElementById('darkToggle').classList.add('active');
initFirebase();
(function(){
  const code=getSessionCode();
  if(!code||!fbDb)return;
  fbDb.ref('students/'+code+'/name').once('value',function(snap){
    const name=snap.val();if(!name)return;
    const logo=document.querySelector('.logo .text');if(logo)logo.textContent=name;
    document.title=name+' — IELTS Studio';
  });
})();
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeFCModal();
  const modal=document.getElementById('fcModal');
  if(modal.classList.contains('open')){
    if(e.key==='ArrowRight')fcNext();
    if(e.key==='ArrowLeft')fcPrev();
    if(e.key===' '){e.preventDefault();fcReveal()}
  }
});
setInterval(()=>{if(fbConnected)pushFullState()},5000);
setTimeout(pushFullState,800);
</script>
