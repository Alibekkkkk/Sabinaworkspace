<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaziz — Sustainable Cities: Vocabulary & Tenses</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--paper:#fffdf7;--ink:#2c3e50;--ink-soft:#6c757d;--primary:#2a5298;--primary-dark:#1e3c72;--accent:#ee5a24;--accent-dark:#d94a15;--success:#2e9e5b;--success-soft:#d4edda;--error:#dc3545;--error-soft:#f8d7da;--warn:#ff9800;--border:#e0dbd0;--shadow-sm:0 2px 6px rgba(0,0,0,.06);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.15)}
html.dark{--bg:#1a1d24;--panel:#232832;--paper:#1e222a;--ink:#e8e8ea;--ink-soft:#a0a6b0;--primary:#5b8dd9;--primary-dark:#2a5298;--accent:#ff8a5b;--accent-dark:#ee5a24;--success:#4caf7d;--success-soft:#1e3a2a;--error:#ef5468;--error-soft:#3a1e22;--border:#333944}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'EB Garamond','Times New Roman',serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap}
.logo .mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(238,90,36,.35)}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--bg);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.stat-pill .val{color:var(--accent);font-size:16px}
.stat-pill .val.green{color:var(--success)}
.stat-pill .val.bump{animation:bump .5s}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-soft);transition:all .15s;position:relative}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:4px;animation:syncPulse 2s ease-in-out infinite}
.sync-dot.warn{background:var(--warn);animation:none}
.sync-dot.off{background:var(--error);animation:none}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.session-input{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700}
.session-input input{border:none;background:transparent;font-family:'Fira Code','Courier New',monospace;font-size:13px;font-weight:800;color:var(--accent);outline:none;width:90px;text-transform:uppercase;letter-spacing:.5px}
.session-input input::placeholder{color:var(--ink-soft);font-weight:600;text-transform:none;letter-spacing:0}
.session-input .join-code{border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:11px;font-family:inherit;font-weight:700;padding:5px 9px;cursor:pointer}
.session-input .lbl{color:var(--ink-soft);font-weight:600}
.layout{flex:1;display:flex;overflow:hidden}
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;flex-shrink:0}
.sidebar-header{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;padding:0 10px 10px;display:flex;justify-content:space-between;align-items:center}
.sidebar-header .pct{color:var(--accent);font-size:14px}
.progress-rail{height:6px;background:var(--bg);border-radius:6px;margin:0 10px 18px;overflow:hidden}
.progress-rail-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));width:0%;transition:width .5s ease;border-radius:6px}
.stage-list{display:flex;flex-direction:column;gap:2px}
.year-item{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;transition:all .15s;background:var(--bg);margin-top:4px}
.year-item:hover{color:var(--accent)}
.year-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.year-item.open .arrow{transform:rotate(90deg)}
.month-item{padding:8px 12px 8px 28px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:8px;border-radius:8px;transition:all .15s}
.month-item:hover{background:var(--bg);color:var(--ink)}
.month-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.month-item.open .arrow{transform:rotate(90deg)}
.lesson-item{padding:8px 12px 8px 44px;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-soft);border-radius:8px;transition:all .15s;display:flex;align-items:center;gap:8px}
.lesson-item:hover{background:var(--bg);color:var(--ink)}
.lesson-item.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 4px 12px rgba(238,90,36,.3)}
.lesson-item.done{color:var(--success)}
.lesson-item.active.done{color:#fff}
.lesson-item .check{margin-left:auto;font-size:14px;opacity:0}
.lesson-item.done .check{opacity:1}
.stage-sub-list{display:flex;flex-direction:column;gap:2px;padding-left:8px;margin-bottom:8px;border-left:2px solid var(--border);margin-left:22px}
.stage-sub-item{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);transition:all .15s;display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;width:100%;font-family:inherit}
.stage-sub-item:hover{background:var(--bg);color:var(--ink)}
.stage-sub-item.active{background:var(--bg);color:var(--accent);font-weight:800}
.stage-sub-item.done{color:var(--success)}
.stage-sub-item .icon{font-size:15px}
.homework-sub-list{margin:2px 0 8px 30px;padding:7px 8px 7px 12px;border-left:2px solid var(--accent);background:rgba(255,138,91,.07);border-radius:0 9px 9px 0}
.homework-sub-label{font:11px 'Fira Code',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:2px 6px 5px}
.homework-sub-item{display:block;padding:6px;color:var(--ink-soft);font-size:14px;text-decoration:none;border-radius:7px}.homework-sub-item:hover{background:var(--bg);color:var(--accent)}
.reading-split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(310px,.8fr);gap:16px;align-items:start}
.reading-pane,.reading-questions{min-width:0}.reading-pane{position:sticky;top:8px;max-height:calc(100vh - 100px);overflow:auto}
.stage-view:has(.reading-split){max-width:1300px}
.reading-pane .passage{font-size:22px;line-height:1.9;padding:30px 34px}.reading-questions .q-card{margin-bottom:12px}.reading-questions .reading-question-controls{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
@media(max-width:900px){.reading-split{grid-template-columns:1fr}.reading-pane{position:static;max-height:none}.reading-pane .passage{font-size:20px;padding:22px}}
.main{flex:1;overflow-y:auto;padding:30px 40px 40px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.stage-view{display:none;animation:fadeSlide .4s ease;max-width:900px;margin:0 auto}
.stage-view.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stage-view h2{font-size:32px;color:var(--ink);margin-bottom:6px;font-weight:800}
.stage-view .eyebrow{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.stage-view .lead{font-size:17px;color:var(--ink-soft);line-height:1.65;margin-bottom:22px;padding:14px 18px;background:var(--panel);border-left:4px solid var(--primary);border-radius:10px}
.stage-view .lead .ru{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-style:italic;font-size:15px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 3px 0 var(--accent-dark)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--accent-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--border);box-shadow:0 2px 0 var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.success{background:var(--success);box-shadow:0 3px 0 #1e7e34}
.btn.small{padding:7px 14px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.flash-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:14px 18px;background:var(--panel);border-radius:12px;border:1px solid var(--border)}
.flash-toolbar .filt{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.flash-toolbar .filt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flash-stats{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink-soft)}
.flash-stats b{color:var(--success)}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.flashcard{background:var(--panel);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;aspect-ratio:1/1.05;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.flashcard:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 28px rgba(238,90,36,.18)}
.flashcard.known{border-color:var(--success)}
.flashcard.known::before{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--success);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;z-index:4;box-shadow:0 3px 8px rgba(46,158,91,.4)}
.flashcard-img{flex:1;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,rgba(42,82,152,.06),rgba(238,90,36,.06));position:relative;overflow:hidden;min-height:100px}
.flashcard-img img{width:100%;height:100%;object-fit:cover}
.flashcard-word{padding:10px 8px;text-align:center;font-size:16px;font-weight:800;color:var(--ink);border-top:1px solid var(--border);background:var(--panel)}
.fc-modal-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.fc-modal-backdrop.open{display:flex}
.fc-modal{background:var(--panel);border-radius:22px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative}
.fc-modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.08);border:none;cursor:pointer;font-size:20px;color:var(--ink);z-index:10}
.fc-modal-img{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:180px;background:linear-gradient(135deg,#e8eef8,#f8eee8);border-radius:22px 22px 0 0;position:relative;overflow:hidden}
html.dark .fc-modal-img{background:linear-gradient(135deg,#2a3142,#3a2e28)}
.fc-modal-img img{width:100%;height:100%;object-fit:contain;padding:20px}
.fc-modal-img .label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--ink);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.fc-modal-body{padding:24px 28px 28px;text-align:center}
.fc-modal-word{font-size:36px;font-weight:800;color:var(--primary);margin-bottom:6px}
.fc-modal-translation{font-size:20px;color:var(--accent);font-weight:700;margin-bottom:20px;min-height:26px;transition:opacity .3s}
.fc-modal-translation.hidden{opacity:0}
.fc-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fc-modal-actions .btn{min-width:130px;justify-content:center}
.fc-modal-tools{display:flex;gap:8px;justify-content:center;margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);flex-wrap:wrap}
.fc-modal-tools .tool{padding:8px 14px;font-size:14px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink-soft)}
.fc-modal-tools .tool:hover{border-color:var(--accent);color:var(--accent)}
.fc-modal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.fc-modal-nav button{background:transparent;border:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);padding:8px 14px;border-radius:8px;font-family:inherit}
.fc-modal-nav .counter{font-size:14px;color:var(--ink-soft);font-weight:700}
.dd-area{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dd-col-title{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:2px dashed var(--border)}
.dd-words,.dd-slots{display:flex;flex-direction:column;gap:10px}
.dd-word{padding:12px 16px;background:var(--panel);border:2px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;color:var(--ink);cursor:grab;user-select:none;display:flex;align-items:center;gap:10px}
.dd-word:hover:not(.used){border-color:var(--accent);transform:translateX(3px)}
.dd-word.used{opacity:.25;cursor:default;pointer-events:none}
.dd-word::before{content:'⠿';color:var(--ink-soft);font-size:17px;letter-spacing:-2px}
.dd-slot{min-height:52px;padding:12px 16px;background:var(--bg);border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink-soft)}
.dd-slot.over{border-color:var(--accent);background:rgba(238,90,36,.08)}
.dd-slot.correct{background:var(--success-soft);border:2px solid var(--success);color:var(--success)}
.dd-slot.wrong{background:var(--error-soft);border:2px solid var(--error);animation:shake .4s}
.dd-slot .slot-label{flex:1}
.dd-slot .dropped-word{padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;font-size:14px}
.dd-slot .dropped-word.ok{background:var(--success)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.passage{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:28px 32px;font-size:18px;line-height:1.85;color:var(--ink);box-shadow:var(--shadow-sm);font-family:'EB Garamond','Times New Roman',serif}
.passage h3{color:var(--accent);font-size:22px;font-family:'EB Garamond','Times New Roman',serif;font-weight:800;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.passage h3:first-child{margin-top:0}
.passage p{margin-bottom:14px}
.v-word{background:rgba(238,90,36,.12);color:var(--accent-dark);font-weight:700;cursor:pointer;padding:1px 5px;border-radius:5px;border-bottom:2px dotted var(--accent);font-family:'EB Garamond','Times New Roman',serif}
.v-word:hover{background:var(--accent);color:#fff}
.v-word.learned{background:var(--success-soft);color:var(--success);border-bottom-color:var(--success)}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.q-num{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.q-prompt{font-size:18px;line-height:1.6;color:var(--ink);font-weight:600;margin-bottom:14px}
.q-prompt .bracket{display:inline-block;font-size:14px;color:var(--accent);background:rgba(238,90,36,.1);padding:2px 8px;border-radius:6px;font-weight:700;margin-left:4px}
.q-opts{display:flex;gap:10px;flex-wrap:wrap}
.q-opt{padding:11px 20px;background:var(--bg);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.q-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.q-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);animation:shake .4s}
.q-input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q-input{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:17px;font-weight:700;color:var(--ink);background:var(--bg);outline:none}
.q-input:focus{border-color:var(--accent);background:var(--panel)}
.q-input.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.q-input.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);animation:shake .4s}
.q-feedback{margin-top:12px;padding:11px 16px;border-radius:10px;font-size:16px;font-weight:600;display:none}
.q-feedback.correct{background:var(--success-soft);color:var(--success);display:block;border-left:4px solid var(--success)}
.q-feedback.wrong{background:var(--error-soft);color:var(--error);display:block;border-left:4px solid var(--error)}
.q-feedback .exp{display:block;font-weight:500;font-size:15px;color:var(--ink-soft);margin-top:6px}
.g-box{background:linear-gradient(135deg,rgba(46,158,91,.08),rgba(46,158,91,.03));border:1px solid rgba(46,158,91,.35);border-radius:14px;padding:20px 24px;margin-bottom:22px}
.g-box h3{color:var(--success);font-size:20px;margin-bottom:12px;font-weight:800}
.g-formula{background:var(--panel);padding:14px 18px;border-radius:10px;margin:10px 0;font-family:'Fira Code','Courier New',monospace;font-size:15px;font-weight:700;color:var(--success);border-left:4px solid var(--success)}
.g-box ul{margin-left:22px;margin-top:8px}
.g-box li{font-size:16px;line-height:1.7;margin-bottom:4px;color:var(--ink)}
.ru-note{display:block;margin-top:14px;padding:12px 16px;background:rgba(255,152,0,.1);border-left:4px solid var(--warn);border-radius:8px;font-size:15px;color:var(--ink);line-height:1.6;font-style:italic}
.ru-note b{color:var(--accent);font-style:normal}
.sb-chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:var(--bg);border-radius:10px;margin-bottom:12px;min-height:60px}
.sb-chip{padding:9px 16px;background:var(--panel);border:2px solid var(--border);border-radius:8px;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;user-select:none}
.sb-chip:hover:not(.used){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.sb-area{min-height:62px;padding:14px;background:var(--paper);border:2px dashed var(--border);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sb-area.filled{border-style:solid;border-color:var(--accent)}
.sb-area .sb-chip{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent-dark);color:#fff}
.sb-area .placeholder{color:var(--ink-soft);font-style:italic;font-size:15px}
.sr-hud{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow-md)}
.sr-hud .sr-hud-item{text-align:center}
.sr-hud .sr-hud-item .lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;opacity:.7;text-transform:uppercase;display:block;margin-bottom:2px}
.sr-hud .sr-hud-item .val{font-size:24px;font-weight:800;display:block}

function startStudentSession(code){
    if(!code){updateSyncUI('nocode');return;}
    sessionRef=fbDb.ref('sessions/'+code);

function getSessionCode(){

}
function changeSessionCode(){
  const input=document.getElementById('sessionCodeInput');
  const code=(input.value||'').toUpperCase().trim();
  if(!code){localStorage.removeItem('nd_session_code');updateSyncUI('nocode');return}
  localStorage.setItem('nd_session_code',code);
  if(!fbDb){initFirebase();return}
  if(sessionRef)sessionRef.off();
  if(commandRef)commandRef.off();
  sessionRef=fbDb.ref('sessions/'+code);
  activityRef=sessionRef.child('activity');
  commandRef=sessionRef.child('command');
  commandRef.on('value',function(snap){
    const cmd=snap.val();if(!cmd)return;
    applyTeacherResetCommand(cmd);
    if(cmd.action==='goto'&&cmd.stage&&cmd.ts>Date.now()-10000)goToStage(cmd.stage);
  });
  fbConnected=true;updateSyncUI('live');pushFullState();
}
function updateSyncUI(status){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncStatus');
  dot.classList.remove('warn','off');
  if(status==='live'){txt.textContent='Live · Connected'}

  else if(status==='error'){dot.classList.add('off');txt.textContent='Error'}
}
function applyTeacherResetCommand(cmd){
  if(!cmd||cmd.action!=='reset'||!cmd.ts)return;
  const key='nd_teacher_reset_seen_'+getSessionCode();
  let seen=0;try{seen=Number(localStorage.getItem(key)||0)}catch(e){}
  if(Number(cmd.ts)<=seen)return;
  try{localStorage.setItem(key,String(cmd.ts))}catch(e){}
  teacherReset();
}
function teacherReset(){
  Object.keys(state.scores).forEach(function(k){state.scores[k]=0});
  Object.keys(state.done).forEach(function(k){state.done[k]=false});
  state.currentStage=1;state.streak=0;
  s1Known={};s3Looked={};customImages={};
  document.getElementById('notesArea').value='';
  updateHUD();renderSidebar();renderStage();saveState();
}

/* ========== AUDIO ========== */
let audioCtx=null,soundOn=true;
function playTone(f,d,t,v){
  if(!soundOn)return;t=t||'sine';v=v||.12;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sCorrect(){playTone(660,.12);setTimeout(function(){playTone(880,.18)},100)}
function sWrong(){playTone(180,.25,'sawtooth',.08)}
function sWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,.2)},i*110)})}
function sFlip(){playTone(500,.08,'sine',.06)}
function sPop(){playTone(700,.06,'sine',.05)}
function confetti(){
  const colors=['#ee5a24','#ff6b6b','#2a5298','#28a745','#ffd700','#6a3093'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*.5+'s';
    c.style.width=(Math.random()*8+6)+'px';c.style.height=(Math.random()*8+6)+'px';
    if(Math.random()>.5)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(function(){c.remove()},3600);
  }
}
let ukVoice=null;
function pickUKVoice(){
  if(!('speechSynthesis' in window))return null;
  const voices=window.speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='en-GB')||
         voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en-gb'))||
         voices.find(v=>v.name&&/british|uk|england|daniel|kate|serena|oliver|libby|sonia/i.test(v.name))||
         null;
}
if('speechSynthesis' in window){ukVoice=pickUKVoice();window.speechSynthesis.onvoiceschanged=()=>{ukVoice=pickUKVoice()}}
function speak(text){
  if(!soundOn)return;
  if(!('speechSynthesis'in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-GB';u.rate=.9;u.pitch=1;
    if(ukVoice)u.voice=ukVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ========== SYNC ========== */
const CHANNEL='nd_lesson_live_v1';
let bc=null;
try{bc=new BroadcastChannel(CHANNEL)}catch(e){}
function broadcast(type,payload){
  if(teacherMode)return;
  if(fbConnected&&sessionRef){
    try{
      if(type==='state')sessionRef.child('state').set(Object.assign({},payload,{lastUpdate:Date.now()}));
      else if(type==='action'){activityRef.push(payload);sessionRef.child('state').update({score:payload.score,stage:payload.stage,lastUpdate:Date.now()})}
      else if(type==='notes')sessionRef.child('state').update({notes:payload.text});
    }catch(e){console.error('FB write failed:',e)}
  }
  const msg={type:type,payload:payload,ts:Date.now()};
  if(bc){try{bc.postMessage(msg)}catch(e){}}
  try{localStorage.setItem('nd_broadcast',JSON.stringify(msg));setTimeout(function(){localStorage.removeItem('nd_broadcast')},100)}catch(e){}
}
function pushFullState(){
  if(teacherMode||!fbConnected||!sessionRef)return;
  broadcast('state',{
    stage:state.currentStage,score:totalScore(),streak:state.streak,
    done:state.done,scores:state.scores,
    notes:document.getElementById('notesArea').value,
    elapsed:Math.floor((Date.now()-state.sessionStart)/1000)
  });
}

/* ========== STATE ========== */
const state={
  currentYear: "2026",
  currentMonth: "October",
  currentLessonId: "lesson_1",
  currentStage: 1,
  scores:{}, // Keyed by lessonId_stageId
  done:{},   // Keyed by lessonId_stageId
  sessionStart:Date.now(),streak:0,currentQuestion:0,lastAction:''
};
// Initialize scores and done tracking for all lessons
CURRICULUM.forEach(y => y.months.forEach(m => m.lessons.forEach(l => l.stages.forEach(s => {
  const key = l.id + "_" + s.id;
  state.scores[key] = 0;
  state.done[key] = false;
}))));

function getCurrentLesson() {
  const year = CURRICULUM.find(y => y.year === state.currentYear);
  if (!year) return null;
  const month = year.months.find(m => m.month === state.currentMonth);
  if (!month) return null;
  return month.lessons.find(l => l.id === state.currentLessonId);
}
function totalScore(){
  const lesson = getCurrentLesson();
  if (!lesson) return 0;
  return lesson.stages.reduce((sum, s) => sum + (state.scores[lesson.id + "_" + s.id] || 0), 0);
}
function saveState(){
  if(teacherMode)return;
  try{localStorage.setItem('nd_state_gaziz_academic_pp_v2',JSON.stringify({
    currentYear: state.currentYear,
    currentMonth: state.currentMonth,
    currentLessonId: state.currentLessonId,
    currentStage: state.currentStage,
    scores:state.scores,done:state.done,
    notes:document.getElementById('notesArea').value,
    dark:document.documentElement.classList.contains('dark'),
    soundOn:soundOn
  }))}catch(e){}
  broadcast('state',{
    stage:state.currentStage,score:totalScore(),streak:state.streak,
    done:state.done,scores:state.scores,
    notes:document.getElementById('notesArea').value,
    elapsed:Math.floor((Date.now()-state.sessionStart)/1000)
  });
}
function loadState(){
  try{
    const raw=localStorage.getItem('nd_state_gaziz_academic_pp_v2');if(!raw)return;
    const p=JSON.parse(raw);
    if(p.currentYear)state.currentYear=p.currentYear;
    if(p.currentMonth)state.currentMonth=p.currentMonth;
    if(p.currentLessonId)state.currentLessonId=p.currentLessonId;
    if(p.currentStage)state.currentStage=p.currentStage;
    if(p.scores)Object.assign(state.scores,p.scores);
    if(p.done)Object.assign(state.done,p.done);
    if(p.notes)document.getElementById('notesArea').value=p.notes;
    if(p.dark)document.documentElement.classList.add('dark');
    if(p.soundOn!==undefined)soundOn=p.soundOn;
  }catch(e){}
}
let customImages={};
function broadcastAction(type,detail){
  state.lastAction=detail;
  broadcast('action',{stage:state.currentStage,type:type,detail:detail,score:totalScore(),ts:Date.now()});

function renderDD(){
  const wordsEl=document.getElementById('ddWords'),slotsEl=document.getElementById('ddSlots');
  if(!wordsEl||!slotsEl)return;wordsEl.innerHTML='';slotsEl.innerHTML='';
  const words=MATCH_DATA.slice().sort(function(){return Math.random()-.5});
  const meanings=MATCH_DATA.slice().sort(function(){return Math.random()-.5});
  words.forEach(function(item){
    const d=document.createElement('div');d.className='dd-word';d.draggable=true;
    d.dataset.word=item.word;d.textContent=item.word;
    d.addEventListener('dragstart',function(e){if(d.classList.contains('used')){e.preventDefault();return}e.dataTransfer.setData('text/plain',item.word)});
    d.addEventListener('click',function(){
      if(d.classList.contains('used'))return;
      document.querySelectorAll('.dd-word').forEach(function(x){x.style.outline=''});
      d.style.outline='3px solid var(--accent)';d.style.outlineOffset='2px';
      window.__selectedDDWord=item.word;
    });
    wordsEl.appendChild(d);
  });
  meanings.forEach(function(item){
    const slot=document.createElement('div');slot.className='dd-slot';slot.dataset.answer=item.word;
    slot.innerHTML='<span class="slot-label">'+escapeHtml(item.meaning)+'</span>';
    slot.addEventListener('dragover',function(e){e.preventDefault();if(!slot.classList.contains('correct'))slot.classList.add('over')});
    slot.addEventListener('dragleave',function(){slot.classList.remove('over')});
    slot.addEventListener('drop',function(e){e.preventDefault();slot.classList.remove('over');tryPlace(e.dataTransfer.getData('text/plain'),slot)});
    slot.addEventListener('click',function(){
      if(slot.classList.contains('correct'))return;
      if(window.__selectedDDWord){tryPlace(window.__selectedDDWord,slot);window.__selectedDDWord=null;
        document.querySelectorAll('.dd-word').forEach(function(x){x.style.outline=''})}
    });
    slotsEl.appendChild(slot);
  });
}
function tryPlace(word,slot){
  if(!word||slot.classList.contains('correct'))return;
  if(slot.dataset.answer===word){
    slot.classList.add('correct');
    slot.innerHTML='<span class="slot-label">'+slot.querySelector('.slot-label').textContent+'</span><span class="dropped-word ok">'+escapeHtml(word)+'</span>';
    document.querySelectorAll('.dd-word').forEach(function(d){if(d.dataset.word===word)d.classList.add('used')});
    sCorrect();updateDDCount();checkDDComplete();broadcastAction('match_correct',word);
  }else{
    slot.classList.add('wrong');sWrong();
    setTimeout(function(){slot.classList.remove('wrong')},500);
    broadcastAction('match_wrong',word+' → '+slot.dataset.answer);
  }
}
function updateDDCount(){const c=document.querySelectorAll('.dd-slot.correct').length;const el=document.getElementById('s2count');if(el)el.textContent=c}
function checkDDComplete(){const c=document.querySelectorAll('.dd-slot.correct').length;if(c===MATCH_DATA.length){setScore(2,15);markDone(2)}else{setScore(2,Math.floor(c*15/MATCH_DATA.length))}}

function buildPassageHTML(){
  function vw(word){return '<span class="v-word" data-en="'+word+'">'+word+'</span>'}
  return '<h3>A growing city</h3><p>Rivergate is a growing city beside a wide river. In recent years, the local council '+vw('has improved')+' public '+vw('transport')+'. It '+vw('has provided')+' more buses in the evening, and it '+vw('has added')+' clear maps at busy stops. These changes '+vw('have helped')+' people travel to work, school, and the hospital. Last spring, the council '+vw('opened')+' a new bus station near the market. Residents '+vw('tested')+' the routes and '+vw('shared')+' their ideas at a public meeting. The council '+vw('has listened')+' to some of those ideas and '+vw('has changed')+' the bus times to help people who finish work late.</p>'+
  '<p>Many people in Rivergate use buses because they do not have a car. Before the new evening service, some workers waited a long time or paid for a taxi. The new buses have made travel easier for them. A local nurse said that she has used the later bus three times this week. In 2024, the council '+vw('increased')+' the number of evening trips after residents described this '+vw('issue')+'. The change has helped people get home safely after work.</p>'+
  '<h3>Cleaner streets and shared places</h3><p>The city '+vw('has also worked')+' to '+vw('reduce')+' '+vw('pollution')+'. It '+vw('has planted')+' trees along two busy roads and '+vw('has created')+' a small park beside the river. In 2023, local volunteers '+vw('cleaned')+' the riverbank and '+vw('collected')+' plastic waste. The project had a good '+vw('result')+': families have used the park more often since then. Some residents have asked the council to add more bins, because visitors sometimes leave rubbish behind. The council '+vw('has provided')+' bins near the main path and '+vw('has asked')+' a local group to check the park every week.</p>'+
  '<p>Local shops have also supported the project. They have given water to volunteers and have put small signs in their windows. Last year, one shop owner '+vw('started')+' a weekend walk for families. The group '+vw('visited')+' the park and '+vw('learned')+' about the birds that live by the river. These small activities have brought people together and have helped the community take care of a shared place.</p>'+
  '<h3>Plans, costs, and results</h3><p>The council’s plans have brought benefits, but they have also cost money. The council '+vw('spent')+' part of its budget on new buses and street lights last year. It '+vw('has saved')+' energy by using better lights in public buildings. The changes '+vw('have affected')+' daily life in different ways. Some people have found it easier to travel, while others still wait a long time at the busiest stops. A new bus can cost more than an old one, but it can carry many people and use less fuel. The council will review the service this autumn and decide what to improve next.</p>'+
  '<p>Rivergate has not solved every problem. Traffic is still heavy near the market in the afternoon, and the park needs regular care. However, the council has heard local views and has tried several practical solutions. Residents have helped by using the new buses, keeping the park clean, and sharing feedback. Over time, the city has learned which changes work best for its community.</p>';
}

function renderInputExercise(data,stageId,prevId,nextId,title,eyebrow,formula,listHTML,lead,inputPlaceholder){

  const v=document.createElement('div');v.className='stage-view active';

    const inp=document.createElement('input');inp.type='text';inp.className='q-input';
    inp.placeholder=inputPlaceholder;inp.autocomplete='off';inp.spellcheck=false;
    const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check';
    const fb=document.createElement('div');fb.className='q-feedback';
    let answered=false;
    function submit(){
      if(answered)return;
      const val=inp.value.trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
      const ans=item.answer.toLowerCase();
      const ok=val===ans;

        fb.className='q-feedback correct';fb.innerHTML='✓ Correct!<span class="exp">'+escapeHtml(item.exp)+'</span>';

    inp.addEventListener('input',function(){broadcastAction('typing',item.prompt.substring(0,30)+' | "'+inp.value+'"')});

            if (isActive) {
              const studentCode=getSessionCode();
              const assignedHomework=Object.keys(curriculumCache||{}).map(function(id){return curriculumCache[id]}).filter(function(item){
                return item&&item.homework&&item.published!==false&&(!Array.isArray(item.assignedTo)||!item.assignedTo.length||item.assignedTo.indexOf(studentCode)!==-1);
              });
              if(lesson.id==='lesson_1'&&assignedHomework.length){
                const homeworkList=document.createElement('div');homeworkList.className='homework-sub-list';
                homeworkList.innerHTML='<div class="homework-sub-label">Homework</div>'+assignedHomework.map(function(item){
                  const id=item.id||Object.keys(curriculumCache).find(function(k){return curriculumCache[k]===item});
                  const url=new URL(item.customUrl||'homework.html',window.location.href);url.searchParams.set('lesson',id);if(studentCode)url.searchParams.set('code',studentCode);
                  return '<a class="homework-sub-item" href="'+escapeAttr(url.href)+'">📝 '+escapeHtml(item.title||'Homework 1')+' ↗</a>';
                }).join('');
                homeworkList.addEventListener('click',function(e){e.stopPropagation()});list.appendChild(homeworkList);
              }
              const stageSubList = document.createElement('div');
              stageSubList.className = 'stage-sub-list';
              lesson.stages.forEach(stage => {
                const key = lesson.id + "_" + stage.id;
                const isStageActive = stage.id === state.currentStage;
                const isStageDone = state.done[key];
                const stageEl = document.createElement('button');
                stageEl.className = 'stage-sub-item' + (isStageActive ? ' active' : '') + (isStageDone ? ' done' : '');
                stageEl.innerHTML = `<span class="icon">${stage.icon}</span> <span>${stage.label}</span>`;
                stageEl.onclick = () => goToStage(stage.id);
                stageSubList.appendChild(stageEl);
              });
              list.appendChild(stageSubList);
            }
          });
        }
      });
    }
  });
}

function goToStage(n){
  state.currentStage=n;renderSidebar();renderStage();
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
  broadcastAction('stage_open','Stage '+n);
}
function renderStage(){
  const main=document.getElementById('main');main.innerHTML='';
  const fns={1:renderStage1,2:renderStage2,3:renderStage3,4:renderStage4,5:renderStage5,6:renderStage6,7:renderStage7,8:renderStage8,9:renderStage9,10:renderStage10};
  try{fns[state.currentStage]()}catch(e){console.error(e);main.innerHTML='<p>Error loading stage.</p>'}
}
function stageFooter(prevId,nextId,extraHTML){
  const f=document.createElement('div');f.className='stage-footer';let html='';
  if(prevId)html+='<button class="btn ghost" onclick="goToStage('+prevId+')">← Previous</button>';else html+='<span></span>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;">'+(extraHTML||'')+'</div>';
  if(nextId)html+='<button class="btn" onclick="goToStage('+nextId+')">Next →</button>';else html+='<span></span>';
  f.innerHTML=html;return f;
}
function startTimer(){
  setInterval(function(){
    const elapsed=Math.floor((Date.now()-state.sessionStart)/1000);
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    const el=document.getElementById('timerDisplay');if(el)el.textContent=m+':'+s;
  },1000);
}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').classList.toggle('active',soundOn);document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';saveState()}
function toggleDark(){document.documentElement.classList.toggle('dark');document.getElementById('darkToggle').classList.toggle('active',document.documentElement.classList.contains('dark'));saveState()}
function toggleNotes(){document.getElementById('notesPanel').classList.toggle('open')}
document.getElementById('notesArea').addEventListener('input',function(){saveState();broadcast('notes',{text:this.value})});
function showToast(text){
  let toast=document.getElementById('toast');
  if(!toast){
    toast=document.createElement('div');toast.id='toast';
    toast.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:white;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center;';
    document.body.appendChild(toast);
  }
  toast.textContent=text;
  toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(function(){toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(10px)'},2200);
}
const QUESTION_BANKS={reading:READING_Q,cloze:CLOZE,comp:COMP,grammar6:GRAMMAR_6,grammar7:GRAMMAR_7,grammar8:GRAMMAR_8,sentence:SB};
function teacherEditsReady(data){return !!data}
function applyTeacherQuestionEdits(data){
  Object.keys(QUESTION_BANKS).forEach(function(bank){const edits=data&&data[bank]||{};Object.keys(edits).forEach(function(index){const target=QUESTION_BANKS[bank][Number(index)];if(target)Object.assign(target,edits[index])})});
}
function addTeacherQuestionEditor(card,bank,index){
  if(!teacherCanEdit)return;
  const button=document.createElement('button');button.type='button';button.className='btn ghost small';button.textContent='✏️ Edit question';button.style.marginBottom='12px';
  button.onclick=function(){editTeacherQuestion(bank,index)};card.appendChild(button);
}
function editTeacherQuestion(bank,index){
  if(!teacherCanEdit||!fbDb)return alert('Only an approved teacher account can edit questions.');
  const item=QUESTION_BANKS[bank]&&QUESTION_BANKS[bank][index];if(!item)return;
  const next=JSON.parse(JSON.stringify(item));const textKey=Object.prototype.hasOwnProperty.call(next,'text')?'text':(Object.prototype.hasOwnProperty.call(next,'q')?'q':'prompt');
  const wording=prompt('Question or sentence wording:',next[textKey]||'');if(wording===null)return;next[textKey]=wording.trim();
  if(Array.isArray(next.options)){
    const rawOptions=prompt('Answer choices, one per line:',next.options.join('\n'));if(rawOptions===null)return;const options=rawOptions.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);if(options.length<2){alert('Keep at least two answer choices.');return}next.options=options;
    if(bank==='cloze'||bank==='speed'||bank==='reading'){
      const correct=prompt('Correct choice number (1 to '+options.length+'):',String((Number(next.correct)||0)+1));if(correct===null)return;const n=Number(correct);if(!Number.isInteger(n)||n<1||n>options.length){alert('Enter a valid choice number.');return}next.correct=n-1;
    }else if(bank==='comp'&&next.type==='mc'){
      const correct=prompt('Correct choice number (1 to '+options.length+'):',String((Number(next.correct)||0)+1));if(correct===null)return;const n=Number(correct);if(!Number.isInteger(n)||n<1||n>options.length){alert('Enter a valid choice number.');return}next.correct=n-1;
    }else if(bank==='comp'&&next.type==='tf'){
      const answer=prompt('Correct answer: True or False',next.correct?'True':'False');if(answer===null)return;next.correct=answer.trim().toLowerCase()==='true';
    }
  }else if(bank.indexOf('grammar')===0){const answer=prompt('Accepted answer:',next.answer||'');if(answer===null)return;next.answer=answer.trim();}
  else if(bank==='sentence'){const answer=prompt('Correct sentence:',(next.correct||[]).join(' '));if(answer===null)return;next.correct=answer.trim().split(/\s+/);next.words=next.correct.slice();}
  if(Object.prototype.hasOwnProperty.call(next,'exp')){const exp=prompt('Explanation shown after the answer:',next.exp);if(exp===null)return;next.exp=exp.trim()}
  if(Object.prototype.hasOwnProperty.call(next,'explain')){const explain=prompt('Explanation shown after the answer:',next.explain);if(explain===null)return;next.explain=explain.trim()}
  fbDb.ref('curriculum/'+state.currentLessonId+'/questionEdits/'+bank+'/'+index).set(next).then(function(){Object.assign(item,next);renderStage();showToast('Question saved')}).catch(function(err){alert('Could not save question: '+err.message)});
}
/* INIT */
if(!teacherPreviewRequested)loadState();
const lessonFromUrl=new URLSearchParams(window.location.search).get('lesson');
if(lessonFromUrl){state.currentLessonId=lessonFromUrl;if(!teacherPreviewRequested)localStorage.setItem('nd_current_lesson',lessonFromUrl);}
const savedCode=teacherPreviewRequested?'':getSessionCode();
if(savedCode)document.getElementById('sessionCodeInput').value=savedCode;
renderSidebar();renderStage();startTimer();updateHUD();
if(soundOn)document.getElementById('soundToggle').classList.add('active');
if(document.documentElement.classList.contains('dark'))document.getElementById('darkToggle').classList.add('active');
initFirebase();
// Fetch and display student name
(function(){
  const code=getSessionCode();
  if(!code||!fbDb)return;
  fbDb.ref('students/'+code+'/name').once('value',function(snap){
    const name=snap.val();
    if(!name)return;
    const logo=document.querySelector('.logo .text');
    if(logo)logo.textContent=name;
    document.title=name+' — IELTS Studio';
  });
})();
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeFCModal();
  const modal=document.getElementById('fcModal');
  if(modal.classList.contains('open')){
    if(e.key==='ArrowRight')fcNext();
    if(e.key==='ArrowLeft')fcPrev();
    if(e.key===' '){e.preventDefault();fcRevealTrans()}
  }
});
setInterval(function(){if(fbConnected)pushFullState()},5000);
setTimeout(pushFullState,800);
</script>
