  const mins=Math.floor(elapsed/60),secs=elapsed%60;
  const root=document.getElementById('testRoot');if(!root)return;
  const msg=customReason?customReason:(timedOut?'You ran out of time.':'Test complete!');
  root.innerHTML='<div class="'+(timedOut||customReason?'test-timeout':'test-result')+'">'+
  '<div class="icon">'+(timedOut||customReason?'⏰':'🏁')+'</div>'+
  '<h3>'+(customReason?'Test Failed':(timedOut?'Time is up!':'Test complete!'))+'</h3>'+
  '<div class="big">'+testState.correct+' / '+total+'</div>'+
  '<p>'+msg+' You answered <b>'+testState.correct+'</b> correctly in <b>'+mins+'m '+secs+'s</b>.</p>'+
  '<p style="color:var(--accent);font-weight:700;margin-top:10px">This test can only be taken once. You cannot retake it.</p>'+
  '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="btn ghost" onclick="goToStage(1)">← Back to start</button></div></div>';
  if(!timedOut&&!customReason){sWin();confetti();}
  broadcastAction('test_end','Score: '+testState.correct+'/'+total);
}

/* ================== HUD ================== */
function updateHUD(){
  const el=document.getElementById('scoreDisplay');
  if(el){el.textContent=totalScore();el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
  const sd=document.getElementById('streakDisplay');if(sd)sd.textContent=state.streak;
  const lesson=getCurrentLesson();if(!lesson)return;
  const doneCount=lesson.stages.filter(function(s){return state.done[lesson.id+"_"+s.id]}).length;
  const pct=Math.round((doneCount/lesson.stages.length)*100);
  const pp=document.getElementById('progressPct');if(pp)pp.textContent=pct+'%';
  const pf=document.getElementById('progressFill');if(pf)pf.style.width=pct+'%';
}
function markDone(stageId){
  const key=state.currentLessonId+"_"+stageId;
  if(state.done[key])return;
  state.done[key]=true;
  sWin();confetti();renderSidebar();updateHUD();saveState();
  broadcastAction('stage_complete','Stage '+stageId+' complete!');
}
function setScore(stageId,amount){
  const key=state.currentLessonId+"_"+stageId;
  state.scores[key]=amount;
  updateHUD();saveState();
}

/* ================== SIDEBAR ================== */
let expandedYears=["2026"],expandedMonths=["October"];
function resetStageTeacher(stageId) {
  if(!teacherCanEdit) return;
  if(!confirm('Are you sure you want to reset progress for Stage ' + stageId + '?')) return;
  const key = state.currentLessonId + "_" + stageId;
  state.scores[key] = 0;
  state.done[key] = false;
  if (stageId === 1) { vocabState = {}; saveVocabStateLocal(); }
  saveState();
  renderSidebar();
  renderStage();
  updateHUD();
  broadcastAction('teacher_reset_stage', 'Teacher manually reset Stage ' + stageId);
  if (typeof showToast === 'function') showToast('Stage ' + stageId + ' reset');
}
function renderSidebar(){
  const list=document.getElementById('stageList');if(!list)return;list.innerHTML='';
  const isAraylim1 = activeContentName.includes('araylim_1');
  const customLabels = isAraylim1 ? [
      'Vocabulary', 'Word Match', 'Reading & Questions', 
      'Simple Present', 'Present Continuous', 
      'Simple Past', 'Past Continuous', 
      'Present Perfect', 'Test Your Knowledge'
  ] : null;

  CURRICULUM.forEach(function(yearObj){
    const isY=expandedYears.includes(yearObj.year);
    const yearEl=document.createElement('div');yearEl.className='year-item'+(isY?' open':'');
    yearEl.innerHTML='<span>📅 '+yearObj.year+'</span><span class="arrow">▶</span>';
    yearEl.onclick=function(){if(isY)expandedYears=expandedYears.filter(function(y){return y!==yearObj.year});else expandedYears.push(yearObj.year);renderSidebar()};
    list.appendChild(yearEl);
    if(isY)yearObj.months.forEach(function(m){
      const isM=expandedMonths.includes(m.month);
      const mEl=document.createElement('div');mEl.className='month-item'+(isM?' open':'');
      mEl.innerHTML='<span>📁 '+m.month+'</span><span class="arrow">▶</span>';
      mEl.onclick=function(){if(isM)expandedMonths=expandedMonths.filter(function(x){return x!==m.month});else expandedMonths.push(m.month);renderSidebar()};
      list.appendChild(mEl);
      if(isM)m.lessons.forEach(function(lesson){
        const isActive=lesson.id===state.currentLessonId;
        const lEl=document.createElement('div');lEl.className='lesson-item'+(isActive?' active':'');
        const fbLesson = curriculumCache[lesson.id];
        const title = (fbLesson && fbLesson.title) ? fbLesson.title : lesson.title;
        lEl.innerHTML='<span>📘 '+title+'</span>';
        lEl.onclick=function(){state.currentLessonId=lesson.id;state.currentStage=1;renderSidebar();renderStage();loadDraft()};
        list.appendChild(lEl);
        if(isActive){
          const studentCode=getSessionCode();
          if (studentCode) {
            const assignedHW=Object.keys(curriculumCache||{}).map(id=>curriculumCache[id]).filter(it=>{
              return it && it.homework && it.published!==false && Array.isArray(it.assignedTo) && it.assignedTo.includes(studentCode);
            });
            if(assignedHW.length){
              const hwList=document.createElement('div');hwList.className='homework-sub-list';
              hwList.innerHTML='<div class="homework-sub-label">Homework</div>'+assignedHW.map(function(it){
                const id=it.id||Object.keys(curriculumCache).find(function(k){return curriculumCache[k]===it});
                const url=new URL(it.customUrl||'homework.html',window.location.href);
                url.searchParams.set('lesson',id);
                if(studentCode)url.searchParams.set('code',studentCode);
                const contentFile = (it.contentUrl || '').replace(/^content\//, '').replace(/\.json$/, '');
                if (contentFile) url.searchParams.set('variant', contentFile);
                return '<a class="homework-sub-item" href="'+escapeAttr(url.href)+'">📝 '+escapeHtml(it.title||'Homework')+' ↗</a>';
              }).join('');
              hwList.addEventListener('click',function(e){e.stopPropagation()});
              list.appendChild(hwList);
            }
          }
          const sub=document.createElement('div');sub.className='stage-sub-list';
          DEFAULT_STAGES.forEach(function(st){
            const key=lesson.id+"_"+st.id;
            const isA=st.id===state.currentStage;
            
            let isD = false;
            if (document.getElementById('workspaceName').textContent.toLowerCase().includes('sabina')) {
                if (st.id === 1 || st.id === 2) isD = true; 
            }
            if (st.id === 1) {
                const counts = getVocabCounts();
                if(counts.learned === VOCAB.length) isD = true;
                else isD = false; 
            } else {
                isD = state.done[key];
            }

            let statusIcon = isD ? '✅' : (isA ? '📍' : '🔒');
            const row = document.createElement('div');
            row.style.display = 'flex'; row.style.alignItems = 'stretch'; row.style.gap = '4px';
            const stEl=document.createElement('button');
            stEl.className='stage-sub-item'+(isA?' active':'')+(isD?' done':'');
            stEl.style.flex = '1';
            const displayLabel = customLabels ? customLabels[st.id - 1] : st.label;
            stEl.innerHTML='<span class="icon" style="font-size:14px; margin-right:8px;">'+statusIcon+'</span> <span>'+displayLabel+'</span>';
            stEl.onclick=function(){goToStage(st.id)};
            row.appendChild(stEl);

            if (teacherCanEdit) {
              const resetBtn = document.createElement('button');
              resetBtn.innerHTML = '🔄';
              resetBtn.title = 'Reset this stage (Teacher only)';
              resetBtn.style.cssText = 'background:var(--panel-2); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:14px; padding:0 8px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; transition:all 0.15s;';
              resetBtn.onmouseover = () => { resetBtn.style.color = 'var(--error)'; resetBtn.style.borderColor = 'var(--error)'; };
              resetBtn.onmouseout = () => { resetBtn.style.color = 'var(--ink-soft)'; resetBtn.style.borderColor = 'var(--border)'; };
              resetBtn.onclick = function(e) { e.stopPropagation(); resetStageTeacher(st.id); };
              row.appendChild(resetBtn);
            }
            sub.appendChild(row);
          });
          list.appendChild(sub);
        }
      });
    });
  });
}
function goToStage(n){
  if(testState.active){
    if(!confirm('⚠️ You are in the middle of a timed test. Leaving this page will abandon your test and discard your progress. Are you sure you want to leave?')) return;
    endTest(true, 'Test aborted: you navigated away.');
  }
  state.currentStage=n;renderSidebar();renderStage();const m=document.getElementById('main');if(m)m.scrollTo({top:0,behavior:'smooth'});broadcastAction('stage_open','Stage '+n);
}
function renderStage(){
  const main=document.getElementById('main');if(!main)return;
  main.innerHTML='';
  
  const lesson = getCurrentLesson();
  const stages = DEFAULT_STAGES;
  const stageIndex = stages.findIndex(s => s.id === state.currentStage);

  let fn = null;
  if (stageIndex === stages.length - 1) {
      fn = renderStage9;
  } else {
      switch(stageIndex) {
          case 0: fn = renderStage1; break;
          case 1: fn = renderStage2; break;
          case 2: fn = renderStage3; break;
          case 3: fn = renderStage4; break;
          case 4: fn = renderStage5; break;
          case 5: fn = renderStage6; break;
          case 6: fn = renderStage7; break;
          case 7: fn = renderStage8; break;
          default: fn = renderStage1;
      }
  }
  
  try{
    if(typeof fn === 'function') fn(); else main.innerHTML='<p>Error: Stage content not found.</p>';
    
    const title = lesson ? lesson.title : 'Lesson';
    const stageObj = stages.find(s => s.id === state.currentStage);
    const icon = (stageObj && stageObj.icon) ? stageObj.icon : '📘';
    
    const header = document.createElement('div');
    header.style.cssText = 'max-width:1000px; margin:0 auto 20px auto; padding-bottom:12px; border-bottom:2px solid var(--border); font-size:32px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:12px; animation: fadeSlide 0.4s ease;';
    if(stageIndex === 2) header.style.maxWidth = '1400px';
    header.innerHTML = `<span style="font-size:36px;">${icon}</span> <span>${escapeHtml(title)}</span>`;
    
    main.insertBefore(header, main.firstChild);
  }catch(e){
    console.error(e);
    main.innerHTML='<p>Error loading stage.</p>';
  }
}
function stageFooter(prevId,nextId,extraHTML){
  const f=document.createElement('div');f.className='stage-footer';let html='';
  if(prevId)html+='<button class="btn ghost" onclick="goToStage('+prevId+')">← Previous</button>';else html+='<span></span>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'+(extraHTML||'')+'</div>';
  if(nextId)html+='<button class="btn" onclick="goToStage('+nextId+')">Next →</button>';else html+='<span></span>';
  f.innerHTML=html;return f;
}
function startTimer(){
  setInterval(function(){
    const elapsed=Math.floor((Date.now()-state.sessionStart)/1000);
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    const el=document.getElementById('timerDisplay');if(el)el.textContent=m+':'+s;
  },1000);
}
function toggleSound(){soundOn=!soundOn;const st=document.getElementById('soundToggle');if(st){st.classList.toggle('active',soundOn);st.textContent=soundOn?'🔊':'🔇'}saveState()}
function toggleDark(){
  document.documentElement.classList.toggle('dark');
  const dark = document.documentElement.classList.contains('dark');
  try{localStorage.setItem('nd_lesson_theme', dark ? 'dark' : 'light')}catch(e){}
  const dt=document.getElementById('darkToggle');
  if(dt)dt.classList.toggle('active',dark);
  saveState();
}
function toggleNotes(){const np=document.getElementById('notesPanel');if(np)np.classList.toggle('open')}
document.getElementById('notesArea').addEventListener('input',function(){saveState();broadcast('notes',{text:this.value})});
function showToast(text){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:white;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center';document.body.appendChild(t)}
  t.textContent=text;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)'},2200);
}

/* ================== CONTENT LOADER ================== */
async function loadContent() {
  activeContentName = new URLSearchParams(location.search).get('content') || 'sabina';
  const res = await fetch('content/' + activeContentName + '.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('content/' + activeContentName + '.json not found');
  const c = await res.json();
  VOCAB         = c.vocab;
  MATCH_DATA    = c.matchData;
  READING_HTML  = c.readingHtml;
  READING_Q     = c.readingQ;
  CONTEXT_Q     = c.contextQ;
  G6            = c.g6;
  G7            = c.g7;
  SB_PP         = c.sbPp;
  SB_PS         = c.sbPs;
  G10           = c.g10;
  TEST_MCQ      = c.testMcq;
  TEST_SHORT    = c.testShort;
  TEST_TFNG     = c.testTfng;
  TEST_COMPLETE = c.testComplete;
}

/* ================== INIT ================== */
(async function boot() {
  try {
    await loadContent();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px">' +
        '<h2>Content failed to load</h2>' +
        '<p style="color:var(--ink-soft)">' + e.message + '</p>' +
      '</div>';
    return;
  }

  if(!teacherPreviewRequested)loadState();
  if(!teacherPreviewRequested && state.currentStage === 1){
    for(let i = 1; i <= 9; i++){
      if(!state.done[state.currentLessonId + "_" + i]){
        state.currentStage = i;
        break;
      }
    }
  }
  const lessonFromUrl=new URLSearchParams(window.location.search).get('lesson');
  if(lessonFromUrl){state.currentLessonId=lessonFromUrl;if(!teacherPreviewRequested)localStorage.setItem('nd_current_lesson',lessonFromUrl)}
  const savedCode=teacherPreviewRequested?'':getSessionCode();
  if(savedCode){const sci=document.getElementById('sessionCodeInput');if(sci)sci.value=savedCode}
  
  if (savedCode) {
    // Name loading handled in initFirebase
  } else {
    document.getElementById('workspaceName').textContent = 'Teacher Workspace';
  }

  renderSidebar();renderStage();startTimer();updateHUD();
  if(soundOn){const st=document.getElementById('soundToggle');if(st)st.classList.add('active')}
  if(document.documentElement.classList.contains('dark')){const dt=document.getElementById('darkToggle');if(dt)dt.classList.add('active')}
  initFirebase();
})();

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden' && testState.active) {
    endTest(true, 'Test aborted: you switched tabs or left the window.');
  }
});
window.addEventListener('beforeunload', function(e) {
  if (testState.active) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
