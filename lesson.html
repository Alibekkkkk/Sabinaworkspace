<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabina — Natural Disasters: Vocabulary, Reading & Tenses</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--paper:#fffdf7;--ink:#2c3e50;--ink-soft:#6c757d;--primary:#2a5298;--primary-dark:#1e3c72;--accent:#ee5a24;--accent-dark:#d94a15;--success:#2e9e5b;--success-soft:#d4edda;--error:#dc3545;--error-soft:#f8d7da;--warn:#ff9800;--border:#e0dbd0;--shadow-sm:0 2px 6px rgba(0,0,0,.06);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.15)}
html.dark{--bg:#1a1d24;--panel:#232832;--paper:#1e222a;--ink:#e8e8ea;--ink-soft:#a0a6b0;--primary:#5b8dd9;--primary-dark:#2a5298;--accent:#ff8a5b;--accent-dark:#ee5a24;--success:#4caf7d;--success-soft:#1e3a2a;--error:#ef5468;--error-soft:#3a1e22;--border:#333944}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'EB Garamond','Times New Roman',serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap}
.logo .mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(238,90,36,.35)}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--bg);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.stat-pill .val{color:var(--accent);font-size:16px}
.stat-pill .val.green{color:var(--success)}
.stat-pill .val.bump{animation:bump .5s}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-soft);transition:all .15s;position:relative;text-decoration:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:4px;animation:syncPulse 2s ease-in-out infinite}
.sync-dot.warn{background:var(--warn);animation:none}
.sync-dot.off{background:var(--error);animation:none}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.session-input{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700}
.session-input input{border:none;background:transparent;font-family:'Fira Code',monospace;font-size:13px;font-weight:800;color:var(--accent);outline:none;width:90px;text-transform:uppercase;letter-spacing:.5px}
.session-input input::placeholder{color:var(--ink-soft);font-weight:600;text-transform:none;letter-spacing:0}
.session-input .join-code{border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:11px;font-family:inherit;font-weight:700;padding:5px 9px;cursor:pointer}
.session-input .lbl{color:var(--ink-soft);font-weight:600}
.layout{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;flex-shrink:0}
.sidebar-header{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;padding:0 10px 10px;display:flex;justify-content:space-between;align-items:center}
.sidebar-header .pct{color:var(--accent);font-size:14px}
.progress-rail{height:6px;background:var(--bg);border-radius:6px;margin:0 10px 18px;overflow:hidden}
.progress-rail-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));width:0%;transition:width .5s ease;border-radius:6px}
.stage-list{display:flex;flex-direction:column;gap:2px}
.year-item{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;background:var(--bg);margin-top:4px}
.year-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.year-item.open .arrow{transform:rotate(90deg)}
.month-item{padding:8px 12px 8px 28px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:8px;border-radius:8px}
.month-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s}
.month-item.open .arrow{transform:rotate(90deg)}
.lesson-item{padding:8px 12px 8px 44px;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-soft);border-radius:8px;display:flex;align-items:center;gap:8px}
.lesson-item.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.lesson-item.done{color:var(--success)}
.lesson-item.active.done{color:#fff}
.stage-sub-list{display:flex;flex-direction:column;gap:2px;padding-left:8px;margin-bottom:8px;border-left:2px solid var(--border);margin-left:22px}
.stage-sub-item{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;width:100%;font-family:inherit}
.stage-sub-item:hover{background:var(--bg);color:var(--ink)}
.stage-sub-item.active{background:var(--bg);color:var(--accent);font-weight:800}
.stage-sub-item.done{color:var(--success)}
.homework-sub-list{margin:2px 0 8px 30px;padding:7px 8px 7px 12px;border-left:2px solid var(--accent);background:rgba(255,138,91,.07);border-radius:0 9px 9px 0}
.homework-sub-label{font:11px 'Fira Code',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:2px 6px 5px}
.homework-sub-item{display:block;padding:6px;color:var(--ink-soft);font-size:14px;text-decoration:none;border-radius:7px}
.homework-sub-item:hover{background:var(--bg);color:var(--accent)}
.main{flex:1;overflow-y:auto;padding:30px 40px 40px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.stage-view{display:none;animation:fadeSlide .4s ease;max-width:1000px;margin:0 auto}
.stage-view.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stage-view h2{font-size:32px;color:var(--ink);margin-bottom:6px;font-weight:800}
.stage-view .eyebrow{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.stage-view .lead{font-size:17px;color:var(--ink-soft);line-height:1.65;margin-bottom:22px;padding:14px 18px;background:var(--panel);border-left:4px solid var(--primary);border-radius:10px}
.stage-view .lead .ru{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-style:italic;font-size:15px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 3px 0 var(--accent-dark)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--accent-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--border);box-shadow:0 2px 0 var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.success{background:var(--success);box-shadow:0 3px 0 #1e7e34}
.btn.small{padding:7px 14px;font-size:14px}
.btn.flag{background:var(--warn);box-shadow:0 3px 0 #c96b00;color:#fff}
.btn.flag:hover{background:#e08600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.flash-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:14px 18px;background:var(--panel);border-radius:12px;border:1px solid var(--border)}
.flash-toolbar .filt{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.flash-toolbar .filt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flash-stats{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink-soft)}
.flash-stats b{color:var(--success)}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.flashcard{background:var(--panel);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;aspect-ratio:1/1.05;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.flashcard:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 28px rgba(238,90,36,.18)}
.flashcard.known{border-color:var(--success)}
.flashcard.known::before{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--success);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;z-index:4}
.flashcard.needs-practice{border-color:var(--warn)}
.flashcard.needs-practice::before{content:'!';position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--warn);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;z-index:4}
.flashcard-img{flex:1;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,rgba(42,82,152,.06),rgba(238,90,36,.06));position:relative;overflow:hidden;min-height:100px}
.flashcard-img img{width:100%;height:100%;object-fit:cover}
.flashcard-word{padding:10px 8px;text-align:center;font-size:16px;font-weight:800;color:var(--ink);border-top:1px solid var(--border);background:var(--panel)}
.fc-modal-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.fc-modal-backdrop.open{display:flex}
.fc-modal{background:var(--panel);border-radius:22px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative}
.fc-modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.08);border:none;cursor:pointer;font-size:20px;color:var(--ink);z-index:10}
.fc-modal-img{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:180px;background:linear-gradient(135deg,#e8eef8,#f8eee8);border-radius:22px 22px 0 0;position:relative;overflow:hidden}
html.dark .fc-modal-img{background:linear-gradient(135deg,#2a3142,#3a2e28)}
.fc-modal-img img{width:100%;height:100%;object-fit:contain;padding:20px}
.fc-modal-img .label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--ink);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.fc-modal-body{padding:24px 28px 28px;text-align:center}
.fc-modal-word{font-size:34px;font-weight:800;color:var(--primary);margin-bottom:6px}
.fc-reveal-area{display:none;text-align:left;margin-top:18px}
.fc-reveal-area.show{display:block}
.fc-meaning{padding:14px 16px;background:var(--bg);border-radius:12px;border-left:4px solid var(--accent);margin-bottom:12px}
.fc-meaning .context{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.fc-meaning .translation{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px}
.fc-meaning .example{font-size:15px;line-height:1.6;color:var(--ink-soft);font-style:normal;font-weight:500;padding-left:10px;border-left:2px solid var(--border)}
.fc-meaning .example b{color:var(--primary);font-style:normal}
.fc-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.fc-modal-actions .btn{min-width:130px;justify-content:center}
.fc-modal-tools{display:flex;gap:8px;justify-content:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);flex-wrap:wrap}
.fc-modal-tools .tool{padding:8px 14px;font-size:14px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink-soft)}
.fc-modal-tools .tool:hover{border-color:var(--accent);color:var(--accent)}
.fc-modal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.fc-modal-nav button{background:transparent;border:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft);padding:8px 14px;border-radius:8px;font-family:inherit}
.fc-modal-nav .counter{font-size:14px;color:var(--ink-soft);font-weight:700}
.quiz-progress{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px}
.quiz-hint-row{margin:6px 0 10px}
.quiz-hint-btn{background:var(--panel);border:1px dashed var(--border);border-radius:8px;padding:7px 16px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.quiz-hint-btn:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.quiz-context{font-size:16px;color:var(--primary);font-weight:800;margin-bottom:14px;font-style:normal;text-align:left;padding:12px 16px;background:var(--bg);border-radius:10px;border-left:4px solid var(--primary);line-height:1.5}
.hint-label{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quiz-opt{padding:12px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;text-align:left}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.quiz-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.quiz-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error)}
.quiz-opt:disabled{cursor:default;opacity:.85}
.flash-toolbar .practice-btn{margin-left:auto;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 3px 0 var(--primary-dark);display:none}
.flash-toolbar .practice-btn.show{display:inline-flex}
.dd-area{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dd-col-title{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:2px dashed var(--border)}
.dd-words,.dd-slots{display:flex;flex-direction:column;gap:10px}
.dd-word{padding:12px 16px;background:var(--panel);border:2px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;color:var(--ink);cursor:grab;user-select:none;display:flex;align-items:center;gap:10px}
.dd-word:hover:not(.used){border-color:var(--accent);transform:translateX(3px)}
.dd-word.used{opacity:.25;cursor:default;pointer-events:none}
.dd-word::before{content:'⠿';color:var(--ink-soft);font-size:17px;letter-spacing:-2px}
.dd-slot{min-height:52px;padding:12px 16px;background:var(--bg);border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink-soft)}
.dd-slot.over{border-color:var(--accent);background:rgba(238,90,36,.08)}
.dd-slot.correct{background:var(--success-soft);border:2px solid var(--success);color:var(--success)}
.dd-slot.wrong{background:var(--error-soft);border:2px solid var(--error);animation:shake .4s}
.dd-slot .slot-label{flex:1}
.dd-slot .dropped-word{padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;font-size:14px}
.dd-slot .dropped-word.ok{background:var(--success)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.passage{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:28px 32px;font-size:18px;line-height:1.85;color:var(--ink);box-shadow:var(--shadow-sm);font-family:'EB Garamond','Times New Roman',serif}
.passage h1{font-size:26px;color:var(--accent);margin-bottom:8px;font-weight:800;line-height:1.2}
.passage .subtitle{font-size:15px;color:var(--ink-soft);font-style:italic;margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:12px}
.passage p{margin-bottom:16px;text-align:justify}
.passage p .para-label{font-weight:800;color:var(--accent);margin-right:6px}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.q-num{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.q-type{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--ink-soft);margin-left:6px;text-transform:none;letter-spacing:0}
.q-prompt{font-size:18px;line-height:1.6;color:var(--ink);font-weight:600;margin-bottom:14px}
.q-opts{display:flex;gap:10px;flex-wrap:wrap}
.q-opt{padding:11px 20px;background:var(--bg);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.q-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.q-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);animation:shake .4s}
.q-input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q-input{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:17px;font-weight:700;color:var(--ink);background:var(--bg);outline:none}
.q-input:focus{border-color:var(--accent);background:var(--panel)}
.q-input.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.q-input.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);animation:shake .4s}
.q-textarea{width:100%;min-height:110px;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-family:'EB Garamond','Times New Roman',serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);outline:none;resize:vertical}
.q-textarea:focus{border-color:var(--accent);background:var(--panel)}
.q-textarea.correct{border-color:var(--success);background:var(--success-soft)}
.q-textarea.wrong{border-color:var(--error);background:var(--error-soft)}
.q-feedback{margin-top:12px;padding:11px 16px;border-radius:10px;font-size:16px;font-weight:600;display:none}
.q-feedback.correct{background:var(--success-soft);color:var(--success);display:block;border-left:4px solid var(--success)}
.q-feedback.wrong{background:var(--error-soft);color:var(--error);display:block;border-left:4px solid var(--error)}
.q-feedback.info{background:rgba(255,152,0,.12);color:#a26a00;display:block;border-left:4px solid var(--warn)}
html.dark .q-feedback.info{color:#f5c66b}
.q-feedback .exp{display:block;font-weight:600;font-size:15px;color:var(--ink-soft);margin-top:6px;font-style:normal}
.q-feedback .sample{display:block;font-weight:600;font-size:15px;color:var(--ink);margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;font-style:italic}
.tfng-opts{display:flex;gap:8px;flex-wrap:wrap}
.tfng-opts .q-opt{padding:9px 16px;font-size:15px}
.review-btn-row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<script>
/* ================== FIREBASE ================== */
const firebaseConfig={apiKey:"AIzaSyDL3lnUdhKBqAPEoiJjBnpGqU1ol4Fwa7w",authDomain:"sabina-s-workspace.firebaseapp.com",databaseURL:"https://sabina-s-workspace-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sabina-s-workspace",storageBucket:"sabina-s-workspace.firebasestorage.app",messagingSenderId:"64645562064",appId:"1:64645562064:web:2c5b5a37b5ab9a685be8d5"};
let fbApp=null,fbDb=null,sessionRef=null,activityRef=null,commandRef=null,fbConnected=false;
const TEACHER_EMAILS=['alibek.alpysbayev@gmail.com'];
const teacherPreviewRequested=new URLSearchParams(window.location.search).get('teacher')==='1';
let teacherMode=teacherPreviewRequested,teacherCanEdit=false,curriculumCache={};

/* ================== CURRICULUM (9 stages) ================== */
const CURRICULUM=[{year:"2026",months:[{month:"October",lessons:[{id:"lesson_1",title:"Lesson 1: Natural Disasters — Vocabulary, Reading & Tenses",stages:[
  {id:1,label:'Natural Disasters Vocabulary',sub:'Cards',icon:'🌪️'},
  {id:2,label:'Word Match',sub:'Drag',icon:'🔗'},
  {id:3,label:'Reading & Questions',sub:'Article + practice',icon:'📖'},
  {id:4,label:'Completing Sentence — Present Perfect',sub:'Grammar',icon:'⏳'},
  {id:5,label:'Completing Sentence — Passive Voice',sub:'Grammar',icon:'🛡️'},
  {id:6,label:'Sentence Builder — Present Perfect',sub:'Build',icon:'🧩'},
  {id:7,label:'Sentence Builder — Passive',sub:'Build',icon:'🧱'},
  {id:8,label:'Completing Sentence — Choose the Tense',sub:'Mixed',icon:'🧭'},
  {id:9,label:'Lesson 1 — Test Your Knowledge',sub:'Timed test',icon:'⚡'}
]}]}]}];

/* ================== STATE ================== */
const state={currentYear:"2026",currentMonth:"October",currentLessonId:"lesson_1",currentStage:1,scores:{},done:{},sessionStart:Date.now(),streak:0,lastAction:''};
CURRICULUM.forEach(function(y){y.months.forEach(function(m){m.lessons.forEach(function(l){l.stages.forEach(function(s){const k=l.id+"_"+s.id;state.scores[k]=0;state.done[k]=false})})})});
function getCurrentLesson(){const y=CURRICULUM.find(function(x){return x.year===state.currentYear});if(!y)return null;const m=y.months.find(function(x){return x.month===state.currentMonth});if(!m)return null;return m.lessons.find(function(l){return l.id===state.currentLessonId})||null}
function totalScore(){const l=getCurrentLesson();if(!l)return 0;return l.stages.reduce(function(s,st){return s+(state.scores[l.id+"_"+st.id]||0)},0)}

/* ================== FIREBASE INIT ================== */
function initFirebase(){
  try{
    fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.database();
    const lessonId=new URLSearchParams(window.location.search).get('lesson')||localStorage.getItem('nd_current_lesson');
    if(lessonId)fbDb.ref('curriculum/'+lessonId+'/flashcardImages').on('value',function(s){customImages=s.val()||{};renderFlashcards();if(document.getElementById('fcModal').classList.contains('open'))renderQuizModal()});
    fbDb.ref('curriculum').on('value',function(s){curriculumCache=s.val()||{};renderSidebar()});
    if(teacherPreviewRequested){
      document.querySelector('.session-input').style.display='none';
      firebase.auth().onAuthStateChanged(function(user){
        teacherCanEdit=!!(user&&TEACHER_EMAILS.includes(String(user.email||'').toLowerCase()));
        teacherMode=teacherCanEdit;
        if(teacherCanEdit){updateSyncUI('teacher');document.getElementById('timerPill').style.display='none';document.getElementById('scorePill').style.display='none';document.getElementById('streakPill').style.display='none';renderStage()}
        else{teacherMode=true;updateSyncUI('error');document.getElementById('main').innerHTML='<div class="card"><h2>Teacher sign-in required</h2></div>'}
      });
      return;
    }
    firebase.auth().onAuthStateChanged(function(user){
      if(!user){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>Please sign in</h2><p style="color:var(--ink-soft);margin-bottom:22px">Open the <a href="portal.html" style="color:var(--accent);font-weight:700">student portal</a> to sign in with Google, then come back.</p></div>';return}
      const code=getSessionCode();
      if(!code){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>No lesson selected</h2><p style="color:var(--ink-soft)">Please open this lesson from your portal.</p></div>';return}
      firebase.database().ref('students/'+code).once('value').then(function(snap){
        const s=snap.val();
        if(!s||s.uid!==user.uid){document.getElementById('main').innerHTML='<div class="card" style="max-width:520px;margin:80px auto;text-align:center;padding:34px"><h2>Access denied</h2><p style="color:var(--ink-soft)">Your account is not linked to this student code.</p></div>';return}
        startStudentSession(code);
      });
    });
  }catch(e){console.error(e);updateSyncUI('error')}
}
function startStudentSession(code){
  if(!code){updateSyncUI('nocode');return}
  sessionRef=fbDb.ref('sessions/'+code);
  activityRef=sessionRef.child('activity');
  commandRef=sessionRef.child('command');
  commandRef.on('value',function(snap){const cmd=snap.val();if(!cmd)return;applyTeacherResetCommand(cmd);if(cmd.action==='goto'&&cmd.stage&&cmd.ts>Date.now()-10000)goToStage(cmd.stage)});
  fbConnected=true;updateSyncUI('live');pushFullState();
}
function getSessionCode(){const u=new URLSearchParams(window.location.search).get('code');if(u){if(!teacherPreviewRequested)localStorage.setItem('nd_session_code',u.toUpperCase());return u.toUpperCase()}return (localStorage.getItem('nd_session_code')||'').toUpperCase()}
function changeSessionCode(){const i=document.getElementById('sessionCodeInput');const c=(i.value||'').toUpperCase().trim();if(!c){localStorage.removeItem('nd_session_code');updateSyncUI('nocode');return}localStorage.setItem('nd_session_code',c);if(!fbDb){initFirebase();return}if(sessionRef)sessionRef.off();if(commandRef)commandRef.off();startStudentSession(c)}
function updateSyncUI(s){const d=document.getElementById('syncDot');const t=document.getElementById('syncStatus');d.classList.remove('warn','off');if(s==='live')t.textContent='Live · Connected';else if(s==='teacher')t.textContent='Teacher preview';else if(s==='nocode'){d.classList.add('warn');t.textContent='Set code above'}else if(s==='error'){d.classList.add('off');t.textContent='Error'}}
function applyTeacherResetCommand(cmd){if(!cmd||cmd.action!=='reset'||!cmd.ts)return;const k='nd_teacher_reset_seen_'+getSessionCode();let s=0;try{s=Number(localStorage.getItem(k)||0)}catch(e){}if(Number(cmd.ts)<=s)return;try{localStorage.setItem(k,String(cmd.ts))}catch(e){}teacherReset()}
function teacherReset(){Object.keys(state.scores).forEach(function(k){state.scores[k]=0});Object.keys(state.done).forEach(function(k){state.done[k]=false});state.currentStage=1;state.streak=0;vocabState={};customImages={};document.getElementById('notesArea').value='';updateHUD();renderSidebar();renderStage();saveState()}

/* ================== AUDIO + TTS ================== */
let audioCtx=null,soundOn=true;
function playTone(f,d,t,v){if(!soundOn)return;t=t||'sine';v=v||.12;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sCorrect(){playTone(660,.12);setTimeout(function(){playTone(880,.18)},100)}
function sWrong(){playTone(180,.25,'sawtooth',.08)}
function sWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,.2)},i*110)})}
function sFlip(){playTone(500,.08,'sine',.06)}
function sPop(){playTone(700,.06,'sine',.05)}
function confetti(){const colors=['#ee5a24','#ff6b6b','#2a5298','#28a745','#ffd700','#6a3093'];for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.top='-20px';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=Math.random()*.5+'s';c.style.width=(Math.random()*8+6)+'px';c.style.height=(Math.random()*8+6)+'px';if(Math.random()>.5)c.style.borderRadius='50%';document.body.appendChild(c);setTimeout(function(){c.remove()},3600)}}

let ukVoice=null;
function pickUKVoice(){if(!('speechSynthesis' in window))return null;const v=window.speechSynthesis.getVoices();return v.find(function(x){return x.lang==='en-GB'})||v.find(function(x){return x.lang&&x.lang.toLowerCase().startsWith('en-gb')})||v.find(function(x){return x.name&&/british|uk|england|daniel|kate|serena|oliver|libby|sonia/i.test(x.name)})||null}
if('speechSynthesis' in window){ukVoice=pickUKVoice();window.speechSynthesis.onvoiceschanged=function(){ukVoice=pickUKVoice()}}
function speak(text){if(!soundOn)return;if(!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;u.pitch=1;if(ukVoice)u.voice=ukVoice;window.speechSynthesis.speak(u)}catch(e){}}

let ttsState='idle',ttsUtterId=0,ttsFullText='',ttsCharStart=0;
function speakLong(text){
  if(!soundOn)return;
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    ttsUtterId++;
    const myId=ttsUtterId;
    const raw=text!==undefined?text:document.getElementById('passageBody').innerText;
    ttsFullText=String(raw).replace(/\s+/g,' ').trim();
    ttsCharStart=0;
    const u=new SpeechSynthesisUtterance(ttsFullText);
    u.lang='en-GB';u.rate=.9;u.pitch=1;
    if(ukVoice)u.voice=ukVoice;
    u.onboundary=function(e){if(ttsUtterId===myId&&typeof e.charIndex==='number')ttsCharStart=e.charIndex};
    u.onend=function(){if(ttsUtterId===myId){ttsState='idle';ttsCharStart=0;updateTTSButtons()}};
    u.onerror=function(){if(ttsUtterId===myId){ttsState='idle';updateTTSButtons()}};
    window.speechSynthesis.speak(u);
    ttsState='playing';
    updateTTSButtons();
  }catch(e){}
}
function pauseTTS(){if(!('speechSynthesis' in window))return;if(ttsState!=='playing')return;try{window.speechSynthesis.pause()}catch(e){}ttsState='paused';updateTTSButtons()}
function resumeTTS(){
  if(!('speechSynthesis' in window))return;
  if(ttsState!=='paused')return;
  ttsState='playing';
  updateTTSButtons();
  try{window.speechSynthesis.resume()}catch(e){}
  setTimeout(function(){
    if(ttsState!=='playing')return;
    if(!window.speechSynthesis.speaking||window.speechSynthesis.paused){
      try{
        window.speechSynthesis.cancel();
        ttsUtterId++;
        const myId=ttsUtterId;
        const baseOffset=ttsCharStart;
        const remaining=ttsFullText.substring(Math.max(0,baseOffset)).replace(/^\s+/,'');
        if(!remaining){ttsState='idle';updateTTSButtons();return}
        const u=new SpeechSynthesisUtterance(remaining);
        u.lang='en-GB';u.rate=.9;u.pitch=1;
        if(ukVoice)u.voice=ukVoice;
        u.onboundary=function(e){if(ttsUtterId===myId&&typeof e.charIndex==='number')ttsCharStart=baseOffset+e.charIndex};
        u.onend=function(){if(ttsUtterId===myId){ttsState='idle';ttsCharStart=0;updateTTSButtons()}};
        u.onerror=function(){if(ttsUtterId===myId){ttsState='idle';updateTTSButtons()}};
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
  },200);
}
function stopTTS(){if(!('speechSynthesis' in window))return;ttsUtterId++;try{window.speechSynthesis.cancel()}catch(e){}ttsState='idle';ttsCharStart=0;updateTTSButtons()}
function updateTTSButtons(){
  const p=document.getElementById('ttsPlay');
  const pa=document.getElementById('ttsPause');
  const r=document.getElementById('ttsResume');
  const s=document.getElementById('ttsStop');
  const setVis=function(el,on){if(!el)return;el.style.display=on?'inline-flex':'none'};
  setVis(p,ttsState==='idle');
  setVis(pa,ttsState==='playing');
  setVis(r,ttsState==='paused');
  setVis(s,ttsState!=='idle');
}

/* ================== SYNC ================== */
const CHANNEL='nd_lesson_live_v4_sabina';let bc=null;try{bc=new BroadcastChannel(CHANNEL)}catch(e){}
function broadcast(type,payload){
  if(teacherMode)return;
  if(fbConnected&&sessionRef){try{if(type==='state')sessionRef.child('state').set(Object.assign({},payload,{lastUpdate:Date.now()}));else if(type==='action'){activityRef.push(payload);sessionRef.child('state').update({score:payload.score,stage:payload.stage,lastUpdate:Date.now()})}else if(type==='notes')sessionRef.child('state').update({notes:payload.text})}catch(e){}}
  const msg={type:type,payload:payload,ts:Date.now()};
  if(bc){try{bc.postMessage(msg)}catch(e){}}
}
function pushFullState(){if(teacherMode||!fbConnected||!sessionRef)return;broadcast('state',{stage:state.currentStage,score:totalScore(),streak:state.streak,done:state.done,scores:state.scores,notes:document.getElementById('notesArea').value,elapsed:Math.floor((Date.now()-state.sessionStart)/1000)})}
function broadcastAction(type,detail){state.lastAction=detail;broadcast('action',{stage:state.currentStage,type:type,detail:detail,score:totalScore(),ts:Date.now()})}

function loadState(){try{const raw=localStorage.getItem('nd_state_sabina_v6');if(!raw)return;const p=JSON.parse(raw);if(p.currentStage)state.currentStage=p.currentStage;if(p.scores)Object.assign(state.scores,p.scores);if(p.done)Object.assign(state.done,p.done);if(p.notes)document.getElementById('notesArea').value=p.notes;if(p.dark)document.documentElement.classList.add('dark');if(p.soundOn!==undefined)soundOn=p.soundOn}catch(e){}}

/* ================== HELPERS ================== */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function escapeAttr(s){return escapeHtml(s)}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}

function flagForReview(qId,prompt,studentAnswer,autoResult,stageId,extra){

  sessionRef.child('reviewQueue').push(payload).then(function(){

}

/* ================== STAGE 1 — ADAPTIVE VOCABULARY QUIZ ================== */
let s1Filter='learning';
let vocabState={};
let vocabCloudLoaded=false;
let s1VisibleList=[];
let quizWord=null;
let quizMeanings=[];
let quizCurrentIdx=0;
let quizRoundWrongs=0;
let quizAnswers={};
let quizOptionsCache={};
let quizHintShown=false;
let quizRoundFinalized=false;
let practiceMode=false;
let practiceQueue=[];
let practiceIdx=0;

function vocabKey(){return 'nd_vocab_'+state.currentLessonId}
function loadVocabStateLocal(){try{const r=localStorage.getItem(vocabKey());vocabState=r?JSON.parse(r)||{}:{}}catch(e){vocabState={}}}
function loadVocabStateCloud(){
  if(!fbConnected||!sessionRef)return Promise.resolve();
  return sessionRef.child('state/vocabProgress/'+state.currentLessonId).once('value').then(function(snap){
    const cloud=snap.val()||{};
    Object.keys(cloud).forEach(function(w){vocabState[w]=cloud[w]});
    saveVocabStateLocal();
  }).catch(function(){});
}
function saveVocabStateLocal(){try{localStorage.setItem(vocabKey(),JSON.stringify(vocabState))}catch(e){}}
function saveVocabStateCloud(){if(!fbConnected||!sessionRef||teacherMode)return;try{sessionRef.child('state/vocabProgress/'+state.currentLessonId).set(vocabState).catch(function(){})}catch(e){}}
function saveVocabState(){saveVocabStateLocal();saveVocabStateCloud()}

function getWordStatus(word){
  const s=vocabState[word];
  if(!s)return 'learning';
  if((s.perfectStreak||0)>=2)return 'learned';
  if((s.wrongCount||0)>=2)return 'practice';
  return 'learning';
}
function getVocabCounts(){
  const c={learning:0,learned:0,practice:0};
  VOCAB.forEach(function(w){c[getWordStatus(w.en)]++});
  return c;
}
function shouldShowPractice(){
  if(!Object.keys(vocabState).length)return false;
  return Object.keys(vocabState).some(function(w){return getWordStatus(w)!=='learned'});
}

function renderStage1(){
  loadVocabStateLocal();
  const main=document.getElementById('main');
  if(!main)return;
  main.innerHTML='';
  const v=document.createElement('div');v.className='stage-view active';
  const counts=getVocabCounts();
  const showPractice=shouldShowPractice();
  v.innerHTML='<div class="eyebrow">Stage 1 — Vocabulary Quiz</div><h2>🌪️ Adaptive Vocabulary</h2>'+
  '<div class="lead">Every card is a small quiz. Choose the correct translation for each meaning of the word. Your answers automatically sort cards into three sections — <b>Learning</b>, <b>Learned</b>, and <b>Need Practice</b>.<span class="ru">Каждая карточка — небольшой тест. Ваши ответы автоматически сортируют карточки по трём разделам.</span></div>'+
  '<div class="flash-toolbar">'+
  '<button class="filt '+(s1Filter==='learning'?'active':'')+'" onclick="setFilter(\'learning\')">📖 Learning ('+counts.learning+')</button>'+
  '<button class="filt '+(s1Filter==='learned'?'active':'')+'" onclick="setFilter(\'learned\')">✓ Learned ('+counts.learned+')</button>'+
  '<button class="filt '+(s1Filter==='practice'?'active':'')+'" onclick="setFilter(\'practice\')">🔁 Need Practice ('+counts.practice+')</button>'+
  '<button class="btn practice-btn'+(showPractice?' show':'')+'" onclick="startPractice()">🎯 Practise</button>'+
  '</div><div class="flash-grid" id="flashGrid"></div>';
  main.appendChild(v);main.appendChild(stageFooter(null,2));
  renderFlashcards();
  if(fbConnected&&!vocabCloudLoaded){vocabCloudLoaded=true;loadVocabStateCloud().then(function(){renderStage()})}
}
function setFilter(f){s1Filter=f;renderStage1()}

function renderFlashcards(){
  const grid=document.getElementById('flashGrid');if(!grid)return;grid.innerHTML='';
  const list=VOCAB.filter(function(w){return getWordStatus(w.en)===s1Filter});
  s1VisibleList=list;
  if(!list.length){
    const emptyMsg=s1Filter==='learned'?'No learned words yet — keep practising.':(s1Filter==='practice'?'No words need practice. Great job!':'No words here.');
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-soft);font-size:17px">'+emptyMsg+'</div>';
    return;
  }
  list.forEach(function(w,idx){
    const card=document.createElement('div');card.className='flashcard';
    const status=getWordStatus(w.en);
    if(status==='learned')card.classList.add('known');
    if(status==='practice')card.classList.add('needs-practice');
    const img=customImages[w.en];
    card.innerHTML='<div class="flashcard-img">'+(img?'<img src="'+escapeAttr(img)+'" alt="'+escapeAttr(w.en)+'" loading="lazy" onerror="this.parentNode.textContent=\''+w.emoji+'\'">':w.emoji)+'</div><div class="flashcard-word">'+escapeHtml(w.en)+'</div>';
    card.onclick=function(){openQuiz(idx)};
    grid.appendChild(card);
  });
}

function openQuiz(idx){
  s1CurrentIdx=idx;
  const w=s1VisibleList[idx];if(!w)return;
  practiceMode=false;
  openQuizWord(w.en);
}
function openQuizWord(word){
  try{
    quizWord=word;
    quizOptionsCache={};
    quizHintShown=false;
    quizRoundFinalized=false;
    const w=VOCAB.find(function(x){return x.en===word});
    if(!w){console.warn('Word not found:',word);return}
    quizMeanings=w.meanings.slice();
    quizCurrentIdx=0;
    quizRoundWrongs=0;
    quizAnswers={};
    renderQuizModal();
    const modal=document.getElementById('fcModal');
    if(!modal){alert('Modal element missing from page');return}
    modal.classList.add('open');
    try{sFlip()}catch(e){}
    try{broadcastAction('flashcard_open',word)}catch(e){}
  }catch(err){
    console.error('openQuizWord failed:',err);
    alert('Cannot open quiz: '+err.message);
  }
}
function closeFCModal(){
  const modal=document.getElementById('fcModal');
  if(modal){
    modal.classList.remove('open');
    /* clear any leftover inline styles from older versions */
    modal.style.display='';
    modal.style.position='';
    modal.style.inset='';
    modal.style.zIndex='';
  }
  practiceMode=false;
  practiceQueue=[];
  practiceIdx=0;
  renderStage1();
}

function buildQuizOptions(word,meaningIdx){
  const key=word+'::'+meaningIdx;
  if(quizOptionsCache[key])return quizOptionsCache[key];
  const v=VOCAB.find(function(x){return x.en===word});if(!v)return{options:[],correct:''};
  const correctRu=v.meanings[meaningIdx].ru;
  const pool=[];
  VOCAB.forEach(function(w){
    if(w.en===word)return;
    w.meanings.forEach(function(m){if(m.ru!==correctRu)pool.push(m.ru)});
  });
  const unique=Array.from(new Set(pool));
  const distractors=shuffle(unique).slice(0,3);
  const options=shuffle(distractors.concat([correctRu]));
  const result={options:options,correct:correctRu};
  quizOptionsCache[key]=result;
  return result;
}

function renderQuizModal(){
  const w=VOCAB.find(function(x){return x.en===quizWord});if(!w)return;
  const meaning=w.meanings[quizCurrentIdx];
  const displayWord=meaning.displayEn||w.en;
  const img=customImages[w.en];
  document.getElementById('fcModalImg').innerHTML=(img?'<img src="'+escapeAttr(img)+'" alt="'+escapeAttr(w.en)+'" onerror="this.parentNode.innerHTML=\'<div style=&quot;font-size:180px;line-height:1;&quot;>'+w.emoji+'</div>\'">':'<div style="font-size:180px;line-height:1;">'+w.emoji+'</div>')+'<div class="label">WORD</div>';
  document.getElementById('fcModalWord').textContent=displayWord;
  const q=buildQuizOptions(quizWord,quizCurrentIdx);
  const answered=quizAnswers[quizCurrentIdx];
  let html='<div class="quiz-progress">'+(practiceMode?'Practice · ':'')+'Meaning '+(quizCurrentIdx+1)+' of '+w.meanings.length+'</div>';
  html+='<div class="quiz-hint-row"><button class="quiz-hint-btn" onclick="toggleQuizHint()">'+(quizHintShown?'🙈 Hide hint':'💡 Show hint')+'</button></div>';
  if(quizHintShown){
    html+='<div class="quiz-context"><span class="hint-label">Hint · English meaning</span>'+escapeHtml(meaning.context)+'</div>';
  }
  html+='<div class="quiz-question">Choose the correct translation:</div>';
  html+='<div class="quiz-options">';
  q.options.forEach(function(opt){
    let cls='quiz-opt';
    if(answered){
      if(opt===q.correct)cls+=' correct';
      else if(opt===answered.selected&&!answered.correct)cls+=' wrong';
    }
    html+='<button class="'+cls+'" '+(answered?'disabled':'')+' data-opt="'+escapeAttr(opt)+'" onclick="answerQuiz(this)">'+escapeHtml(opt)+'</button>';
  });
  html+='</div>';
  if(answered){
    const exClean=meaning.ex.replace(/<[^>]*>/g,'');
    if(answered.correct){html+='<div class="q-feedback correct" style="display:block">✓ Correct!<span class="exp">'+escapeHtml(exClean)+'</span></div>'}
    else{html+='<div class="q-feedback wrong" style="display:block">✗ Not quite. Correct answer: <b>'+escapeHtml(q.correct)+'</b><span class="exp">'+escapeHtml(exClean)+'</span></div>'}
  }
  document.getElementById('fcRevealArea').innerHTML=html;
  document.getElementById('fcRevealArea').classList.add('show');
  document.getElementById('fcCounter').textContent=(quizCurrentIdx+1)+' / '+w.meanings.length;
  document.querySelector('.fc-modal-actions').style.display='none';
  const tools=document.querySelector('.fc-modal-tools');
  if(tools){
    tools.innerHTML='<button class="tool" onclick="quizSpeak()">🔊 Listen</button>'+
      (teacherCanEdit?'<button class="tool" onclick="editFlashcardImage()">🖼️ Set image</button>':'');
  }
  const nav=document.querySelector('.fc-modal-nav');if(nav)nav.style.display='';
  const navBtns=document.querySelectorAll('.fc-modal-nav button');
  if(navBtns.length>=2){
    navBtns[0].onclick=function(){quizPrev()};
    navBtns[navBtns.length-1].onclick=function(){quizNext()};
    navBtns[navBtns.length-1].textContent=(quizCurrentIdx>=w.meanings.length-1)?'Finish →':'Next →';
  }
}

function answerQuiz(btn){
  if(quizAnswers[quizCurrentIdx])return;
  const opt=btn.dataset.opt;
  const w=VOCAB.find(function(x){return x.en===quizWord});if(!w)return;
  const q=buildQuizOptions(quizWord,quizCurrentIdx);
  const correct=opt===q.correct;
  quizAnswers[quizCurrentIdx]={selected:opt,correct:correct};
  if(!vocabState[quizWord])vocabState[quizWord]={perfectStreak:0,wrongCount:0,meaningsCorrect:{}};
  if(correct){
    vocabState[quizWord].meaningsCorrect[quizCurrentIdx]='correct';
    sCorrect();
  }else{
    quizRoundWrongs++;
    sWrong();
  }
  saveVocabState();
  renderQuizModal();
  broadcastAction('vocab_answer',quizWord+' → '+(correct?'correct':'wrong'));
}

function quizNext(){
  if(!quizAnswers[quizCurrentIdx])return;
  const w=VOCAB.find(function(x){return x.en===quizWord});if(!w)return;
  if(quizCurrentIdx<w.meanings.length-1){quizCurrentIdx++;quizHintShown=false;renderQuizModal()}
  else{finalizeRound()}
}
function quizPrev(){if(quizCurrentIdx>0){quizCurrentIdx--;quizHintShown=false;renderQuizModal()}}
function toggleQuizHint(){quizHintShown=!quizHintShown;renderQuizModal()}

function finalizeRound(){
  if(!quizWord)return;
  if(quizRoundFinalized)return;
  quizRoundFinalized=true;
  const s=vocabState[quizWord];if(!s)return;
  if(quizRoundWrongs===0){
    s.perfectStreak=(s.perfectStreak||0)+1;
  }else{
    s.perfectStreak=0;
    s.wrongCount=(s.wrongCount||0)+quizRoundWrongs;
  }
  if((s.perfectStreak||0)>=2){s.wrongCount=0}
  saveVocabState();
  const learned=VOCAB.filter(function(x){return getWordStatus(x.en)==='learned'}).length;
  const key=state.currentLessonId+"_1";
  if(learned>=15&&!state.done[key]){setScore(1,10);markDone(1)}
  else{setScore(1,Math.min(10,Math.floor(learned/1.5)))}
  broadcastAction('vocab_round_done',quizWord+' ('+getWordStatus(quizWord)+')');

  if(practiceMode){
    practiceIdx++;
    if(practiceIdx<practiceQueue.length){
      setTimeout(function(){openQuizWord(practiceQueue[practiceIdx].en)},400);
      return;
    }
    /* Queue finished — check if anything still needs practice and cycle again */
    setTimeout(continuePracticeQueue,400);
    return;
  }
  /* Not in practice mode: auto-advance to the next card in the current filter */
  setTimeout(advanceToNextCard,400);
}

function advanceToNextCard(){
  if(!s1VisibleList||!s1VisibleList.length){closeFCModal();return}
  if(s1CurrentIdx<s1VisibleList.length-1){
    s1CurrentIdx++;
    openQuizWord(s1VisibleList[s1CurrentIdx].en);
  }else{
    closeFCModal();
  }
}

function continuePracticeQueue(){
  const stillNeeds=VOCAB.filter(function(w){
    const st=getWordStatus(w.en);
    if(st==='practice')return true;
    if(st==='learning'&&vocabState[w.en])return true;
    return false;
  });
  if(!stillNeeds.length){
    showPracticeSummary();
    return;
  }
  /* Cycle: reshuffle the remaining cards and keep going */
  practiceQueue=shuffle(stillNeeds);
  practiceIdx=0;
  openQuizWord(practiceQueue[0].en);
}
function advanceToNextCard(){
  if(!s1VisibleList||!s1VisibleList.length){closeFCModal();return}
  if(s1CurrentIdx<s1VisibleList.length-1){
    s1CurrentIdx++;
    openQuizWord(s1VisibleList[s1CurrentIdx].en);
  }else{
    closeFCModal();
  }
}

function showPracticeSummary(){
  const counts=getVocabCounts();
  document.getElementById('fcModalImg').innerHTML='<div style="font-size:120px;line-height:1">🎉</div>';
  document.getElementById('fcModalWord').textContent='Practice complete!';
  document.getElementById('fcRevealArea').innerHTML='<div style="text-align:left"><p style="font-size:17px;color:var(--ink);margin-bottom:12px">Great work! Here is where you stand now:</p>'+
    '<div style="padding:14px;background:var(--bg);border-radius:12px">'+
    '<div style="padding:6px 0">📖 Learning: <b style="color:var(--accent)">'+counts.learning+'</b></div>'+
    '<div style="padding:6px 0">✓ Learned: <b style="color:var(--success)">'+counts.learned+'</b></div>'+
    '<div style="padding:6px 0">🔁 Need Practice: <b style="color:var(--warn)">'+counts.practice+'</b></div>'+
    '</div></div>';
  document.getElementById('fcCounter').textContent='—';
  const nav=document.querySelector('.fc-modal-nav');if(nav)nav.style.display='none';
  const tools=document.querySelector('.fc-modal-tools');
  if(tools)tools.innerHTML='<button class="tool" onclick="restartPractice()">↻ Practise again</button><button class="tool" onclick="closeFCModal()">← Back to Vocabulary</button>';
}
function restartPractice(){practiceMode=false;practiceQueue=[];document.getElementById('fcModal').classList.remove('open');setTimeout(function(){startPractice()},200)}

function startPractice(){
  try{
    const toPractice=VOCAB.filter(function(w){
      const st=getWordStatus(w.en);
      if(st==='practice')return true;
      if(st==='learning'&&vocabState[w.en])return true;
      return false;
    });
    if(!toPractice.length){
      showToast('Nothing to practise yet — open some flashcards first!');
      return;
    }
    practiceMode=true;
    practiceQueue=shuffle(toPractice);
    practiceIdx=0;
    openQuizWord(practiceQueue[0].en);
  }catch(err){
    console.error('startPractice failed:',err);
    alert('Practice could not start: '+err.message);
  }
}

function quizSpeak(){
  const w=VOCAB.find(function(x){return x.en===quizWord});
  if(w){
    const d=w.meanings[quizCurrentIdx].displayEn||w.en;
    speak(d);
  }
}

function editFlashcardImage(){
  if(!teacherCanEdit||!fbDb){alert('Sign in with the teacher account to edit.');return}

  const current=customImages[quizWord]||'';
  const url=prompt('Paste an image URL for "'+quizWord+'". Leave blank to remove the custom image.',current);
  if(url===null)return;
  const trimmed=url.trim();
  if(trimmed&&!/^https?:\/\//i.test(trimmed)){alert('URL must start with http:// or https://');return}
  const lessonId=new URLSearchParams(window.location.search).get('lesson')||localStorage.getItem('nd_current_lesson')||'lesson_1';
  fbDb.ref('curriculum/'+lessonId+'/flashcardImages/'+quizWord).set(trimmed||null).then(function(){

function renderDD(){
  const wEl=document.getElementById('ddWords'),sEl=document.getElementById('ddSlots');if(!wEl||!sEl)return;wEl.innerHTML='';sEl.innerHTML='';
  const words=shuffle(MATCH_DATA);const meanings=shuffle(MATCH_DATA);
  words.forEach(function(item){
    const d=document.createElement('div');d.className='dd-word';d.draggable=true;d.dataset.word=item.word;d.textContent=item.word;
    d.addEventListener('dragstart',function(e){if(d.classList.contains('used')){e.preventDefault();return}e.dataTransfer.setData('text/plain',item.word)});
    d.addEventListener('click',function(){if(d.classList.contains('used'))return;document.querySelectorAll('.dd-word').forEach(function(x){x.style.outline=''});d.style.outline='3px solid var(--accent)';d.style.outlineOffset='2px';window.__selDD=item.word});
    wEl.appendChild(d);
  });
  meanings.forEach(function(item){
    const s=document.createElement('div');s.className='dd-slot';s.dataset.answer=item.word;s.innerHTML='<span class="slot-label">'+escapeHtml(item.meaning)+'</span>';
    s.addEventListener('dragover',function(e){e.preventDefault();if(!s.classList.contains('correct'))s.classList.add('over')});
    s.addEventListener('dragleave',function(){s.classList.remove('over')});
    s.addEventListener('drop',function(e){e.preventDefault();s.classList.remove('over');tryPlace(e.dataTransfer.getData('text/plain'),s)});
    s.addEventListener('click',function(){if(s.classList.contains('correct'))return;if(window.__selDD){tryPlace(window.__selDD,s);window.__selDD=null;document.querySelectorAll('.dd-word').forEach(function(x){x.style.outline=''})}});
    sEl.appendChild(s);
  });
}
function tryPlace(word,slot){
  if(!word||slot.classList.contains('correct'))return;
  if(slot.dataset.answer===word){
    slot.classList.add('correct');
    slot.innerHTML='<span class="slot-label">'+slot.querySelector('.slot-label').textContent+'</span><span class="dropped-word ok">'+escapeHtml(word)+'</span>';
    document.querySelectorAll('.dd-word').forEach(function(d){if(d.dataset.word===word)d.classList.add('used')});
    sCorrect();updateDDCount();checkDDComplete();broadcastAction('match_correct',word);
  }else{slot.classList.add('wrong');sWrong();setTimeout(function(){slot.classList.remove('wrong')},500);broadcastAction('match_wrong',word+' → '+slot.dataset.answer)}
}
function updateDDCount(){const c=document.querySelectorAll('.dd-slot.correct').length;const el=document.getElementById('s2count');if(el)el.textContent=c}

function buildFlagRow(qId,prompt,answer,autoResult){
  return '<div class="review-btn-row"><button class="btn flag small" onclick="flagForReview(\'s3_'+qId+'\',\''+escapeAttr(prompt).substring(0,120)+'\',\''+escapeAttr(answer).substring(0,300)+'\',\''+autoResult+'\',3)">🚩 Flag for teacher review</button><span class="hint">If you believe your answer is correct, click here.</span></div>';
}
function checkLongAnswer(text,keywordGroups,minWords,minGroups){
  const t=norm(text);
  const words=t.split(/\s+/).filter(function(w){return w.length>0});
  if(words.length<minWords)return{pass:false,reason:'Your answer is too short. Aim for at least '+minWords+' words.',matched:0};
  let matched=0;
  keywordGroups.forEach(function(g){if(g.some(function(k){return t.indexOf(norm(k))!==-1}))matched++});
  if(matched>=minGroups)return{pass:true,matched:matched,total:keywordGroups.length};
  return{pass:false,reason:'You matched '+matched+' of '+keywordGroups.length+' key ideas. Check the passage again and try to include more.',matched:matched};
}

function renderCompletingSentence(data,stageId,prevId,nextId,title,eyebrow,formula,listHTML,lead){
  const main=document.getElementById('main');
  const v=document.createElement('div');v.className='stage-view active';
  v.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2>'+
  '<div class="g-box"><h3>Reminder</h3><div class="g-formula">'+formula+'</div><ul>'+listHTML+'</ul></div>'+
  '<div class="lead">'+lead+'</div>'+
  '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;color:var(--ink-soft)">Score: <span id="p'+stageId+'live" style="color:var(--accent);font-size:18px">0</span> / '+(data.pos.length+data.neg.length+data.q.length+data.shuffled.length)+'</div><button class="btn ghost small" onclick="resetGrammarStage('+stageId+')">↻ Reset</button></div>'+
  '<div id="p'+stageId+'body"></div>';
  main.appendChild(v);main.appendChild(stageFooter(prevId,nextId));
  let score=0;const body=document.getElementById('p'+stageId+'body');
  function addSection(heading,items,startNum){
    if(heading){const h=document.createElement('div');h.className='section-head';h.textContent=heading;body.appendChild(h)}
    items.forEach(function(item,i){
      const card=document.createElement('div');card.className='q-card';
      card.innerHTML='<div class="q-num">Question '+(startNum+i)+'</div><div class="q-prompt">'+escapeHtml(item.p).replace('___','<b style="color:var(--accent)">___</b>')+'</div>';
      const row=document.createElement('div');row.className='q-input-row';
      const inp=document.createElement('input');inp.type='text';inp.className='q-input';inp.placeholder='Type the missing word(s)...';inp.autocomplete='off';inp.spellcheck=false;
      const btn=document.createElement('button');btn.className='btn';btn.textContent='✓ Check';
      const fb=document.createElement('div');fb.className='q-feedback';
      let answered=false;
      function submit(){
        if(answered)return;
        const val=norm(inp.value);
        const ans=norm(item.a);
        if(val===ans){
          inp.classList.add('correct');inp.disabled=true;btn.disabled=true;answered=true;
          fb.className='q-feedback correct';fb.innerHTML='✓ Correct!'+(item.ex?'<span class="exp">'+item.ex+'</span>':'');
          sCorrect();score++;document.getElementById('p'+stageId+'live').textContent=score;
          const total=data.pos.length+data.neg.length+data.q.length+data.shuffled.length;
          setScore(stageId,Math.floor(score*10/total));
          if(score===total){setScore(stageId,10);markDone(stageId)}
          broadcastAction('answer_correct',item.p.substring(0,40)+' → '+item.a);
        }else{
          inp.classList.add('wrong');sWrong();
          fb.className='q-feedback wrong';fb.innerHTML='✗ Not quite. Try again!';
          setTimeout(function(){inp.classList.remove('wrong')},600);
        }
      }
      btn.onclick=submit;
      inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
      inp.addEventListener('input',function(){broadcastAction('typing',item.p.substring(0,30)+' | "'+inp.value+'"')});
      row.appendChild(inp);row.appendChild(btn);
      card.appendChild(row);card.appendChild(fb);body.appendChild(card);
    });
  }
  addSection('Part 1 — Positive sentences',data.pos,1);
  addSection('Part 2 — Negative sentences',data.neg,data.pos.length+1);
  addSection('Part 3 — Questions',data.q,data.pos.length+data.neg.length+1);
  addSection('Part 4 — Mixed practice (shuffled)',shuffle(data.shuffled),data.pos.length+data.neg.length+data.q.length+1);
}

}

function updateTestTimer(){

  if(!testState.active&&!timedOut)return;

  '<div class="big">'+testState.correct+' / '+total+'</div>'+
  '<p>'+msg+' You answered <b>'+testState.correct+'</b> correctly in <b>'+mins+'m '+secs+'s</b>.</p>'+

        const isActive=lesson.id===state.currentLessonId;
        const lEl=document.createElement('div');lEl.className='lesson-item'+(isActive?' active':'');
        lEl.innerHTML='<span>📘 '+lesson.title+'</span>';
        lEl.onclick=function(){state.currentLessonId=lesson.id;state.currentStage=1;renderSidebar();renderStage()};
        list.appendChild(lEl);
        if(isActive){
          const studentCode=getSessionCode();
          const assignedHW=Object.keys(curriculumCache||{}).map(function(id){return curriculumCache[id]}).filter(function(it){return it&&it.homework&&it.published!==false&&(!Array.isArray(it.assignedTo)||!it.assignedTo.length||it.assignedTo.indexOf(studentCode)!==-1)});
          if(assignedHW.length){
            const hwList=document.createElement('div');hwList.className='homework-sub-list';
            hwList.innerHTML='<div class="homework-sub-label">Homework</div>'+assignedHW.map(function(it){
              const id=it.id||Object.keys(curriculumCache).find(function(k){return curriculumCache[k]===it});
              const url=new URL(it.customUrl||'homework.html',window.location.href);
              url.searchParams.set('lesson',id);if(studentCode)url.searchParams.set('code',studentCode);
              return '<a class="homework-sub-item" href="'+escapeAttr(url.href)+'">📝 '+escapeHtml(it.title||'Homework')+' ↗</a>';
            }).join('');
            hwList.addEventListener('click',function(e){e.stopPropagation()});
            list.appendChild(hwList);
          }
          const sub=document.createElement('div');sub.className='stage-sub-list';
          lesson.stages.forEach(function(st){
            const key=lesson.id+"_"+st.id;
            const isA=st.id===state.currentStage;const isD=state.done[key];
            const stEl=document.createElement('button');
            stEl.className='stage-sub-item'+(isA?' active':'')+(isD?' done':'');
            stEl.innerHTML='<span class="icon">'+st.icon+'</span> <span>'+st.label+'</span>';
            stEl.onclick=function(){goToStage(st.id)};
            sub.appendChild(stEl);
          });
          list.appendChild(sub);
        }
      });
    });
  });
}
function goToStage(n){
  if(testState.active){
    if(!confirm('⚠️ You are in the middle of a timed test. Leaving this page will abandon your test and discard your progress. Are you sure you want to leave?')) return;
    endTest(true, 'Test aborted: you navigated away.');
  }
  state.currentStage=n;renderSidebar();renderStage();const m=document.getElementById('main');if(m)m.scrollTo({top:0,behavior:'smooth'});broadcastAction('stage_open','Stage '+n);
}
function renderStage(){
  const main=document.getElementById('main');if(!main)return;main.innerHTML='';
  const fns={1:renderStage1,2:renderStage2,3:renderStage3,4:renderStage4,5:renderStage5,6:renderStage6,7:renderStage7,8:renderStage8,9:renderStage9};
  try{fns[state.currentStage]()}catch(e){console.error(e);main.innerHTML='<p>Error loading stage.</p>'}
}
function stageFooter(prevId,nextId,extraHTML){
  const f=document.createElement('div');f.className='stage-footer';let html='';
  if(prevId)html+='<button class="btn ghost" onclick="goToStage('+prevId+')">← Previous</button>';else html+='<span></span>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'+(extraHTML||'')+'</div>';
  if(nextId)html+='<button class="btn" onclick="goToStage('+nextId+')">Next →</button>';else html+='<span></span>';
  f.innerHTML=html;return f;
}
function startTimer(){
  setInterval(function(){
    const elapsed=Math.floor((Date.now()-state.sessionStart)/1000);
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    const el=document.getElementById('timerDisplay');if(el)el.textContent=m+':'+s;
  },1000);
}
function toggleSound(){soundOn=!soundOn;const st=document.getElementById('soundToggle');if(st){st.classList.toggle('active',soundOn);st.textContent=soundOn?'🔊':'🔇'}saveState()}
function toggleDark(){document.documentElement.classList.toggle('dark');const dt=document.getElementById('darkToggle');if(dt)dt.classList.toggle('active',document.documentElement.classList.contains('dark'));saveState()}
function toggleNotes(){const np=document.getElementById('notesPanel');if(np)np.classList.toggle('open')}
document.getElementById('notesArea').addEventListener('input',function(){saveState();broadcast('notes',{text:this.value})});
function showToast(text){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:white;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center';document.body.appendChild(t)}
  t.textContent=text;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)'},2200);
}

/* ================== INIT ================== */
if(!teacherPreviewRequested)loadState();
const lessonFromUrl=new URLSearchParams(window.location.search).get('lesson');
if(lessonFromUrl){state.currentLessonId=lessonFromUrl;if(!teacherPreviewRequested)localStorage.setItem('nd_current_lesson',lessonFromUrl)}
const savedCode=teacherPreviewRequested?'':getSessionCode();
if(savedCode){const sci=document.getElementById('sessionCodeInput');if(sci)sci.value=savedCode}
renderSidebar();renderStage();startTimer();updateHUD();
if(soundOn){const st=document.getElementById('soundToggle');if(st)st.classList.add('active')}
if(document.documentElement.classList.contains('dark')){const dt=document.getElementById('darkToggle');if(dt)dt.classList.add('active')}
initFirebase();
(function(){
  if(teacherPreviewRequested){const logo=document.querySelector('.logo .text');if(logo)logo.textContent='IELTS Studio';return}
  const code=getSessionCode();
  if(!code||!fbDb)return;
  fbDb.ref('students/'+code+'/name').once('value',function(snap){
    const name=snap.val();if(!name)return;
    const logo=document.querySelector('.logo .text');if(logo)logo.textContent=name;
    document.title=name+' — IELTS Studio';
  });
})();
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeFCModal();
  const modal=document.getElementById('fcModal');
  if(modal&&modal.classList.contains('open')){
    if(e.key==='ArrowRight')fcNext();
    if(e.key==='ArrowLeft')fcPrev();
    if(e.key===' '){e.preventDefault();fcReveal()}
  }
});
setInterval(function(){if(fbConnected)pushFullState()},5000);
setTimeout(pushFullState,800);

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden' && testState.active) {
    endTest(true, 'Test aborted: you switched tabs or left the window.');
  }
});
window.addEventListener('beforeunload', function(e) {
  if (testState.active) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
