<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141a25">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.googleapis.com; frame-src https://www.youtube-nocookie.com https://accounts.google.com https://*.firebaseapp.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; worker-src 'self'; manifest-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Clip Lab</title>
  <script src="js/pwa.js" defer></script>
  <script src="js/theme.js" defer></script>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/pages/clip.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Clip Lab navigation">
      <a id="backLink" href="portal.html">← Learning portal</a>
      <a id="practiceLink" href="practice.html">Practice games</a>
      <button class="theme-toggle" type="button" data-theme-toggle>☀️ Light mode</button>
    </nav>
    <div id="status" class="status" role="status" aria-live="polite">Loading your protected clip…</div>
    <article id="clipContent" hidden>
      <header class="hero">
        <div class="eyebrow">Clip Lab · <span id="level"></span></div>
        <h1 id="title"></h1>
        <p id="description"></p>
        <div id="tags" class="tags"></div>
      </header>
      <div class="layout">
        <section class="panel" aria-labelledby="videoHeading">
          <h2 id="videoHeading">Watch the official video segment</h2>
          <div id="media" class="media">
            <button id="loadVideo" type="button" aria-label="Load the official video player">Load video</button>
          </div>
          <div class="controls" aria-label="Video controls">
            <label for="speed">Playback speed</label>
            <select id="speed">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
            </select>
          </div>
          <p id="playerStatus" class="feedback" aria-live="polite">The video loads only after you choose to play it.</p>
          <section aria-labelledby="transcriptHeading">
            <h2 id="transcriptHeading">Study text</h2>
            <p id="transcriptNote" class="note"></p>
            <div class="track-switch" role="group" aria-label="Study text language">
              <button type="button" data-track="en" aria-pressed="true">English</button>
              <button type="button" data-track="native" aria-pressed="false">Translation</button>
              <button type="button" data-track="none" aria-pressed="false">Hide</button>
            </div>
            <ol id="transcript" class="transcript"></ol>
          </section>
        </section>
        <aside class="panel">
          <h2>Quick check</h2>
          <p>Answer the questions to finish this clip lesson and earn learning points.</p>
          <div id="exercises"></div>
          <button id="complete" class="completion" type="button" disabled>Complete clip lesson</button>
          <p id="result" class="feedback" aria-live="polite"></p>
          <p id="shadowNotice" class="note"></p>
        </aside>
      </div>
    </article>
  </main>
  <dialog id="vocabularyDialog" aria-labelledby="vocabularyWord">
    <h2 id="vocabularyWord"></h2>
    <p id="vocabularyTranslation"></p>
    <p id="vocabularyDefinition"></p>
    <div class="dialog-actions">
      <button id="saveWord" type="button">Save word</button>
      <button id="closeDialog" type="button">Close</button>
    </div>
    <p id="vocabularyStatus" class="feedback" aria-live="polite"></p>
  </dialog>
  <script type="module" src="js/pages/clip.js"></script>
</body>
</html>
